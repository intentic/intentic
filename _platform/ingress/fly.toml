# THE EDGE'S DEPLOYMENT, the one CI rolls on every push to main (_tools/scripts/platform/deploy-ingress.sh), and the
# reason it is tracked here rather than living in somebody's shell history: every value below is load-bearing. The app
# name has to match the deployed app, because Fly injects FLY_APP_NAME and src/peers.rs asks `<app>.internal` who the
# other machines are — that is the whole of peer discovery.
#
# THE EDGE TERMINATES TLS ITSELF (live since 2026-09-26). Fly passes raw TCP on 443 through with a PROXY v2 header naming
# the browser (src/proxy_protocol.rs), and UDP 443 straight to the QUIC door; the process presents the certificate the
# platform issued (src/certificate.rs, fetched with INGRESS_PLATFORM_TOKEN from PLATFORM_URL) on both, and declares on
# /health and on every tunnel's answer that it serves QUIC, HTTP/3 and WebTransport, which is what netd instances and editors go
# by. Fly holds no certificate for *.sbx.intentic.dev any more. fly.edge-proxy.toml beside this is the old shape behind
# Fly's HTTP proxy, kept as the emergency fallback; it is NOT a one-command rollback (README.md, "Rolling back").
#
# NO FLY PROXY, SO NO REPLAY. Every sandbox, a hosted one included, is reached down the tunnel it dials (src/edge.rs),
# and one that dials nothing answers the `no-tunnel` verdict, which is what the editor wakes a hosted sandbox on.
#
# ONE MACHINE PER REGION A SANDBOX'S OWNER IS LIKELY TO BE IN. Anycast puts a browser on the machine nearest IT and a
# tunnel on the machine nearest the sandbox, and when the two differ src/cluster.rs hands the request across. Regions are
# NOT expressible in this file (Fly removed the key); `fly scale count` places them, and README.md ("Deploying") is the
# runbook. This file is the shape of a machine, not where they are.
#
# The ports the process binds are set as secrets, not here: INGRESS_TLS_PORT=8443 (TCP, behind the PROXY header), and
# INGRESS_QUIC_PORT=443 with INGRESS_QUIC_HOST=fly-global-services, the only address Fly delivers UDP to. The QUIC port
# MUST equal the public 443: Fly rewrites only the address of a UDP packet, never its port, so a QUIC door on any other
# port receives nothing (go-live, 2026-09-26: 8443 here left HTTP/3 silent until it became 443). The plain listener
# (INGRESS_PORT, 8080) stays up for the redirect on 80. tests/fly_configs.rs holds these services, and holds this file
# and fly.edge-proxy.toml equal outside them.

app = "intentic-ingress"
primary_region = "iad"

[build]
  # Built and pushed by the `docker:release` turbo task, never by Fly. See Dockerfile.
  image = "ghcr.io/intentic/ingress:latest"

# HTTPS and the tunnels' WSS: raw TCP, TLS terminated by the process.
[[services]]
  internal_port = 8443
  protocol = "tcp"
  # NEVER AUTO-STOP THIS. A stopped edge machine is not a cold start, it is every tunnel it held dropping at once:
  # each sandbox notices, backs off and redials somewhere else, and for that window its workspace answers 502. The
  # process holds live connections and nothing else, so "started" and "ready" are the same moment (Dockerfile).
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["proxy_proto"]
    proxy_proto_options = { version = "v2" }

  [services.concurrency]
    # CONNECTIONS, NOT REQUESTS. Most of what this edge carries never finishes: one /events stream per open browser
    # window, an attach per live agent turn, a terminal, a dev server's HMR socket. The numbers are high because a
    # few hundred sandboxes with several windows each is an ordinary day, not a surge.
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "5s"

# Plain HTTP only to be sent to HTTPS; Fly's proxy answers the redirect itself. The check is TCP: an HTTP check on this
# service never reported through Fly's proxy at go-live ("waiting for status update", and the deploy timed out on it),
# while the process's own /health stays readable over TLS for deploy-ingress.sh's read-back.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "5s"

# QUIC on the same public port: a netd's tunnel (ALPN intentic-tunnel/1), a browser's HTTP/3 and WebTransport (h3).
# Fly delivers UDP only to a dedicated IPv4 (`fly ips allocate-v4`), only to fly-global-services, and only on the port
# it arrived on, so internal_port is 443 like the public one (INGRESS_QUIC_PORT=443).
[[services]]
  internal_port = 443
  protocol = "udp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 443

[[vm]]
  # The edge carries bytes and holds sockets; it parses nothing bigger than a header and stores nothing at
  # all. Memory is the resource that matters, bounded per tunnel by what flow control lets it buffer (the h2
  # windows, 1 MiB a stream and 2 MiB a session, and 256 KiB in the pump), a ceiling rather than an
  # allocation; CPU is not, which is the opposite of the sandbox machines it serves.
  size = "shared-cpu-2x"
  memory = "2gb"

# Nothing here publishes INGRESS_INTERNAL_PORT (8081). The holds protocol trusts any peer discovery knows, and
# discovery is the only lock on it: it binds FLY_PRIVATE_IP, which is unreachable from the internet by
# construction. Publishing it would be handing the cluster's registry to anyone who found the port.
