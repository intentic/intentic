# THE EDGE'S DEPLOYMENT, and the reason it is tracked here rather than living in somebody's shell history:
# every value below is load-bearing, and three of them are the difference between "the workspace is quick" and
# "the workspace hangs". The app name has to match the deployed app, because Fly injects FLY_APP_NAME and
# src/peers.rs asks `<app>.internal` who the other machines are — that is the whole of peer discovery.
#
# ONE MACHINE PER REGION A SANDBOX'S OWNER IS LIKELY TO BE IN. Every sandbox with a front door dials this app and
# is served through it, a hosted machine included (the daemon's reach-posture.ts), so the placement rule holds for
# all of them: anycast puts a browser on the machine nearest IT and a tunnel on the machine nearest the sandbox, and
# when the two differ src/cluster.rs hands the request across. A request rides a held tunnel first; only a hosted
# sandbox holding none (still booting, or between redials) is replayed by Fly's proxy from whichever edge answered
# straight to its machine (src/edge.rs). Fly's own advice for a router is "close to the user", which argues for more
# cheap machines here, not fewer.
#
# Regions are NOT expressible in this file (Fly removed the key); `fly scale count` places them, and README.md
# ("Deploying") is the runbook. This file is the shape of a machine, not where they are.

app = "intentic-ingress"
primary_region = "iad"

[build]
  # Built and pushed by the `docker:release` turbo task, never by Fly. See Dockerfile.
  image = "ghcr.io/intentic/ingress:latest"

[http_service]
  internal_port = 8080
  force_https = true

  # NEVER AUTO-STOP THIS. A stopped ingress machine is not a cold start, it is every tunnel it held dropping
  # at once: each container notices, backs off, and redials somewhere else, and for that window its owner's
  # workspace answers 502. The process holds live connections and nothing else, so there is nothing to scale
  # to zero for and nothing to warm up — "started" and "ready" are the same moment (Dockerfile). Hosted
  # sandboxes hold tunnels here too, so a restart drops theirs the same way; the replay below only carries them
  # until they redial.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  # THE REPLAY CACHE, for the one case a hosted sandbox's traffic does not come down a tunnel. A hosted sandbox
  # dials a tunnel like every other and is served through it while one is held; when none is (no edge holds it,
  # and it is not marked as reachable only by tunnel), src/edge.rs answers `fly-replay: app=<its app>` and Fly's
  # proxy delivers the request there. This rule lets the
  # proxy REMEMBER that decision per hostname (the Host header is the key, so one sandbox's route can never
  # apply to another's name) for the TTL the response names (fly-replay-cache-ttl-secs, REPLAY_CACHE_TTL_SECS),
  # after which every further request for that hostname goes browser → Fly → machine without asking here.
  # Without this rule the replay still works; the edge is simply on the head of every request, ~10 ms, and
  # a request over 1 MB cannot be replayed at all (Fly buffers what it replays). With it, the only request
  # that ever meets that limit is the first one on a hostname per TTL, which from a browser is a GET.
  [[http_service.http_options.replay_cache]]
    path_prefix = "/"
    ttl_seconds = 300
    type = "header"
    name = "host"

  [http_service.concurrency]
    # CONNECTIONS, NOT REQUESTS, and this is the trap worth naming. Fly's default counts in-flight REQUESTS,
    # and most of what this edge carries never finishes: one /events stream per open browser window, an attach
    # per live agent turn, a terminal, a dev server's HMR socket. Counted as requests they are permanently
    # in-flight, so a busy machine walks up to the hard limit and Fly's proxy stops routing to a process that
    # is perfectly healthy. Counting connections is the honest unit for a proxy, and the numbers are high
    # because a few hundred sandboxes with several windows each is an ordinary day, not a surge.
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

  [[http_service.checks]]
    # /health is answered by the process itself (src/edge.rs) with no tunnel, no platform call and no disk,
    # so it proves exactly what a load balancer needs to know and nothing that could fail for someone else's
    # reason. Deliberately NOT strict about tunnel count: a machine holding zero tunnels is a machine that was
    # just deployed, not a broken one.
    path = "/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  # The edge carries bytes and holds sockets; it parses nothing bigger than a header and stores nothing at
  # all. Memory is the resource that matters, bounded per tunnel by what flow control lets it buffer (the h2
  # windows, 1 MiB a stream and 2 MiB a session, and 256 KiB in the pump), a ceiling rather than an
  # allocation; CPU is not, which is the opposite of the sandbox machines it serves.
  size = "shared-cpu-2x"
  memory = "2gb"

# Nothing here publishes INGRESS_INTERNAL_PORT (8081). The holds protocol trusts any peer discovery knows, and
# discovery is the only lock on it: it binds FLY_PRIVATE_IP, which is unreachable from the internet by
# construction. Publishing it would be handing the cluster's registry to anyone who found the port.
