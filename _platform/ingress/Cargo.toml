# The edge every sandbox is reached through. Its own workspace, so it builds apart from the sandbox's front and shares
# only the tunnel crate, by path.
[package]
name = "intentic-ingress"
edition = "2024"
version = "0.0.0"
publish = false

[workspace]

[lib]
name = "intentic_ingress"
path = "src/lib.rs"

[[bin]]
name = "intentic-ingress"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
browser-wire = { path = "../../_sandbox/front/crates/browser-wire" }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
httparse = "1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "logging", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "server-auto", "http1", "http2", "tokio"] }
relay = { path = "../../_shared/relay" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tunnel = { path = "../../_sandbox/front/crates/tunnel" }

[dev-dependencies]
rcgen = "0.14"
toml = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
wtransport = { version = "0.7", default-features = false, features = ["ring", "dangerous-configuration"] }

# The front's trade: thin LTO and strip for size, unwind so a panicking task never takes every tunnel down with it.
[profile.release]
strip = true
lto = "thin"
panic = "unwind"
