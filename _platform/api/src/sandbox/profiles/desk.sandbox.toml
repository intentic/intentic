# The DESK profile's sandbox, as a definition (see _sandbox/sandbox/src/definition/definition.ts). A reader who came
# from intentic.dev/desk gets this applied once, at their sandbox's first boot, on an empty workspace — the daemon's own
# `definitionSeed` step, which refuses to run over work that already exists.
#
# The profile answers the look and the audience in the browser (@intentic/constants profile.ts); this file is the half
# that is a fact about the SANDBOX rather than about the browser, and so cannot live in localStorage.
#
# Extensions belong in a `[[capabilities]]` section here, which is a typed document section applied natively. NOT in a
# `[workspace]` repo: that path deliberately rewrites extension-enablement.json so everything it carries lands off,
# because a workspace repo is how a stranger's sandbox arrives and its extensions are somebody else's code.
schemaVersion = 1

# Keep finished-work defaults explicit for this profile.
[settings]
# Finished work stays on its branch until accepted, and saving a version is opt-in for every audience.
rules = []
