# The DESK profile's sandbox, as a definition (see _sandbox/sandbox/src/portability/definition.ts). A reader who came
# from intentic.dev/desk gets this applied once, at their sandbox's first boot, on an empty workspace — the daemon's own
# `definitionSeed` step, which refuses to run over work that already exists.
#
# The profile answers the look and the audience in the browser (@intentic/constants profile.ts); this file is the half
# that is a fact about the SANDBOX rather than about the browser, and so cannot live in localStorage.
#
# Extensions belong in a `[[capabilities]]` section here, which is a typed document section applied natively. NOT in a
# `[workspace]` repo: that path deliberately rewrites extension-enablement.json so everything it carries lands off,
# because a workspace repo is how a stranger's sandbox arrives and its extensions are somebody else's code.
schemaVersion = 1

# Only the agent settings that differ from their defaults.
[settings]
# THE MAKER'S CONTRACT, and the reason this file exists at all. Someone who does not write code is promised two things:
# the assistant's work applies on its own, and every change is saved so they can always go back. Those are these two
# rules. They used to be written by the arrival card that asks "how will you work here?" (components/AudienceAsk.vue) —
# but a profile that answers the audience question means that card never appears, so the rules have to arrive with the
# answer instead of behind it. Ids are the app's own well-known ones, so the Agent tab's toggles show these as on.
rules = [
    { action = { kind = "verdict", verdict = "allow" }, enabled = true, id = "auto-land", label = "Land finished work automatically", moment = "agent.finished" },
    { action = { kind = "builtin", name = "version-landed" }, enabled = true, id = "auto-version", label = "Save a version of accepted work", moment = "agent.landed" },
]
