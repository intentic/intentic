        <title>intentic — interactive demo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="robots" content="noindex" />
        <!-- ponytail: approximates the dark canvas token oklch(16% 0.007 65); regenerate if themes.css changes. -->
        <meta name="theme-color" content="#141210" />
        <!-- The runtime config the app reads synchronously at module-eval time (src/environments/environment.ts).
             Inline rather than the esbuild-bundled env.js the real entries use: the demo's whole config is two
             sentinel values, and the interceptor in src/demo/transport.ts owns that origin. No Google client id —
             the demo seeds a daemon session directly, so Identity Services is never loaded. -->
        <script>
            window.env = {
                production: true,
                api: { url: "https://api.demo.invalid" },
                auth: { googleClientId: "" },
                analytics: { posthogKey: "", posthogHost: "https://us.i.posthog.com" },
            };
        </script>
        <!-- Extension bundles resolve these bare specifiers to the app's own instances (see _apps/web/index.html).
             Prefixed with the demo's base by hand: an import map is data, not markup Vite rewrites, so an absolute
             /ext-shims path here would leave the site's root — the one place these files are not. -->

        <link rel="icon" type="image/png" href="/demo/assets/intentic-logo-sized.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

            rel="stylesheet"
        />

                    "@intentic/extension-ui": "/demo/ext-shims/extension-ui.js",

        </script>
