# Static SPA serving for the intentic web image. Cloudflare terminates TLS and compresses at the edge, so this
# is plain http with no gzip. The location blocks split caching by mutability: hashed build assets are
# immutable, the runtime-substituted env.js is never cached, and every other path falls back to index.html so
# the Vue router owns client-side routing. /wire/ reverse-proxies PostHog (see below).
#
# This file is a TEMPLATE: entrypoint.sh renders it to conf.d/default.conf, substituting exactly
# ${NGINX_RESOLVER}, ${POSTHOG_API_HOST} and ${POSTHOG_ASSETS_HOST}. Every other `$…` below is an nginx
# runtime variable and is deliberately left untouched by that restricted envsubst.

# Analytics rides our own origin because privacy blockers (EasyPrivacy — on by default in Brave Shields and
# uBlock Origin) match PostHog's hostnames outright, and a blocked recorder means the visit produces no
# session replay at all. posthog-js treats any non-cloud api_host as the "custom" region and sends BOTH
# ingestion calls and SDK asset fetches to it, so the two upstreams are split back apart here by path. Keyed
# on $request_uri, not $uri: the location below rewrites $uri, and a map is evaluated lazily at first use
# (proxy_pass) — i.e. after that rewrite has already stripped the prefix.
map $request_uri $posthog_upstream {
    default           ${POSTHOG_API_HOST};
    ~^/wire/static/   ${POSTHOG_ASSETS_HOST};
    ~^/wire/array/    ${POSTHOG_ASSETS_HOST};
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config, rewritten per-deploy by the entrypoint's envsubst — must never be cached.
    location = /assets/js/env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Content-hashed build assets (vite emits hashed filenames) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # PostHog: /wire/static/ + /wire/array/ are SDK bundles and the remote config document; everything else is
    # ingestion — /e/ and /i/v0/e/ (events) plus /s/ (session replay chunks).
    #
    # The prefix is `wire` and must stay something anonymous. Moving to our own origin only defeats the
    # HOSTNAME rules; the lists also carry path rules that match on any domain, and uBlock's privacy list has
    # a stanza (`! posthog`) doing exactly that to the paths PostHog's own proxy docs suggest —
    # `/ingest/*^ip=`, `/ingress/*^ip=`, `/hog/*^ip=`. Renaming this to any of those undoes the whole change.
    location ^~ /wire/ {
        # The upstream host reaches proxy_pass through a variable rather than as a literal, so that nginx
        # resolves it per request. A literal is resolved once at config load, which pins a single CDN IP for
        # the life of the container and — worse — makes nginx refuse to start when DNS is briefly unavailable
        # at boot, taking the whole SPA down over analytics. Per-request resolution keeps a PostHog outage a
        # 502 on /wire alone. ipv6=off because the compose network is v4-only: an AAAA lookup there fails the
        # whole resolution, not just the v6 half.
        resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
        resolver_timeout 5s;

        # Undo the `sdk.` the SPA prefixes onto every SDK script filename (see analytics.ts). Those rules are
        # anchored on a leading slash — EasyPrivacy ships bare `/posthog-recorder.js` and
        # `/dead-clicks-autocapture.js`, which match on ANY host and would otherwise still hit us here — so
        # putting one character between the `/` and the filename is enough to miss them. Done as a blanket
        # `sdk.`-strip rather than a filename table so a script posthog-js adds later needs no change here.
        rewrite ^/wire/(.*/)sdk\.([^/]+)$ /$1$2 break;
        rewrite ^/wire/(.*)$ /$1 break;

        proxy_pass https://$posthog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $posthog_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same-origin now, so the browser attaches our own cookies to these requests — drop them rather than
        # hand a third party the app's session. posthog-js runs on sessionStorage persistence (analytics.ts)
        # and never needs a cookie of its own, so nothing is lost in either direction.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        # SNI: without these the TLS handshake against the CDN offers no server name and is rejected.
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog_upstream;
        # Replay chunks are the largest thing we forward and blow past nginx's 1m default on a busy session.
        client_max_body_size 32m;
    }

    # SPA fallback: an unknown path renders index.html and the router takes over. index.html itself is
    # uncached so a new deploy's hashed asset references are picked up on the next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
