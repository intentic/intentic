<!doctype html>
<html lang="en" data-mode="dark">
    <head>
        <meta charset="utf-8" />
        <title>intentic — interactive demo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="robots" content="noindex" />
        <!-- ponytail: approximates the dark canvas token oklch(16% 0.007 65); regenerate if themes.css changes. -->
        <meta name="theme-color" content="#141210" />
        <!-- The runtime config the app reads synchronously at module-eval time (src/environments/environment.ts).
             Inline rather than the esbuild-bundled env.js the real entries use: the demo's whole config is two
             sentinel values, and the interceptor in src/demo/transport.ts owns that origin. No Google client id —
             the demo seeds a daemon session directly, so Identity Services is never loaded. -->
        <script>
            window.env = {
                production: true,
                api: { url: "https://api.demo.invalid" },
                auth: { googleClientId: "" },
                analytics: { posthogKey: "", posthogHost: "https://us.i.posthog.com" },
            };
        </script>
        <!-- Extension bundles resolve these bare specifiers to the app's own instances (see index.html). -->
        <script type="importmap">
            {
                "imports": {
                    "vue": "/ext-shims/vue.js",
                    "@intentic/extension-api": "/ext-shims/extension-api.js",
                    "@intentic/extension-ui": "/ext-shims/extension-ui.js",
                    "@tanstack/vue-query": "/ext-shims/vue-query.js"
                }
            }
        </script>
        <link rel="icon" type="image/png" href="/assets/intentic-logo-sized.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="bg-canvas text-content">
        <div id="app"></div>
        <script type="module" src="/src/demo/main.ts"></script>
        <noscript>The interactive demo needs JavaScript. Every screenshot on intentic.dev is of this same UI.</noscript>
    </body>
</html>
