# Everything a browser sees of netd and the edge. Standalone rather than inheriting netd's workspace, as the
# tunnel crate is: the edge (_platform/ingress) builds it by path from its own.
[package]
name = "browser-wire"
edition = "2024"
version = "0.0.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# The browser view's `state` carries the window's entry in the browsers list, which the daemon's contract defines and
# this crate only passes through.
serde_json = "1"
ts-rs = "12"

[dev-dependencies]
schemars = "1"
