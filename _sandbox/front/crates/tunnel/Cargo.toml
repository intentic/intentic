# Standalone rather than inheriting the front's workspace: the edge (_platform/ingress) builds it by path from its own.
[package]
name = "tunnel"
edition = "2024"
version = "0.0.0"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
relay = { path = "../../../../_shared/relay" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
