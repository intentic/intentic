# Everything a browser sees of the front and the edge. Standalone rather than inheriting the front's workspace, as the
# tunnel crate is: the edge (_platform/ingress) builds it by path from its own.
[package]
name = "browser-wire"
edition = "2024"
version = "0.0.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = "12"

[dev-dependencies]
schemars = "1"
serde_json = "1"
