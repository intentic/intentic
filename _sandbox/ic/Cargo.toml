[package]
name = "ic"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
# ureq already parses with this, so naming it here costs no bytes — and the alternative for the one host
# comparison in platform.rs is the `url` crate, whose idna tables a binary downloaded on every run would feel.
http = "1"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
# The time-limited capture the desktop app shares with this binary (bounded/src/lib.rs says why there is one).
intentic-bounded = { path = "bounded" }
# What docker's refusals mean and where Docker Desktop lives, read the same way by the desktop app (docker-host/src/lib.rs).
intentic-docker-host = { path = "docker-host" }

# The bootstrap shims download this binary on EVERY run, so size is user-visible; thin LTO + strip for the
# same build-time/size trade the desktop crate settled on (its Cargo.toml carries the measurements).
[profile.release]
strip = true
lto = "thin"

# `bounded` and `docker-host` are crates of their own because the desktop app depends on them too; members here so
# they share this crate's lock and target directory, and `cargo test --workspace` / `cargo fmt --all` reach them.
[workspace]
members = ["bounded", "docker-host"]
