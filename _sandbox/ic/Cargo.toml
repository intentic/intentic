[package]
name = "ic"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
# ureq already parses with this, so naming it here costs no bytes — and the alternative for the one host
# comparison in platform.rs is the `url` crate, whose idna tables a binary downloaded on every run would feel.
http = "1"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# The at-rest keys ic makes for its sandboxes (sandbox/at_rest.rs) are 32 bytes straight from the operating system's random
# source. tempfile already builds this crate on every platform ic runs on, so naming it adds no crate and no bytes.
getrandom = "0.4"
# The screen PIN's salted hash and its constant-time check (os/lock.rs). ureq's rustls already builds ring, so naming it
# adds no crate and no bytes.
ring = "0.17"
tempfile = "3"
# The time-limited capture the desktop app shares with this binary (bounded/src/lib.rs says why there is one).
intentic-bounded = { path = "bounded" }
# What docker's refusals mean and where Docker Desktop lives, read the same way by the desktop app (docker-host/src/lib.rs).
intentic-docker-host = { path = "docker-host" }

# The generated client owns Wayland framing and SCM_RIGHTS. Its default Rust backend needs no libwayland at runtime;
# keeping it Linux-only leaves the Windows/macOS bootstrap binary unchanged.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# sway's IPC, shared with the desktop app's shell: the screen service holds sandbox windows to their rules (os/screen.rs).
intentic-sway-ipc = { path = "sway-ipc" }

# The engine's named-pipe relay (src/engine/relay.rs) speaks TLS to the engine with its client certificate. ureq already
# builds this rustls with ring, so naming it here adds no crate and no bytes.
[target.'cfg(windows)'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# The bootstrap shims download this binary on EVERY run, so size is user-visible; thin LTO + strip for the
# same build-time/size trade the desktop crate settled on (its Cargo.toml carries the measurements).
[profile.release]
strip = true
lto = "thin"

# `bounded`, `docker-host` and `sway-ipc` are crates of their own because the desktop app depends on them too; members
# here so they share this crate's lock and target directory, and `cargo test --workspace` / `cargo fmt --all` reach them.
[workspace]
members = ["bounded", "docker-host", "sway-ipc"]
