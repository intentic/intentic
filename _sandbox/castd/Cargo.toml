# castd: one window's picture, sound and input, served on a Unix socket. A workspace of its own rather than a member of
# netd's: it links x264, libyuv, Opus and PulseAudio, which netd must keep building without. The engine is cast-core
# (no platform, builds for Windows), the X11 platform cast-x11; this package is the castd binary wiring the two.
[workspace]
members = ["crates/cast-core", "crates/cast-x11", "crates/cast-win"]

[package]
name = "castd"
edition = "2024"
version = "0.1.0"
publish = false
# The capture, encoder, flow control, input and recording code is voxl's (MIT, see LICENSE and README.md).
license = "MIT"

[lib]
name = "castd"
path = "src/lib.rs"

[[bin]]
name = "castd"
path = "src/main.rs"

[[bin]]
name = "castd-bench"
path = "src/bin/castd-bench.rs"

[features]
default = ["audio", "nvenc", "vaapi"]
# PulseAudio monitor -> Opus. Without it castd links neither library and its hello never offers sound.
audio = ["cast-core/pulse"]
# NVIDIA's hardware encoder, behind `--encoder nvenc|auto`. Builds against the ffnvcodec headers and links nothing:
# the driver's libnvidia-encode and libcuda are opened at runtime, so the binary runs where there is no NVIDIA driver.
nvenc = ["cast-core/nvenc"]
# VA-API's H.264 encoder (Intel, AMD, D3D12 on WSL2), behind `--encoder vaapi|auto`: libva is opened at runtime and its
# API is written out in cast-core, so it needs no headers and links nothing.
vaapi = ["cast-core/vaapi"]

[dependencies]
cast-core = { path = "crates/cast-core", features = ["x264", "libyuv"] }
cast-x11 = { path = "crates/cast-x11" }
browser-wire = { path = "../netd/crates/browser-wire" }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio", "query"] }
log = "0.4"
serde_json = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }

[dev-dependencies]
libc = "0.2"
png = "0.18"
x11rb = { version = "0.13", features = ["shm", "damage", "xfixes", "xtest", "xinput", "randr"] }

[build-dependencies]
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
# A panic in a connection's task ends that task and nothing else; one in the capture or encode thread ends the process
# (main.rs's hook), since a window whose picture stopped is better restarted by the daemon than left frozen.
panic = "unwind"
debug = 1

# str0m from intentic's fork, pinned to a commit: str0m's main of 2026-11-21 (20 commits past 0.25.0, among them a
# NACKed packet resent at most once a round trip and a floor under the loss-based estimate) and one commit of ours,
# StreamTx::set_proactive_rtx, which a video track turns on across long, lossy links (cast-core's README, under
# "Copies"). Proposed upstream as https://github.com/algesten/str0m/pull/1171: once a str0m release on crates.io has it, drop this
# and require that release. _devices/remoted's Cargo.toml pins the same commit.
[patch.crates-io]
str0m = { git = "https://github.com/intentic/str0m", rev = "6efe5a115384b7eb57e7caefbfaa5a3ed3c3bc07" }
