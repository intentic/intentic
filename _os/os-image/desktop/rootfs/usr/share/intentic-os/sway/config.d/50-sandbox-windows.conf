# Sway 1.11 supplies these values from security-context-v1, not from a window's self-reported title or app id.
hide_edge_borders none
client.focused          #d48a19 #6b430c #ffffff #ffca68 #d48a19
client.focused_inactive #ad7626 #503713 #ffffff #d48a19 #ad7626
client.unfocused        #ad7626 #503713 #ffffff #d48a19 #ad7626
client.urgent           #ffca68 #8a3d08 #ffffff #ffca68 #ffca68

# The kiosk hides borders by default. These windows always get an amber frame and a title, and start tiled.
for_window [sandbox_engine="^dev\.intentic\.sandbox$"] title_format "<b>%sandbox_app_id</b> · %title", border normal 3, floating disable

# A wrapper inherits this session's WAYLAND_DISPLAY and restarts a failed server. An unrelated user service would
# otherwise need the display environment imported and tied to sway's lifetime.
exec /usr/libexec/intentic-os/screen-serve
