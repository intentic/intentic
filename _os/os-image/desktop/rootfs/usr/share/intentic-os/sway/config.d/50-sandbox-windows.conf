# Sway 1.11 supplies these values from security-context-v1, not from a window's self-reported title or app id; `ic os
# screen serve` refuses to hand out sockets on an older sway, which could not mark the windows.
#
# Only sandbox windows have a frame drawn by sway on this screen (the kiosk config gives every other window, floating
# ones included, none), so these colours are theirs alone: amber means a sandbox drew it.
hide_edge_borders none
client.focused          #d48a19 #6b430c #ffffff #ffca68 #d48a19
client.focused_inactive #ad7626 #503713 #ffffff #d48a19 #ad7626
client.unfocused        #ad7626 #503713 #ffffff #d48a19 #ad7626
client.urgent           #ffca68 #8a3d08 #ffffff #ffca68 #ffca68

# These windows always get an amber frame and a title, and start tiled. Fullscreen is taken back by the screen service,
# which also closes the windows of a sandbox its owner no longer lets draw.
for_window [sandbox_engine="^dev\.intentic\.sandbox$"] title_format "<b>%sandbox_app_id</b> · %title", border normal 3, floating disable
# A sandbox window opens without the keyboard: what someone is typing into the editor or a browser never lands in it.
no_focus [sandbox_engine="^dev\.intentic\.sandbox$"]

# A wrapper inherits this session's WAYLAND_DISPLAY and restarts a failed server. An unrelated user service would
# otherwise need the display environment imported and tied to sway's lifetime.
exec /usr/libexec/intentic-os/screen-serve
