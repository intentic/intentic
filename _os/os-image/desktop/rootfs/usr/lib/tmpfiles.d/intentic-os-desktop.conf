# Owner-written sway settings the kiosk config includes (keyboard layout, outputs). The intentic user's group may write
# them: `ic os keyboard set` and `ic os display set` keep what a person chose there (40-keyboard.conf,
# 50-display.conf), run by the desktop app and the machine agent as that user, without sudo. `d` also puts an older
# machine's root-only folder right at its next boot.
d /etc/intentic/sway.d 0775 root intentic -
# The screen PIN's salted hash and its count of misses (`ic os lock`): the intentic user's alone, since the lock screen
# runs as that user and checks the PIN there. Never in sway.d, which the session's config includes.
d /var/lib/intentic-os/screen-lock 0700 intentic intentic -
