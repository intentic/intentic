# Dev images only (Containerfile.dev): systemd feeds the hardware watchdog (sp5100_tco on AMD boards, iTCO on Intel),
# so a machine that hangs resets by itself within a minute instead of waiting for somebody at the power button.
# Without a watchdog device (a VM) systemd notes it and carries on.
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=5min
