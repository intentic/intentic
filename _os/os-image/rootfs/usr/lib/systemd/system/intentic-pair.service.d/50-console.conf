# The server edition asks on its screen as well: tty1 is lent to the pairing until it succeeds, then gets its login
# prompt back. The desktop edition removes this file; its screen belongs to the Intentic app, which pairs itself.
[Unit]
Conflicts=getty@tty1.service
Before=getty@tty1.service
OnSuccess=getty@tty1.service

[Service]
ExecStart=
ExecStart=/usr/bin/ic os pair
StandardInput=tty
StandardOutput=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
