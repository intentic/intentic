# Kata's microVM boots from an initrd built on this machine for the kernel it runs (kata-osbuilder-generate checks,
# and builds only when that kernel has none yet: the first boot, and the first after an update that moved it). Docker
# waits for it, so a sandbox that runs as a microVM never starts before its initrd exists. The unit's own [Install]
# names kubelet, which this OS does not have, so it is pulled in here rather than enabled.
[Unit]
Wants=kata-osbuilder-generate.service
After=kata-osbuilder-generate.service
