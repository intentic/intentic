# The intentic user's home, its user manager started at boot without a login (linger), and the state ic os keeps.
d /var/home/intentic 0700 intentic intentic -
f /var/lib/systemd/linger/intentic 0644 root root -
d /var/lib/intentic-os 0775 root intentic -
d /etc/intentic 0755 root root -
# kata-osbuilder-generate.service builds the microVM initrd here at boot.
d /var/cache/kata-containers 0755 root root -
