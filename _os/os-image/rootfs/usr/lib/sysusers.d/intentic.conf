# The account Intentic runs as on Intentic OS: ic, the first-boot pairing and the machine agent (a systemd user
# service, started at boot by linger). In the docker group, which is root on this machine in all but name, and with
# sudo for bootc and reboot only (/etc/sudoers.d/intentic-os).
g intentic 1990
u intentic 1990:1990 "Intentic" /var/home/intentic /bin/bash
m intentic docker
# In the audio group so its sound server (PipeWire, started by its user manager at boot) can open the sound card with
# nobody signed in at the screen: the seat's own access (logind's uaccess) is only granted to a session on it, and the
# machine agent's `ic os sound` calls come from no session.
m intentic audio
