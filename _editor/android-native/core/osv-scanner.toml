# OSV/Scorecard triage only for advisories with no released fix to move to; recheck at ignoreUntil.
# Remove entries when fixes ship or when the advisory stops matching (package gone from Cargo.lock, advisory withdrawn).
# Do not suppress reachable, patchable vulnerabilities here.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0253"
ignoreUntil = 2027-05-24
reason = "lru 0.16: LruCache::pop() is unsound only if a key or value panics in Drop mid-pop. Reached through glyphon 0.12 (the newest, which requires lru ^0.16.2) behind the optional `surface` feature; its keys are glyph cache ids with no custom Drop. The fix is lru 0.18, which glyphon does not accept."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
ignoreUntil = 2027-05-24
reason = "bincode 1.3 is unmaintained, not vulnerable. syntect 5.3 (the newest) uses it to load its own bundled syntax and theme dumps, never data from outside the binary."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0320"
ignoreUntil = 2027-05-24
reason = "yaml-rust 0.4 is unmaintained, not vulnerable. syntect 5.3 (the newest) pulls it in for .sublime-syntax loading; this crate only uses syntect's bundled dumps."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
ignoreUntil = 2027-05-24
reason = "ttf-parser 0.25 is unmaintained, not vulnerable. Reached through glyphon 0.12 -> cosmic-text -> fontdb (all newest) behind the optional `surface` feature, parsing the app's own bundled fonts."
