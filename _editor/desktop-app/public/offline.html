<!doctype html>
<!--
    The workspace that cannot be reached (src-tauri/src/offline.rs sends a page window here when its navigation fails
    for a network reason, or answers with a dead platform's 5xx: `status` is WebView2's name for the failure, or
    `http-<code>`). It goes back the moment the workspace answers with something usable, and closes through the same
    intentic:// link the workspace's own title bar uses. The window wears the platform's frame while this is up. Where
    the app has its own copy of the editor (`face`, src-tauri/src/machine_face.rs) it also offers this computer's own
    sandboxes, which work with no internet at all.

    Whether the workspace answers is the app's to say (`machine_face_online`, granted to the workspace window's local
    pages by capabilities/machine-face.json): a no-cors fetch settles on ANY answer and cannot read its status, so it
    took Cloudflare's 530 for a dead platform as the workspace being back, went there, and was sent straight back here.
    The fetch stays only for an app that does not grant the command.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Intentic</title>
        <style>
            @font-face {
                font-family: "Public Sans";
                src: url("/fonts/public-sans-100-900-latin-ext.woff2") format("woff2");
                font-weight: 100 900;
            }
            :root {
                color-scheme: light dark;
                --canvas: #f7f7f5;
                --content: #1c1c1a;
                --subtle: #6b6b66;
                --line: #dcdcd6;
                --link: #2f5bd8;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --canvas: #161615;
                    --content: #ececea;
                    --subtle: #9a9a94;
                    --line: #33332f;
                    --link: #8aa6ff;
                }
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                display: grid;
                place-items: center;
                background: var(--canvas);
                color: var(--content);
                font: 14px/1.5 "Public Sans", system-ui, sans-serif;
            }
            main {
                max-width: 26rem;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
            }
            h1 {
                font-size: 1.125rem;
                font-weight: 600;
                margin: 0;
            }
            p {
                margin: 0;
                color: var(--subtle);
            }
            .status {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.8125rem;
                font-variant-numeric: tabular-nums;
            }
            .dot {
                width: 0.5rem;
                height: 0.5rem;
                border-radius: 50%;
                background: var(--link);
                animation: pulse 1.6s ease-in-out infinite;
            }
            @keyframes pulse {
                50% {
                    opacity: 0.25;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .dot {
                    animation: none;
                }
            }
            .actions {
                display: flex;
                gap: 0.5rem;
                margin-top: 0.5rem;
            }
            button {
                font: inherit;
                padding: 0.4rem 0.9rem;
                border-radius: 0.375rem;
                border: 1px solid var(--line);
                background: transparent;
                color: var(--content);
                cursor: pointer;
            }
            button.primary {
                background: var(--link);
                border-color: var(--link);
                color: #fff;
            }
            button:focus-visible {
                outline: 2px solid var(--link);
                outline-offset: 2px;
            }
            code {
                font-size: 0.75rem;
                color: var(--subtle);
            }
        </style>
    </head>
    <body>
        <main>
            <h1 id="title"></h1>
            <p id="body"></p>
            <div class="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status"></span></div>
            <div class="actions">
                <button id="retry" class="primary" type="button"></button>
                <button id="face" type="button" hidden></button>
                <button id="close" type="button"></button>
            </div>
            <code id="detail"></code>
        </main>
        <script>
            (function () {
                // The reader's language among the app's catalogs; English for the rest.
                var words = {
                    en: {
                        title: "Intentic isn't answering right now",
                        body: "Your workspace lives online, and it isn't answering this computer right now: either this computer has no connection, or Intentic is having trouble. We keep trying.",
                        trying: "Trying again in {s} s",
                        checking: "Checking...",
                        retry: "Try now",
                        close: "Close",
                        face: "Use this computer's sandboxes",
                        stillHere: "The sandboxes on this computer keep working in the meantime.",
                        serverError: "Intentic's servers answered with an error ({code}).",
                    },
                    pl: {
                        title: "Intentic w tej chwili nie odpowiada",
                        body: "Twoje miejsce pracy jest w sieci i w tej chwili nie odpowiada temu komputerowi: albo ten komputer nie ma połączenia, albo Intentic ma problemy. Próbujemy dalej.",
                        trying: "Kolejna próba za {s} s",
                        checking: "Sprawdzam...",
                        retry: "Spróbuj teraz",
                        close: "Zamknij",
                        face: "Użyj sandboxów z tego komputera",
                        stillHere: "Sandboxy na tym komputerze w tym czasie działają dalej.",
                        serverError: "Serwery Intentic odpowiedziały błędem ({code}).",
                    },
                    de: {
                        title: "Intentic antwortet gerade nicht",
                        body: "Dein Arbeitsbereich ist online und antwortet diesem Computer gerade nicht: Entweder hat dieser Computer keine Verbindung, oder Intentic hat Probleme. Wir versuchen es weiter.",
                        trying: "Neuer Versuch in {s} s",
                        checking: "Wird geprüft...",
                        retry: "Jetzt versuchen",
                        close: "Schließen",
                        face: "Sandboxen dieses Computers verwenden",
                        stillHere: "Die Sandboxen auf diesem Computer laufen in der Zwischenzeit weiter.",
                        serverError: "Die Server von Intentic haben mit einem Fehler geantwortet ({code}).",
                    },
                    fr: {
                        title: "Intentic ne répond pas pour l'instant",
                        body: "Votre espace de travail est en ligne et ne répond pas à cet ordinateur pour l'instant : soit cet ordinateur n'a pas de connexion, soit Intentic rencontre un problème. Nous continuons d'essayer.",
                        trying: "Nouvel essai dans {s} s",
                        checking: "Vérification...",
                        retry: "Réessayer",
                        close: "Fermer",
                        face: "Utiliser les sandboxes de cet ordinateur",
                        stillHere: "Les sandboxes de cet ordinateur continuent de fonctionner en attendant.",
                        serverError: "Les serveurs d'Intentic ont répondu par une erreur ({code}).",
                    },
                    es: {
                        title: "Intentic no responde ahora mismo",
                        body: "Tu espacio de trabajo está en línea y ahora mismo no responde a este equipo: o este equipo no tiene conexión, o Intentic tiene problemas. Seguimos intentándolo.",
                        trying: "Nuevo intento en {s} s",
                        checking: "Comprobando...",
                        retry: "Intentar ahora",
                        close: "Cerrar",
                        face: "Usar los sandboxes de este equipo",
                        stillHere: "Los sandboxes de este equipo siguen funcionando mientras tanto.",
                        serverError: "Los servidores de Intentic respondieron con un error ({code}).",
                    },
                };
                var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
                var t = words[lang] || words.en;
                document.documentElement.lang = words[lang] ? lang : "en";

                var query = new URLSearchParams(location.search);
                var to = query.get("to") || "";
                // Only ever back to a web page: this page is the app's own origin, and a script URL here would run in it.
                var target = /^https?:\/\//i.test(to) ? to : "";
                var status = query.get("status") || "";

                document.getElementById("title").textContent = t.title;
                document.getElementById("body").textContent = t.body;
                document.getElementById("retry").textContent = t.retry;
                document.getElementById("close").textContent = t.close;
                // A dead platform's answer (`http-530`) said in words, its code kept; WebView2's own name for a network
                // failure stays as it is, for whoever is asked to read it out.
                var http = /^http-(\d{3})$/.exec(status);
                document.getElementById("detail").textContent = http ? t.serverError.replace("{code}", http[1]) : status;

                // This computer's own sandboxes, when the app built the page that opens them: only ever a page of this
                // page's own bundle, so nothing a link put in the address can send the window anywhere else.
                var face = query.get("face") || "";
                var bundle = location.protocol + "//" + location.host + "/";
                if (face.indexOf(bundle) === 0) {
                    var offer = document.getElementById("face");
                    offer.textContent = t.face;
                    offer.hidden = false;
                    offer.addEventListener("click", function () {
                        location.replace(face);
                    });
                    document.getElementById("body").textContent = t.body + " " + t.stillHere;
                }
                var said = document.getElementById("status");

                // Whether the workspace answers with something usable: the app's answer where it gives one (see the
                // comment at the top), else a no-cors request, which settles on any answer at all.
                var internals = window.__TAURI_INTERNALS__;
                function fetched() {
                    return fetch(target, { mode: "no-cors", cache: "no-store" }).then(function () {
                        return true;
                    });
                }
                function answers() {
                    if (!internals || typeof internals.invoke !== "function") return fetched();
                    return internals.invoke("machine_face_online").then(
                        function (usable) {
                            return usable === true;
                        },
                        // Not granted (an app older than this page's grant): the request is all there is to go by.
                        fetched,
                    );
                }
                var EVERY = 5;
                var left = EVERY;
                var checking = false;
                function check() {
                    if (!target || checking) return;
                    checking = true;
                    said.textContent = t.checking;
                    var gave = false;
                    var timer = setTimeout(function () {
                        gave = true;
                        checking = false;
                        left = EVERY;
                        tick();
                    }, 8000);
                    answers().then(
                        function (usable) {
                            if (gave) return;
                            clearTimeout(timer);
                            if (usable) {
                                location.replace(target);
                                return;
                            }
                            checking = false;
                            left = EVERY;
                            tick();
                        },
                        function () {
                            if (gave) return;
                            clearTimeout(timer);
                            checking = false;
                            left = EVERY;
                            tick();
                        },
                    );
                }
                function tick() {
                    if (checking) return;
                    said.textContent = t.trying.replace("{s}", String(left));
                }
                setInterval(function () {
                    if (checking) return;
                    left -= 1;
                    if (left <= 0) {
                        check();
                    } else {
                        tick();
                    }
                }, 1000);
                window.addEventListener("online", check);
                document.getElementById("retry").addEventListener("click", check);
                document.getElementById("close").addEventListener("click", function () {
                    location.href = "intentic://window?do=close";
                });
                tick();
                document.getElementById("retry").focus();
            })();
        </script>
    </body>
</html>
