# OSV/Scorecard triage only for unfixable Tauri transitive dependencies; prove cargo update has no released fix and recheck at ignoreUntil.
# Remove entries when fixes ship. These GTK3 advisories describe archived/unmaintained bindings required by Tauri's Linux WebKit stack.
# Their resolution requires Tauri moving upstream; do not suppress reachable, patchable vulnerabilities here.
