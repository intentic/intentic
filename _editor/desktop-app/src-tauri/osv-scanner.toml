# --- glib, and the macro crate it drags in ---------------------------------------------------------------
# RUSTSEC-2024-0429 is fixed in glib 0.20, which is the gtk4 line — unreachable while gtk 0.18 pins glib 0.18.
# The unsoundness is in glib's Iterator impls, which this app does not call directly. proc-macro-error is
# unmaintained and arrives only through glib-macros 0.18.5 and gtk3-macros: a BUILD-TIME proc macro, so it does
# not ship in the binary at all. Both leave when the GTK3 stack above does.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2027-02-01
reason = "glib 0.18.5 unsoundness; fix is glib 0.20 (gtk4 line), unreachable while tauri pins gtk 0.18."

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2027-02-01
reason = "Same glib 0.18.5 unsoundness as RUSTSEC-2024-0429, under its GHSA identifier."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2027-02-01
reason = "proc-macro-error unmaintained; build-time only, via glib-macros/gtk3-macros, not present in the shipped binary."

# --- the unic-* family -----------------------------------------------------------------------------------
# All five arrive through tauri-utils 2.9.3 -> urlpattern 0.3. urlpattern 0.4 replaced unic-* with
# icu_properties and would clear every one of these, but tauri-utils requires `urlpattern ^0.3` and 2.9.3 is
# the latest published tauri-utils — so there is no version combination that takes the newer one. Unmaintained
# advisories, not exploitable defects. Revisit when Tauri bumps its urlpattern bound.
[[IgnoredVulns]]
id = "RUSTSEC-2025-0075"
ignoreUntil = 2027-02-01
reason = "unic-char-range unmaintained; pinned by tauri-utils -> urlpattern ^0.3, no reachable upgrade."

