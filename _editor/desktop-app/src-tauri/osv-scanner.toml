# Triage for the advisories against this Cargo.lock. Read by osv-scanner, and by OpenSSF Scorecard's
# Vulnerabilities check, which shells out to the same scanner.
#
# EVERY entry here is unfixable from this repository, not merely inconvenient. Each one is a transitive
# dependency of Tauri's Linux stack with no released version that resolves it, verified against crates.io
# rather than assumed. Nothing reachable and patchable belongs in this file — if a fix ships, the entry goes,
# and `ignoreUntil` is what forces that question to be asked again rather than left to rot.
#
#   bash: cargo update -p <crate> --dry-run   # before adding anything here, prove there is nowhere to go
#
# --- the GTK3 bindings ---------------------------------------------------------------------------------------
# gtk-rs archived its GTK3 bindings and marked the whole family unmaintained. Tauri v2 still targets GTK3 +
# webkit2gtk on Linux (tauri 2.11.5 -> gtk 0.18.2), so every Tauri desktop app on Linux carries these. They are
# informational "unmaintained" advisories, not exploitable defects. The exit is Tauri moving off GTK3 upstream;
# there is no version of these crates to move to.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0411"
ignoreUntil = 2027-02-01
reason = "gdkwayland-sys: gtk-rs GTK3 bindings unmaintained; no fixed version exists, reached via tauri -> gtk 0.18."

