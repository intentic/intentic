# OSV/Scorecard triage only for unfixable Tauri transitive dependencies; prove cargo update has no released fix and recheck at ignoreUntil.
# Remove entries when fixes ship or when the advisory stops matching (package gone from Cargo.lock, advisory withdrawn).
# Do not suppress reachable, patchable vulnerabilities here.

# --- the macro crate glib drags in ----------------------------------------------------------------------
# glib's RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g is fixed by the pinned backport (Cargo.toml, gtk-rs-core#2009).
# proc-macro-error is unmaintained and arrives through glib-macros 0.18.5 and gtk3-macros: a BUILD-TIME proc
# macro, so it does not ship in the binary. It leaves when Tauri's Linux WebKit stack moves off GTK3 (gtk 0.18).
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2027-02-01
reason = "proc-macro-error unmaintained; build-time only, via glib-macros/gtk3-macros, not present in the shipped binary."
