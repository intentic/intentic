# --- the macro crate glib drags in ----------------------------------------------------------------------
# glib's RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g is fixed by the pinned backport (Cargo.toml, gtk-rs-core#2009).
# proc-macro-error is unmaintained and arrives through glib-macros 0.18.5 and gtk3-macros: a BUILD-TIME proc
# macro, so it does not ship in the binary. It leaves when the GTK3 stack above does.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2027-02-01
reason = "proc-macro-error unmaintained; build-time only, via glib-macros/gtk3-macros, not present in the shipped binary."

# --- the unic-* family -----------------------------------------------------------------------------------
# All five arrive through tauri-utils 2.9.3 -> urlpattern 0.3. urlpattern 0.4 replaced unic-* with
# icu_properties and would clear every one of these, but tauri-utils requires `urlpattern ^0.3` and 2.9.3 is
# the latest published tauri-utils — so there is no version combination that takes the newer one. Unmaintained
# advisories, not exploitable defects. Revisit when Tauri bumps its urlpattern bound.
[[IgnoredVulns]]
id = "RUSTSEC-2025-0075"
ignoreUntil = 2027-02-01
reason = "unic-char-range unmaintained; pinned by tauri-utils -> urlpattern ^0.3, no reachable upgrade."

