<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Intentic</title>
        <!-- The light this page paints in, decided before it paints: the workspace's scheme when the app has
             heard it (windows.rs face_init_script), the OS's when it has not. Never a fixed answer: a card that
             was always dark stood in the middle of a light workspace for anyone who had chosen the light look. -->
        <script>
            try {
                var mode = window.__INTENTIC_MODE__;
                if (mode !== "light" && mode !== "dark") {
                    mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                if (mode === "dark") document.documentElement.setAttribute("data-mode", "dark");
            } catch (e) {}
        </script>
        <script type="module" src="/src/main.ts" defer></script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
