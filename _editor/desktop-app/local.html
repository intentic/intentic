<!doctype html>
<!-- A window on a folder of the user's own disk: the editor itself (_editor/web), entered through local/main.ts. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>intentic</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- The app's own pre-paint rule (_editor/web/index.html), minus what only a browser tab meets (an arriving profile, a
             popped-out panel): the reader's stored look and language, else the OS's. Kept in step with that file, or the
             window paints one look and useTheme corrects it a moment later. -->
        <script>
            try {
                // The preferences the workspace keeps with the account, as the app last heard them (windows/prefs.rs),
                // written over this origin's own before anything below reads them, unless a page of this origin has
                // taken that handover or a later one (the web's desktopPreferences.ts, which wears later ones as they
                // come): a spare window loaded a while ago holds an older one.
                var carried = window.__INTENTIC_PREFS__;
                if (carried && typeof carried.version === "number" && carried.values && typeof carried.values === "object" && carried.version > (Number(localStorage.getItem("intentic.prefs-version")) || 0)) {
                    for (var carriedKey in carried.values) {
                        var carriedRaw = carried.values[carriedKey];
                        if (!Object.prototype.hasOwnProperty.call(carried.values, carriedKey) || !/^ui-[a-z0-9-]+$/.test(carriedKey)) continue;
                        if (carriedRaw === null) localStorage.removeItem(carriedKey);
                        else if (typeof carriedRaw === "string") localStorage.setItem(carriedKey, carriedRaw);
                    }
                    localStorage.setItem("intentic.prefs-version", String(carried.version));
                }
                var accentVars = localStorage.getItem("ui-accent-vars");
                if (accentVars) document.documentElement.setAttribute("style", accentVars);
                var uiTextSize = localStorage.getItem("ui-text-size");
                // Every rung of the ladder but Compact, which is the stylesheet's own (useTextSize.ts TEXT_SIZES).
                var UI_TEXT_SIZES = ["90", "default", "large", "135", "150", "175", "200"];
                if (UI_TEXT_SIZES.indexOf(uiTextSize) !== -1) document.documentElement.setAttribute("data-text-size", uiTextSize);
                var UI_LOCALES = ["en", "de", "es", "fr", "pl"];
                var uiLocale = localStorage.getItem("ui-locale");
                if (UI_LOCALES.indexOf(uiLocale) === -1) {
                    uiLocale = "en";
                    var offered = navigator.languages || [navigator.language];
                    for (var n = 0; n < offered.length; n++) {
                        var primary = String(offered[n]).toLowerCase().split("-")[0];
                        if (UI_LOCALES.indexOf(primary) !== -1) {
                            uiLocale = primary;
                            break;
                        }
                    }
                }
                document.documentElement.setAttribute("lang", uiLocale);
                // The look the reader was last seen in on any of the app's pages (windows.rs `look_init_script`),
                // adopted while this origin holds none of its own, as _editor/web/index.html does: the workspace is
                // another origin, and a look chosen there was nothing here.
                var LOOK_PAIRS = { system: ["system", "system"], light: ["light", "none"], dark: ["dark", "none"], sanctum: ["dark", "sanctum"], silver: ["dark", "silver"] };
                var appLook = window.__INTENTIC_LOOK__;
                if (typeof appLook === "string" && Object.prototype.hasOwnProperty.call(LOOK_PAIRS, appLook) && localStorage.getItem("ui-color-scheme") === null && localStorage.getItem("ui-skin") === null) {
                    localStorage.setItem("ui-color-scheme", LOOK_PAIRS[appLook][0]);
                    localStorage.setItem("ui-skin", LOOK_PAIRS[appLook][1]);
                }
                var uiScheme = localStorage.getItem("ui-color-scheme");
                var dark = uiScheme === "dark" || (uiScheme !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
                if (dark) document.documentElement.setAttribute("data-mode", "dark");
                var uiSkin = localStorage.getItem("ui-skin");
                var wornSkin = uiSkin === "sanctum" || uiSkin === "silver" ? uiSkin : uiSkin !== "none" && dark ? "sanctum" : null;
                if (wornSkin) document.documentElement.setAttribute("data-skin", wornSkin);
            } catch (e) {}
        </script>
<!-- The runtime config the editor reads while its modules evaluate (src/app/environments/environment.ts). Its platform
             is a stand-in answered inside the page (local/platform.ts), at the origin local/origin.ts names: the slot
             below is filled as the page is served and built (vite.local.config.ts). A local window talks to no server
             of ours. -->
        <script>
            window.env = {
                production: true,
                api: { url: "%LOCAL_PLATFORM_ORIGIN%" },
                auth: { googleClientId: "" },
                analytics: { posthogKey: "", posthogHost: "" },
                afterSignOut: "/",
            };
        </script>
        <script type="module" src="/local/main.ts"></script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
