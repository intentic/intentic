[package]
name = "intentic-explorer-menu"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "intentic_explorer_menu"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "0.61"

[build-dependencies]
serde_json = "1"

# Loaded into a COM surrogate every time a context menu opens, and nothing in it is hot: small over fast.
[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
