# Static SPA serving for the intentic web image. Cloudflare terminates TLS and compresses at the edge, so this
# is plain http with no gzip. Caching splits by mutability — hashed build assets are immutable, the
# runtime-substituted env.js is never cached — but it splits in the $cache_control map rather than in the
# location blocks, so that the security headers below survive; that block explains why. Every other path falls
# back to index.html so the Vue router owns client-side routing. /wire/ reverse-proxies PostHog (see below).
#
# This file is a TEMPLATE: entrypoint.sh renders it to conf.d/default.conf, substituting exactly
# ${NGINX_RESOLVER}, ${POSTHOG_API_HOST} and ${POSTHOG_ASSETS_HOST}. Every other `$…` below is an nginx
# runtime variable and is deliberately left untouched by that restricted envsubst.

# Analytics rides our own origin because privacy blockers (EasyPrivacy — on by default in Brave Shields and
# uBlock Origin) match PostHog's hostnames outright, and a blocked recorder means the visit produces no
# session replay at all. posthog-js treats any non-cloud api_host as the "custom" region and sends BOTH
# ingestion calls and SDK asset fetches to it, so the two upstreams are split back apart here by path. Keyed
# on $request_uri, not $uri: the location below rewrites $uri, and a map is evaluated lazily at first use
# (proxy_pass) — i.e. after that rewrite has already stripped the prefix.
map $request_uri $posthog_upstream {
    default           ${POSTHOG_API_HOST};
    ~^/wire/static/   ${POSTHOG_ASSETS_HOST};
    ~^/wire/array/    ${POSTHOG_ASSETS_HOST};
}

# Cache policy as a map rather than a per-location `add_header`, because nginx does not MERGE add_header sets —
# a location that declares one replaces the whole inherited set. Every security header below would therefore
# vanish on exactly the paths that matter (index.html, the bundle) the moment a location set Cache-Control
# itself. So the locations declare no headers at all, and the whole response header set is assembled once, at
# server level, from this map.
#
# First matching regex wins, hence env.js before the hashed-asset rule it would otherwise fall into: it is
# rewritten per deploy and must never be cached. /wire/ maps to the empty string — nginx omits an add_header
# whose value evaluates to empty, which leaves PostHog's own caching headers alone instead of appending a
# second, conflicting Cache-Control to them.
map $request_uri $cache_control {
    default                 "no-store";
    ~^/assets/js/env\.js    "no-store";
    ~^/assets/              "public, max-age=31536000, immutable";
    ~^/wire/                "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ——— The complete response header set ———————————————————————————————————————————————————————————————
    # All of it lives here and in no location block; see the $cache_control map for why that is structural
    # rather than stylistic. `always` on each, so an error response is covered too — a 404 rendering
    # index.html is still the app.
    add_header Cache-Control $cache_control always;

    # Clickjacking. frame-ancestors is the control browsers actually enforce today and it is set in the CSP
    # below; X-Frame-Options is here for agents that never learned it. DENY, not SAMEORIGIN: nothing in this
    # app frames the app. (The directory-UI and Google frames are the app framing OTHERS, which neither
    # header touches.)
    add_header X-Frame-Options "DENY" always;

    # Pin the browser to https for six months, matching the API. Cloudflare already redirects http→https, but
    # a redirect only helps after the first plaintext request has left the machine; this removes that request.
    # No `preload` — that is a one-way door and belongs to a deliberate hstspreload.org submission, not a
    # deploy artifact.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;

    # NOT `no-referrer`, and this is load-bearing for sign-in rather than a preference. Google Identity
    # Services identifies the calling page by the Referer its BROWSER sends on the cross-origin request for
    # accounts.google.com/gsi/button — that header is the only place the origin appears. Strip it and Google
    # cannot match the page against the client's authorized JavaScript origins, so it answers 400 and logs
    # "The given origin is not allowed for the given client ID": a 0×0 button that takes clicks and does
    # nothing, on a correctly-configured OAuth client, with the console blaming a setting that was never
    # wrong. (Verified against the deployed origin: the same page and client id serve a live button under
    # this value and a refused one under `no-referrer`.)
    #
    # `strict-origin-when-cross-origin` gives Google exactly the bare origin and nothing more — no path, no
    # query, and nothing at all when https drops to http. The app's paths carry sandbox ids, and they stay
    # same-origin under this value, which is the property `no-referrer` was reached for in the first place.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Only features the app demonstrably does not use are denied. An unlisted feature keeps its default
    # allowlist, which is why clipboard-write is absent — the workspace tree and git graph copy with it.
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;

    # CSP. Three things about this app set its shape, and each is a deliberate loosening rather than an
    # oversight:
    #
    #  • 'unsafe-inline' in script-src is forced. index.html carries the importmap and the anti-flash theme
    #    script inline, and — the harder constraint — a directory's own UI is injected as `srcdoc`
    #    (DirectoryUiHost.vue), which INHERITS this policy into an opaque origin where 'self' matches nothing
    #    and a nonce cannot be threaded. So the value here is not "inline script cannot run"; it is that a
    #    script cannot be pulled from an origin not named below, and that 'unsafe-eval' is absent.
    #  • blob: in script-src and worker-src is load-bearing. Extension bundles are fetched with a Bearer
    #    header and imported as Blob URLs (extension-host/loader.ts) precisely because a bare import() cannot
    #    carry that header.
    #  • connect-src cannot be an allowlist. A sandbox is reached at its tunnel (a hostname its owner chose,
    #    under a zone we do not know), at https://<id>.local.<zone>, or at http://127.0.0.1:<port derived from
    #    the sandbox id> — plus websockets to all three for terminals and the browser view. Loopback is
    #    narrowed to 127.0.0.1 rather than left as blanket http:, which is as tight as this can honestly go.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' blob: https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com; connect-src 'self' https: wss: http://127.0.0.1:* ws://127.0.0.1:*; manifest-src 'self'" always;

    # Runtime config, rewritten per-deploy by the entrypoint's envsubst — must never be cached (see the map).
    location = /assets/js/env.js {
        try_files $uri =404;
    }

    # Content-hashed build assets (vite emits hashed filenames) are safe to cache forever.
    location /assets/ {
        try_files $uri =404;
    }

    # PostHog: /wire/static/ + /wire/array/ are SDK bundles and the remote config document; everything else is
    # ingestion — /e/ and /i/v0/e/ (events) plus /s/ (session replay chunks).
    #
    # The prefix is `wire` and must stay something anonymous. Moving to our own origin only defeats the
    # HOSTNAME rules; the lists also carry path rules that match on any domain, and uBlock's privacy list has
    # a stanza (`! posthog`) doing exactly that to the paths PostHog's own proxy docs suggest —
    # `/ingest/*^ip=`, `/ingress/*^ip=`, `/hog/*^ip=`. Renaming this to any of those undoes the whole change.
    location ^~ /wire/ {
        # The upstream host reaches proxy_pass through a variable rather than as a literal, so that nginx
        # resolves it per request. A literal is resolved once at config load, which pins a single CDN IP for
        # the life of the container and — worse — makes nginx refuse to start when DNS is briefly unavailable
        # at boot, taking the whole SPA down over analytics. Per-request resolution keeps a PostHog outage a
        # 502 on /wire alone. ipv6=off because the compose network is v4-only: an AAAA lookup there fails the
        # whole resolution, not just the v6 half.
        resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
        resolver_timeout 5s;

        # Undo the `sdk.` the SPA prefixes onto every SDK script filename (see analytics.ts). Those rules are
        # anchored on a leading slash — EasyPrivacy ships bare `/posthog-recorder.js` and
        # `/dead-clicks-autocapture.js`, which match on ANY host and would otherwise still hit us here — so
        # putting one character between the `/` and the filename is enough to miss them. Done as a blanket
        # `sdk.`-strip rather than a filename table so a script posthog-js adds later needs no change here.
        rewrite ^/wire/(.*/)sdk\.([^/]+)$ /$1$2 break;
        rewrite ^/wire/(.*)$ /$1 break;

        proxy_pass https://$posthog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $posthog_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same-origin now, so the browser attaches our own cookies to these requests — drop them rather than
        # hand a third party the app's session. posthog-js runs on sessionStorage persistence (analytics.ts)
        # and never needs a cookie of its own, so nothing is lost in either direction.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        # SNI: without these the TLS handshake against the CDN offers no server name and is rejected.
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog_upstream;
        # Replay chunks are the largest thing we forward and blow past nginx's 1m default on a busy session.
        client_max_body_size 32m;
    }

    # SPA fallback: an unknown path renders index.html and the router takes over. index.html itself is
    # uncached so a new deploy's hashed asset references are picked up on the next load.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
