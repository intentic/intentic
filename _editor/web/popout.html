<!doctype html>
<html lang="en" data-mode="dark">
    <head>
        <meta charset="utf-8" />
        <title>Intentic</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- The page a popped-out panel lives in (see src/composables/usePopout.ts). It renders nothing of the
             app itself: the panel's DOM is teleported in from the window that opened this one, whose realm keeps
             driving it. What this page is FOR is the window — a pop-out used to be about:blank, which reads to
             the user (and to the browser's own chrome) as a window that came from nowhere: no address, no icon,
             a white rectangle for as long as it takes the panel to arrive. A real page of the app has all
             three. -->
        <link rel="icon" type="image/png" href="/assets/intentic-logo-sized.png" />
        <!-- ponytail: approximates the dark canvas token oklch(16% 0.007 65), same as index.html's. -->
        <meta name="theme-color" content="#141210" />
        <!-- Anti-flash, index.html's trick for a window with no app in it yet: paint the canvas and set the
             scheme native scrollbars key off, so the window opens dark (the app's default) instead of white.
             data-mode is the attribute useTheme.ts owns; the opener mirrors the live theme root onto this
             document the moment it adopts the window, so these two rules only ever cover the first frames. -->
        <style>
            html {
                background: #fff;
                color-scheme: light;
            }

            html[data-mode="dark"] {
                background: #141210;
                color-scheme: dark;
            }

            body {
                margin: 0;
            }

            .holding {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                font: 500 13px/1.6 system-ui, sans-serif;
                color: #8b8378;
            }
        </style>
        <script>
            try {
                if (localStorage.getItem("ui-color-scheme") === "light") document.documentElement.removeAttribute("data-mode");
            } catch (e) {}
        </script>
        <script type="module" src="/src/popout/keeper.ts"></script>
    </head>
    <body>
        <!-- All this window shows in the frames before the panel lands — and everything it can ever show when
             the page is opened on its own (a bookmark, a restored session, a link), since a pop-out is a view of
             a running app and there is no app on the other end of this one. -->
        <p class="holding">Pop-out window · <a href="/">open Intentic</a></p>
    </body>
</html>
