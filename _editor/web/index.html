<!doctype html>
<!-- NO LOOK IN THE TAG. Which light this app opens in is the reader's OS's answer until they choose for
     themselves, and markup served from a CDN cannot know it; the script below writes both attributes before
     anything paints. Light and no skin are spelled by absence, so a bare tag is already the fallback. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>intentic</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<!-- Installable PWA: standalone display. Its colours are the LIGHT canvas and cannot be anything else — a
             manifest is one static file with no media queries, and the splash it paints is up before any script has
             run, so it is exactly the place the rule "light unless we are told otherwise" is for. -->
        <link rel="manifest" href="/manifest.webmanifest" />
<!-- Approximates the canvas token in each scheme at the default accent (oklch(16% 0.007 65) dark, the paper-tinted
             surface-100 light); the picked colour retints it. Repointed by the script below at the scheme it resolves,
             since this app's scheme is the reader's choice and only follows the OS until they make one. -->
        <meta name="theme-color" content="#f4f1ec" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- THE LOTUS, AND THE SAME FILES THE SITE SERVES. -->
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- Runtime config: esbuild bundles environment.local|deployment.ts into public/assets/js/env.js. -->
        <script src="/assets/js/env.js"></script>
<!-- Import map for EXTENSION bundles only: they are single-file ESM with `vue` and `@intentic/extension-api` external. -->
        <script type="importmap">
            {
                "imports": {
                    "vue": "/ext-shims/vue.js",
                    "@intentic/extension-api": "/ext-shims/extension-api.js",
                    "@intentic/extension-manifest": "/ext-shims/extension-manifest.js",
                    "@intentic/extension-ui": "/ext-shims/extension-ui.js",
                    "@tanstack/vue-query": "/ext-shims/vue-query.js"
                }
            }
        </script>
<!-- Adopt an arriving profile, then restore saved display preferences — all before first paint. -->
        <script>
            try {
                // WHO ARRIVED. A link from intentic.dev names the profile the reader was reading in; the values
                // below are @intentic/constants profile.ts, and src/bootProfile.test.ts fails if they part.
                var PROFILE_KEYS = ["ui-color-scheme", "ui-skin", "ui-audience"];
                var PROFILES = {
                    default: { "ui-color-scheme": "system", "ui-skin": "system" },
                    desk: { "ui-color-scheme": "light", "ui-skin": "none", "ui-audience": "maker" },
                };
                var owns = Object.prototype.hasOwnProperty;
                var url = new URL(window.location.href);
                var asked = url.searchParams.get("profile");
                var linked = asked !== null;
                // A reader who came by no link at all — the address typed, or the desktop app's sign-in page opening
                // in this browser after an installer taken from intentic.dev — is still one the site has met: its
                // edition cookie is set on the domain both origins share. `desk` is that profile; any other value is
                // the site's way out, which is the default one; no cookie is no opinion.
                if (!linked) {
                    var jar = /(?:^|; )variant=([^;]*)/.exec(document.cookie);
                    if (jar !== null) asked = decodeURIComponent(jar[1]) === "desk" ? "desk" : "default";
                }
                if (asked !== null && owns.call(PROFILES, asked)) {
                    var next = PROFILES[asked];
                    var last = localStorage.getItem("ui-profile");
                    var was = last !== null && owns.call(PROFILES, last) ? PROFILES[last] : {};
                    for (var i = 0; i < PROFILE_KEYS.length; i++) {
                        var key = PROFILE_KEYS[i];
                        var have = localStorage.getItem(key);
                        // A profile may write a key while nobody else has: unset, or still carrying what the last
                        // profile put there. So a link never overrides a choice made in Settings, and leaving a
                        // profile releases the keys it set rather than stranding them.
                        if (have !== null && have !== (owns.call(was, key) ? was[key] : null)) continue;
                        if (owns.call(next, key)) localStorage.setItem(key, next[key]);
                        else localStorage.removeItem(key);
                    }
                    localStorage.setItem("ui-profile", asked);
                    // Consumed here so the router never sees it and a reload can't re-apply it over a later choice;
                    // any other query the app was given (?machine=) is left where it was.
                    if (linked) {
                        url.searchParams.delete("profile");
                        window.history.replaceState(null, "", url.pathname + url.search + url.hash);
                    }
                }
                var accentVars = localStorage.getItem("ui-accent-vars");
                if (accentVars) document.documentElement.setAttribute("style", accentVars);
                var uiTextSize = localStorage.getItem("ui-text-size");
                if (uiTextSize === "default" || uiTextSize === "large")
                    document.documentElement.setAttribute("data-text-size", uiTextSize);
                // WHICH LANGUAGE THIS PAGE IS IN, decided before it paints. `lang` is what picks a fallback face,
                // a language's quote marks and its hyphenation, so writing it from a module restyles text already
                // on screen. A stored choice wins; with none, the browser's own preference order decides, matching
                // on the primary subtag because we ship base languages and it offers "pl-PL". `negotiate` in
                // _editor/ui/src/i18n/locales.ts runs this same rule a module later, and src/bootLocale.test.ts
                // fails if the two ever part.
                var UI_LOCALES = ["en", "de", "es", "fr", "pl"];
                var uiLocale = localStorage.getItem("ui-locale");
                if (UI_LOCALES.indexOf(uiLocale) === -1) {
                    uiLocale = "en";
                    var offered = navigator.languages || [navigator.language];
                    for (var n = 0; n < offered.length; n++) {
                        var primary = String(offered[n]).toLowerCase().split("-")[0];
                        if (UI_LOCALES.indexOf(primary) !== -1) {
                            uiLocale = primary;
                            break;
                        }
                    }
                }
                document.documentElement.setAttribute("lang", uiLocale);
                // THE LIGHT THIS PAGE PAINTS IN, decided before it paints. Anything but a pinned "light"/"dark"
                // means nobody has chosen, so the OS answers — and `no-preference` matches neither query, so a
                // browser that will not say reads as light. useTheme runs this same rule a module later, which is
                // why the two can never disagree; without it here, useTheme arrives after the stylesheet has
                // already painted one canvas under a reader who is owed the other.
                var uiScheme = localStorage.getItem("ui-color-scheme");
                var dark = uiScheme === "dark" || (uiScheme !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
                if (dark) document.documentElement.setAttribute("data-mode", "dark");
                else document.documentElement.removeAttribute("data-mode");
                // A skin repaints every surface in the app, so arriving late means a white flash of the normal
                // look before the deep one lands — the worst flash of the three. Sanctum is the app's DARK look
                // and has no daylight dress, so an unpinned skin follows the scheme. See src/skins/README.md.
                var uiSkin = localStorage.getItem("ui-skin");
                if (uiSkin === "sanctum" || (uiSkin !== "none" && dark)) document.documentElement.setAttribute("data-skin", "sanctum");
                else document.documentElement.removeAttribute("data-skin");
                // Browser chrome, last because it is the only line here that reads the document it writes to.
                var themeMeta = document.querySelector('meta[name="theme-color"]');
                if (themeMeta) themeMeta.setAttribute("content", dark ? "#141210" : "#f4f1ec");
            } catch (e) {}
        </script>
<!-- Google Identity Services — browser-side sign-in for the direct-to-sandbox ID token. -->
        <link rel="preconnect" href="https://accounts.google.com" crossorigin />
        <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
        <script src="https://accounts.google.com/gsi/client" async></script>
<!-- The .ico is first and unqualified because that is the one every crawler, feed reader and pinned-tab list asks for by convention. -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<!-- Every face is served from this origin (src/styles/faces.css, files in public/fonts). Preloaded here because
             the stylesheet that declares it is bundled, so the browser would otherwise learn of it a round trip late. -->
        <link rel="preload" as="font" type="font/woff2" href="/fonts/public-sans-100-900-latin.woff2" crossorigin />
<!-- The boot frame's own styles, here rather than in the bundle, because the bundle is what it stands in for. -->
        <style>
/* THE CANVAS BEFORE THE BUNDLE. `body class="bg-canvas"` is a class in the stylesheet this frame stands in for,
               so without these three lines the first paint is the browser's white — under a reader whose whole point is
               that they chose the dark. Same values as the theme-color above, sanctum a shade under the plain dark;
               `:where` keeps them at specificity 0 so styles.css's `html` rule replaces them the moment it lands. */
            :where(html) {
                background-color: #f4f1ec;
                color-scheme: light;
            }
            :where(html[data-mode="dark"]) {
                background-color: #141210;
                color-scheme: dark;
            }
            :where(html[data-skin="sanctum"]) {
                background-color: #0d0c0a;
                color-scheme: dark;
            }
            .boot {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0.9rem;
                /* A start that finishes inside this delay is never seen: no flash on a warm cache, where the whole
                   boot is shorter than the fade. */
                animation: boot-in 320ms ease 600ms both;
                color: #7a6a52;
                font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
                font-size: 0.875rem;
                text-align: center;
            }
            [data-mode="dark"] .boot,
            [data-skin="sanctum"] .boot {
                color: #9c8b73;
            }
            .boot-mark {
                width: 3.25rem;
                height: 3.25rem;
                color: #e07b27;
                animation: boot-breathe 2.4s ease-in-out infinite;
            }
            .boot-note,
            .boot-slow {
                margin: 0;
            }
            #boot-reload {
                border: 0;
                background: none;
                font: inherit;
                color: #e07b27;
                text-decoration: underline;
                cursor: pointer;
            }
            @keyframes boot-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            @keyframes boot-breathe {
                0%,
                100% {
                    opacity: 0.5;
                    transform: scale(0.97);
                }
                50% {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .boot-mark {
                    animation: none;
                }
            }
        </style>
    </head>
    <body class="bg-canvas text-content">
<!-- THE FIRST FRAME, and the only one this file can draw by itself: `app.mount("#app")` empties this container
             (main.ts), so nothing here has to be taken down. Without it the window is EMPTY until the bundle has
             arrived and run — 1.6 MB over ~150 requests — and a cold start on a new machine, with no HTTP cache and a
             webview profile being created underneath it, spends that whole time looking like an app that failed to
             open. That is what the desktop app's first launch after an install was. -->
        <div id="app">
            <div class="boot" role="status" aria-live="polite">
                <svg class="boot-mark" viewBox="0 -1.3 32 32" fill="currentColor" aria-hidden="true">
                    <path d="M8.4 25.6c-3.2 0-5.6-1-7.2-3 3.6-1.2 6.6-.7 9 1.4z" opacity=".42" />
                    <path d="M23.6 25.6c3.2 0 5.6-1 7.2-3-3.6-1.2-6.6-.7-9 1.4z" opacity=".42" />
                    <path d="M16 9.5c2.1 3 3.2 5.7 3.2 8.1 0 2.2-1.1 4.1-3.2 5.6-2.1-1.5-3.2-3.4-3.2-5.6 0-2.4 1.1-5.1 3.2-8.1z" transform="rotate(-74 16 22.6)" opacity=".55" />
                    <path d="M16 9.5c2.1 3 3.2 5.7 3.2 8.1 0 2.2-1.1 4.1-3.2 5.6-2.1-1.5-3.2-3.4-3.2-5.6 0-2.4 1.1-5.1 3.2-8.1z" transform="rotate(74 16 22.6)" opacity=".55" />
                    <path d="M16 6.4c2.4 3.4 3.6 6.4 3.6 9.1 0 2.5-1.2 4.6-3.6 6.3-2.4-1.7-3.6-3.8-3.6-6.3 0-2.7 1.2-5.7 3.6-9.1z" transform="rotate(-39 16 21.7)" opacity=".78" />
                    <path d="M16 6.4c2.4 3.4 3.6 6.4 3.6 9.1 0 2.5-1.2 4.6-3.6 6.3-2.4-1.7-3.6-3.8-3.6-6.3 0-2.7 1.2-5.7 3.6-9.1z" transform="rotate(39 16 21.7)" opacity=".78" />
                    <path d="M16 3.4c2.8 4 4.2 7.5 4.2 10.6 0 2.9-1.4 5.4-4.2 7.3-2.8-1.9-4.2-4.4-4.2-7.3 0-3.1 1.4-6.6 4.2-10.6z" />
                </svg>
                <p class="boot-note">Opening your workspace…</p>
                <p class="boot-slow" hidden>
                    This is taking longer than usual.
                    <button type="button" id="boot-reload">Reload</button>
                </p>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
<!-- A start that is merely slow is still a start, so the first word about it comes late; a start that is STUCK
             would otherwise be a mark on a ground with nothing to press. `isConnected` is how the mount cancels this:
             the element this timer speaks about is gone by then. -->
        <script>
            (function () {
                var slow = document.querySelector(".boot-slow");
                var reload = document.getElementById("boot-reload");
                if (slow === null || reload === null) return;
                reload.addEventListener("click", function () {
                    location.reload();
                });
                setTimeout(function () {
                    if (slow.isConnected) slow.hidden = false;
                }, 10000);
            })();
        </script>
        <noscript>Please enable JavaScript to continue using this application.</noscript>
    </body>
</html>
