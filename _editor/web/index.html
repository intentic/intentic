<!doctype html>
<html lang="en" data-mode="dark">
    <head>
        <meta charset="utf-8" />
        <title>intentic</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <!-- Installable PWA: standalone display, dark canvas chrome. The service worker (public/sw.js) is
             registered lazily, only when the user enables push notifications, and handles push alone — it
             deliberately caches nothing, since the app is a live daemon client. -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <!-- ponytail: approximates the dark canvas token oklch(16% 0.007 65) at the default accent; the picked
             colour retints it, but this is only the chrome around the first paint. -->
        <meta name="theme-color" content="#141210" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="apple-touch-icon" href="/assets/intentic-logo-sized.png" />
        <!-- Runtime config: esbuild bundles environment.local|deployment.ts into public/assets/js/env.js,
             setting window.env BEFORE the app boots (so environment.ts can read it synchronously). A classic
             script, so it runs before the deferred app module. $API_URL is substituted (envsubst) at deploy. -->
        <script src="/assets/js/env.js"></script>
        <!-- Import map for EXTENSION bundles only: they are single-file ESM with `vue` and
             `@intentic/extension-api` external, and the browser resolves those bare specifiers (blob-URL
             modules included) to shims re-exporting the app's own instances (src/extension-host/hostModules.ts)
             — one shared vue, or reactivity breaks across the boundary. App code never hits this map: Vite
             rewrites its imports before the browser sees them. -->
        <script type="importmap">
            {
                "imports": {
                    "vue": "/ext-shims/vue.js",
                    "@intentic/extension-api": "/ext-shims/extension-api.js",
                    "@intentic/extension-manifest": "/ext-shims/extension-manifest.js",
                    "@intentic/extension-ui": "/ext-shims/extension-ui.js",
                    "@tanstack/vue-query": "/ext-shims/vue-query.js"
                }
            }
        </script>
        <!-- Anti-flash: restore the saved accent colour and text size before first paint (same idea as the static
             data-mode above, but a per-user choice can't be static). A text size arriving late is worse than a
             late colour — the whole layout reflows — so it is restored here rather than only in useTextSize.ts,
             which stays the source of truth for both. The default size carries no attribute.

             The accent is written as the ramp declarations themselves, which useTheme.ts keeps serialized in
             `ui-accent-vars` for exactly this: the colour maths that expands one hex into two twelve-step ramps
             lives in themeColor.ts, and a copy of it inlined here to survive one frame would be a second one to
             keep in step. Assigning `style` outright is safe only because nothing else has written to the root
             element this early — from here on useTheme sets the properties one at a time. -->
        <script>
            try {
                var accentVars = localStorage.getItem("ui-accent-vars");
                if (accentVars) document.documentElement.setAttribute("style", accentVars);
                var uiTextSize = localStorage.getItem("ui-text-size");
                if (["compact", "large"].indexOf(uiTextSize) !== -1)
                    document.documentElement.setAttribute("data-text-size", uiTextSize);
            } catch (e) {}
        </script>
        <!-- Google Identity Services — browser-side sign-in for the direct-to-sandbox ID token. Loads async;
             useGoogleIdentity waits on this tag's load event before initializing. The preconnects open the two
             connections that flow costs before it can show anything: the script's own origin, and the account
             endpoint the prompt then talks to. On /desktop-auth the entire screen is that wait. -->
        <link rel="preconnect" href="https://accounts.google.com" crossorigin />
        <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
        <script src="https://accounts.google.com/gsi/client" async></script>
        <link rel="icon" type="image/png" href="/assets/intentic-logo-sized.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- The app's two faces: Inter for --font-sans, JetBrains Mono for --font-mono. display=swap keeps it
             non-blocking. (Space Grotesk and DM Sans were loaded here for two of the brand themes; the accent
             picker that replaced them changes colour, never type.) -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="bg-canvas text-content">
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
        <noscript>Please enable JavaScript to continue using this application.</noscript>
    </body>
</html>
