# Mobile shells — validation only. Proves both store shells still BUILD; shipping is mobile-release.yml.
#
# Cheap and fork-safe by construction: everything runs on GitHub-hosted runners (free on a public
# repository — and the only place a macOS builder exists at all; the self-hosted fleet is Linux), no job
# touches a secret, and signing uses a keystore minted inside the run and thrown away with it. The path
# filter is the budget: the shells are thin configuration over the hosted web app, so almost no product
# change should ever start these jobs.
#
# AND THE PATH FILTER IS WHY nightly.yml CALLS THIS TOO. Both jobs here prove a GENERATED project, and what
# generates it is a pinned external tool reading a checked-in manifest. That pair drifts on its own: neither
# defect this file has ever caught was a product change. Bubblewrap started requiring a manifest key that was
# not there and emitted `splashScreenFadeOutDuration: ,`, a Groovy syntax error; Capacitor moved its dependency
# wiring to a Swift package, so the App.xcworkspace both workflows opened stopped being written at all. With
# only the path filter, nothing looks until someone touches a shell — this workflow had run four times in its
# life, and was broken from its first run to its fourth, a full day, on a push that changed neither shell
# (docs/ci-failure-audit.md, class F). A schedule is what makes drift arrive on nobody's push.
#
# What each job actually proves, since neither shell has tests of its own:
#   android  the Play manifest still generates a project Bubblewrap can assemble and sign end-to-end —
#            the same command sequence the release runs, minus the store upload.
#   ios      the Capacitor config still generates a project that compiles, and prepare-native.mjs can still
#            finish it — that script WRITES the push wiring the Capacitor template leaves out, and stops on a
#            template whose shape moved, which is the one product invariant a successful compile would hide.
name: Mobile

on:
  push:
    branches: [main]
    paths:
      - "_editor/ios-app/**"
      - "_editor/android-app/**"
      - "_tools/scripts/ci/mobile-android-sdk.sh"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "_editor/ios-app/**"
      - "_editor/android-app/**"
      - "_tools/scripts/ci/mobile-android-sdk.sh"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
  # Called by nightly.yml, so the same two jobs are the schedule's answer as well as the push's. A second copy
  # of them there would be the drift this file exists to catch, one layer up.
  workflow_call:

# Same shape as ci.yml: supersede on a pull request, never on main.
concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _editor/android-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Point Bubblewrap at the runner's toolchains
        working-directory: .
        run: bash _tools/scripts/ci/mobile-android-sdk.sh
      # A validation build must sign with SOMETHING (the manifest names a keystore), and it must never be the
      # real one: a key minted inside the run proves the signing path works and can leak nothing.
      - name: Mint a throwaway signing key
        run: |
          keytool -genkeypair -keystore ./android.keystore -alias android \
            -storepass ci-throwaway -keypass ci-throwaway -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=ci-validation"
      - name: Generate the Android project from the manifest
        run: npx @bubblewrap/cli@1.25.0 update --skipVersionUpgrade
      - name: Build and sign
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ci-throwaway
          BUBBLEWRAP_KEY_PASSWORD: ci-throwaway
        run: npx @bubblewrap/cli@1.25.0 build --skipPwaValidation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-validation-apk
          path: _editor/android-app/app-release-signed.apk
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: _editor/ios-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository's one Node version, not whatever the macOS image happens to carry this month — a store
      # build has no business drifting with an image bump.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
      # Standalone on purpose — this folder is outside the pnpm workspace (pnpm-workspace.yaml says why), so
      # plain npm against its own exact-pinned manifest is the whole install.
      - name: Install shell dependencies
        run: npm install --no-audit --no-fund
      - name: Generate the iOS project from the config
        run: npx cap add ios
      - name: Finish the generated project (push wiring + entitlements)
        run: node scripts/prepare-native.mjs
      # Simulator, unsigned: compilation is the fact being checked, and it is the whole of what a runner
      # without the team's signing identity can check.
      #
      # `-project`, not `-workspace`: Capacitor generates the dependency wiring as a Swift package (CapApp-SPM)
      # whenever every installed plugin ships a Package.swift, and that path never runs CocoaPods, so no
      # App.xcworkspace is written at all — asking for one fails before a single file compiles. Capacitor's own
      # `cap build ios` branches the same way (dist/ios/build.js), and `-scheme App` is unchanged either way.
      - name: Compile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
