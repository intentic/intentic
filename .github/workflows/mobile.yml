# Validate Android/iOS builds without publishing or secrets; hosted runners provide macOS and disposable Android debug signing.
# Nightly also runs this path to catch drift in generated native projects, CSS/catalog resources and pinned external templates.
# Android verifies Rust/generators/resources/tests plus a shrunk release APK; iOS verifies Capacitor generation and push wiring.
name: Mobile

on:
  push:
    branches: [main]
    paths:
      - "_editor/ios-app/**"
      - "_editor/android-app/**"
      - "_editor/mobile-core/**"
      - "_editor/ui/src/styles/primitive-colors.css"
      - "_editor/ui/src/styles/semantic-colors.css"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "_editor/ios-app/**"
      - "_editor/android-app/**"
      - "_editor/mobile-core/**"
      - "_editor/ui/src/styles/primitive-colors.css"
      - "_editor/ui/src/styles/semantic-colors.css"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
  # Called by nightly.yml, so the same two jobs are the schedule's answer as well as the push's. A second copy
  # of them there would be the drift this file exists to catch, one layer up.
  workflow_call:

# Same shape as ci.yml: supersede on a pull request, never on main.
concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The NDK app/build.gradle.kts names as ndkVersion: cargo-ndk links the core with it, AGP strips it with it.
      NDK_VERSION: "29.0.14206865"
      CORE: _editor/mobile-core/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      # Seconds, and no toolchain: ahead of everything that compiles.
      - name: Colours and strings match the web's
        run: |
          node _editor/android-app/scripts/theme.mjs --check
          node _editor/android-app/scripts/strings.mjs --check
      - name: Generator tests
        run: node --test '_editor/android-app/scripts/**/*.test.mjs'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      # The licences are fed from a process substitution, not `yes |`: under pipefail that pipe dies 141 the moment
      # sdkmanager stops reading (_tools/scripts/ci/mobile-android-sdk.sh learned it first).
      - name: Rust, the Android targets and the NDK
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target aarch64-linux-android,x86_64-linux-android
          rustup default stable
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" < <(yes) > /dev/null
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-tools
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/typeshare
          key: mobile-cargo-tools-${{ runner.os }}-cargo-ndk-4.1.2-typeshare-1.13.4
      # typeshare at the version that wrote the committed Messages.kt: its output's header names it, so another
      # version is a diff by itself.
      - name: cargo-ndk and typeshare
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-ndk --version 4.1.2
          cargo install --locked typeshare-cli --version 1.13.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            _editor/mobile-core/target
          key: mobile-core-${{ runner.os }}-${{ hashFiles('_editor/mobile-core/Cargo.lock') }}
          restore-keys: mobile-core-${{ runner.os }}-
      - name: Core formatting
        run: cargo fmt --manifest-path "$CORE" --all --check
      - name: Core lints
        run: cargo clippy --manifest-path "$CORE" --all-targets -- -D warnings
      - name: Core tests
        run: cargo test --manifest-path "$CORE"
      - name: Messages.kt matches the core's messages
        run: bash _editor/mobile-core/scripts/messages.sh --check
      # Gradle is the version scripts/gradle.sh pins and digest-checks; there is no wrapper jar in the repository.
      # The instrumented tests, the Baseline Profile's recorder and the benchmarks need a device, so CI only compiles
      # them, which keeps them from drifting away from the app.
      - name: App unit tests and release build
        run: >-
          bash _editor/android-app/scripts/gradle.sh --no-daemon :app:testDebugUnitTest :app:assembleRelease
          :app:assembleDebugAndroidTest :baselineprofile:assembleNonMinifiedRelease :benchmark:assembleBench
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: android-validation-apk
          path: _editor/android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: _editor/ios-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository's one Node version, not whatever the macOS image happens to carry this month — a store
      # build has no business drifting with an image bump.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      # Standalone on purpose — this folder is outside the pnpm workspace (pnpm-workspace.yaml says why), so
      # plain npm against its own exact-pinned manifest is the whole install.
      - name: Install shell dependencies
        run: npm install --no-audit --no-fund
      - name: Generate the iOS project from the config
        run: npx cap add ios
      - name: Finish the generated project (push wiring + entitlements)
        run: node scripts/prepare-native.mjs
      # Simulator, unsigned: compilation is the fact being checked, and it is the whole of what a runner
      # without the team's signing identity can check.
      #
      # `-project`, not `-workspace`: Capacitor generates the dependency wiring as a Swift package (CapApp-SPM)
      # whenever every installed plugin ships a Package.swift, and that path never runs CocoaPods, so no
      # App.xcworkspace is written at all — asking for one fails before a single file compiles. Capacitor's own
      # `cap build ios` branches the same way (dist/ios/build.js), and `-scheme App` is unchanged either way.
      - name: Compile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
