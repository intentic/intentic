# Dispatch at the release tag because GITHUB_TOKEN tag pushes cannot trigger workflows; build the self-contained Action bundle here.
# publish-action.sh replaces the artifact tree in intentic/gate-action, whose root action.yml is required for the Marketplace.
# Missing/unwritable GATE_ACTION_TOKEN warns and skips this optional publish; probe write access before any push.
# First listing requires manual UI setup; later versions update through releases and the floating major tag.
name: action publish

# Run it by hand from a tag the same way the release job does: Actions ▸ action publish ▸ Run workflow, with
# the tag selected as the ref.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: action-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PNPM_STORE: /ci-cache/pnpm-store
      TURBO_CACHE_DIR: /ci-cache/turbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - uses: ./.github/actions/pnpm-setup

      # `--filter` pulls the dependency closure through turbo's ^build edge — the gate package's dist is what
      # the bundle inlines.
      - name: Build the action bundle
        run: pnpm turbo run build --filter=./_sandbox/gate-action

      - name: Sync to the public action repository
        env:
          GATE_ACTION_TOKEN: ${{ secrets.GATE_ACTION_TOKEN }}
        run: bash _tools/scripts/release/publish-action.sh "${GITHUB_REF_NAME#v}"
