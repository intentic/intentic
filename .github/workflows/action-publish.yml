# Sync the Marketplace GitHub Action to its public repo (intentic/gate-action), at the tag semantic-release
# pushes — the same trigger and shape as npm-publish.yml: a pushed `v*` tag is a complete, version-stamped
# tree, so there is nothing to bump and nothing to check out beyond the tag itself.
#
# DISPATCHED, NOT TAG-TRIGGERED, and this file spent its whole life on the wrong side of that. It said
# `on: push: tags: ["v*"]` and read as if the tag started it. It never did, not once: semantic-release pushes
# its tag with the built-in GITHUB_TOKEN, and GitHub starts no workflow from an event that token created — the
# loop guard. npm-publish.yml was moved off that trigger for exactly this reason and this file was written
# afterwards, in its shape, claiming its trigger, and keeping the broken one — so the action was built by a
# workflow that could not run, and the Marketplace listing never saw a version. Repeat occurrence of one bug;
# the workflow-policy check (_tools/checks/) is what makes it the last.
#
# workflow_dispatch is the ONE exception the loop guard makes, so it is the only trigger the release job's own
# token can pull (dispatch-publish.sh, which names this file alongside the other one). The dispatch names THE
# TAG as its ref, so the checkout is the released commit and `GITHUB_REF_NAME` is the version — exactly what a
# tag push would have given it, which is why nothing below had to change.
#
# The action cannot ship from this repository: a Marketplace listing requires a public repo with action.yml at
# its root, one action per repo. So this builds the self-contained bundle here — where its tests and the
# contract it is held to live — and publish-action.sh pushes the snapshot, tags the version, moves the floating
# major, and creates the Release the listing surfaces.
#
# Inert until GATE_ACTION_TOKEN exists AND can write (a fine-grained PAT, Contents: read+write on
# intentic/gate-action): the script probes the write before it pushes anything and skips loudly — a warning
# annotation on this run — rather than failing the release train over an optional artifact. A token that only
# reads is the same to it as no token: the action repo is public, so a useless credential clones just fine and
# is refused at the first push, which is how v1.209.1 took this job red. The first Marketplace listing is a
# one-time manual step in the UI; releases after that surface on it by themselves.
name: action publish

# Run it by hand from a tag the same way the release job does: Actions ▸ action publish ▸ Run workflow, with
# the tag selected as the ref.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: action-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PNPM_STORE: /ci-cache/pnpm-store
      TURBO_CACHE_DIR: /ci-cache/turbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - uses: ./.github/actions/pnpm-setup

      # `--filter` pulls the dependency closure through turbo's ^build edge — the gate package's dist is what
      # the bundle inlines.
      - name: Build the action bundle
        run: pnpm turbo run build --filter=./_sandbox/gate-action

      - name: Sync to the public action repository
        env:
          GATE_ACTION_TOKEN: ${{ secrets.GATE_ACTION_TOKEN }}
        run: bash _tools/scripts/publish-action.sh "${GITHUB_REF_NAME#v}"
