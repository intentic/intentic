name: CI repair verification
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  sandbox-failures-in-rebuilt-image:
    runs-on: [self-hosted, intentic]
    timeout-minutes: 45
    steps:
      - name: Reclaim this checkout
        shell: bash
        run: |
          set -euo pipefail
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          img=$(docker image ls -q ghcr.io/intentic/ci-base:latest)
          [ -n "$img" ] || img=$(docker image ls -q ghcr.io/intentic/ci-desktop:latest)
          [ -n "$img" ] || exit 0
          docker run --rm --entrypoint chown -v "$GITHUB_WORKSPACE:/w" "$img" -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the revised CI base image
        env:
          REPAIR_RUN: ${{ github.run_id }}
        run: docker build -t "intentic-ci-repair:$REPAIR_RUN" _tools/ci-base
      - name: Run only the failing sandbox suites in that image
        env:
          REPAIR_RUN: ${{ github.run_id }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" -v /ci-cache:/ci-cache -w /repo \
            -e CI=true -e CI_HOST_JOBS=6 -e TEST_SLOTS_DIR=/ci-cache/test-slots \
            -e TEST_SLOTS=16 -e TEST_SLOTS_CAP=2 \
            "intentic-ci-repair:$REPAIR_RUN" bash -euc '
              jq --version
              rm -f node_modules/.pnpm-workspace-state-v1.json
              pnpm install --frozen-lockfile --store-dir /ci-cache/pnpm-store
              pnpm --filter @intentic/sandbox test cursor-events.test.ts cursor-provider.test.ts offload.routes.test.ts script-run-tools.test.ts stream-agent-frames.integration.test.ts cloudflare.conformance.integration.test.ts github.conformance.integration.test.ts comment-refs.integration.test.ts
              pnpm --filter @intentic/sandbox typecheck
            '
      - name: Remove this validation image tag
        if: always()
        env:
          REPAIR_RUN: ${{ github.run_id }}
        run: docker image rm "intentic-ci-repair:$REPAIR_RUN" || true
  win-launcher:
    runs-on: [self-hosted, intentic, desktop]
    timeout-minutes: 20
    container:
      image: ghcr.io/intentic/ci-desktop:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_HOME: /ci-cache/cargo
      CARGO_TARGET_DIR: /ci-cache/ic-check-target
      XWIN_CACHE_DIR: /ci-cache/xwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: false
      - run: cargo fmt --manifest-path _devices/win-launcher/Cargo.toml --all --check
      - run: cargo clippy --manifest-path _devices/win-launcher/Cargo.toml --all-targets -- -D warnings
      - run: cargo xwin check --manifest-path _devices/win-launcher/Cargo.toml --target x86_64-pc-windows-msvc
      - run: cargo test --manifest-path _devices/win-launcher/Cargo.toml
