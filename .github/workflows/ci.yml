name: Image preparation verification
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  PNPM_STORE: /ci-cache/pnpm-store
  TURBO_CACHE_DIR: /ci-cache/turbo
jobs:
  images-amd64:
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/pnpm-setup
      - uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .image-out/iq-models
            .image-out/.iq-models-complete
          key: iq-models-${{ hashFiles('_search/iq-engine/scripts/fetch-model.mjs') }}
      - run: bash _tools/scripts/release/set-versions.sh 1.390.0
      - run: bash _tools/scripts/image/prepare-image-trees.sh
