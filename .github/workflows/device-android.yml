# Intentic Device, the Android app that connects a phone or a Wear OS watch to a sandbox (_devices/android). One APK serves
# both: on a watch it shows a watch's screen and pause tile, so there is no separate watch build to publish, and
# intentic.dev/watch/apk hands over the same asset as /phone/apk.
#
#   build    every push and pull request that touches it: the unit tests of both flavors (they read the contract's
#            golden wire, _shared/sandbox-contract/golden/phone-wire.json, so a change there runs them too) and a
#            debug APK of each, on a GitHub-hosted runner, touching no secret.
#   release  called by release.yml beside the release's other builds, with the tag it is about to cut: the `direct`
#            flavor built at the commit that tag will name, signed with the app's key, and kept as the
#            intentic-device-release artifact: intentic-device-<version>.apk with intentic-device.json beside it
#            (version, url, sha256), which the app's own updater and intentic.dev/phone/apk read. release.yml's
#            device-android-attach puts both on the Release once publish has cut it. Built beside rather than after
#            publish, where it was three minutes at the end of every release; the tag names this same commit,
#            since nothing in the release commits. A call rather than a `release: published` trigger, since the
#            Release is published with GITHUB_TOKEN, whose events start no workflow.
#
# Gradle is the version scripts/gradle.sh pins and digest-checks; there is no wrapper jar in the repository.
name: Intentic Device (Android)

on:
  push:
    branches: [main]
    paths:
      - "_devices/android/**"
      - "_shared/sandbox-contract/golden/phone-wire.json"
      - ".github/workflows/device-android.yml"
  pull_request:
    paths:
      - "_devices/android/**"
      - "_shared/sandbox-contract/golden/phone-wire.json"
      - ".github/workflows/device-android.yml"
  workflow_call:
    inputs:
      tag:
        description: The tag (v1.2.3) the release is about to cut at this commit; the app is built at its version.
        type: string
        required: true
  workflow_dispatch:

concurrency:
  group: device-android-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # THE DEPENDENCIES AND THE PINNED GRADLE, KEPT BETWEEN RUNS. A hosted runner starts empty, so every run fetched
      # AGP's whole tree from Maven Central off the shared hosted-runner addresses Central rate-limits: release 1.398.1's
      # build died in 20s on "Received status code 429 from server: Too Many Requests" for every artifact (run
      # 42126994319). Keyed on everything that names a dependency or the Gradle version; a partial hit after a bump
      # still holds most of the tree. The release job restores the same key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.cache/intentic-gradle
          key: device-android-gradle-${{ runner.os }}-${{ hashFiles('_devices/android/**/*.gradle.kts', '_devices/android/gradle.properties', '_devices/android/scripts/gradle.sh') }}
          restore-keys: device-android-gradle-${{ runner.os }}-
      - name: Test and build both flavors
        run: >-
          bash _devices/android/scripts/gradle.sh --no-daemon
          :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest
          :app:assembleDirectDebug :app:assemblePlayDebug
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: intentic-device-debug
          path: _devices/android/app/build/outputs/apk/**/debug/*.apk
          retention-days: 7

  release:
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The caller's commit: the tag does not exist yet, and when it does it names this commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # The build job's cache (its comment says why): Maven Central answered this job 429 for every artifact (run 42126994319).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.cache/intentic-gradle
          key: device-android-gradle-${{ runner.os }}-${{ hashFiles('_devices/android/**/*.gradle.kts', '_devices/android/gradle.properties', '_devices/android/scripts/gradle.sh') }}
          restore-keys: device-android-gradle-${{ runner.os }}-
      # The version code must only ever grow: major, minor and patch packed into one integer (1.324.2 → 1324002).
      - name: Read the version
        id: version
        run: |
          version="${TAG#v}"
          IFS=. read -r major minor patch <<<"$version"
          echo "name=$version" >>"$GITHUB_OUTPUT"
          echo "code=$(( major * 1000000 + minor * 1000 + patch ))" >>"$GITHUB_OUTPUT"
      # Checked here, by keytool, rather than left to AGP's packaging step: a key that cannot be read surfaced there as
      # "Tag number over 30 is not supported" with a blank alias, naming none of the secrets it came from.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INTENTIC_DEVICE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.INTENTIC_DEVICE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INTENTIC_DEVICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INTENTIC_DEVICE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("INTENTIC_DEVICE_${name/STORE_PASSWORD/KEYSTORE_PASSWORD}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::signing secrets are empty or unset: ${missing[*]}"
            exit 1
          fi
          keystore="$RUNNER_TEMP/intentic-device.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$keystore"; then
            echo "::error::INTENTIC_DEVICE_KEYSTORE_BASE64 is not base64 (it should be the output of \`base64 -w0 <keystore>\`)"
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >"$RUNNER_TEMP/keytool.err" 2>&1; then
            echo "::error::the keystore in INTENTIC_DEVICE_KEYSTORE_BASE64 cannot be opened with INTENTIC_DEVICE_KEYSTORE_PASSWORD, or holds no key named INTENTIC_DEVICE_KEY_ALIAS: $(tr '\n' ' ' <"$RUNNER_TEMP/keytool.err")"
            exit 1
          fi
      # AGP's injected signing properties: the build script holds no signing config, so no key path is ever committed.
      - name: Build and sign the direct flavor
        env:
          STORE_PASSWORD: ${{ secrets.INTENTIC_DEVICE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INTENTIC_DEVICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INTENTIC_DEVICE_KEY_PASSWORD }}
          FCM_API_KEY: ${{ secrets.INTENTIC_DEVICE_FCM_API_KEY }}
          FCM_APP_ID: ${{ secrets.INTENTIC_DEVICE_FCM_APP_ID }}
          FCM_PROJECT_ID: ${{ secrets.INTENTIC_DEVICE_FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.INTENTIC_DEVICE_FCM_SENDER_ID }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >-
          bash _devices/android/scripts/gradle.sh --no-daemon :app:assembleDirectRelease
          -Pintentic.versionName="$VERSION_NAME"
          -Pintentic.versionCode="$VERSION_CODE"
          -Pintentic.fcm.apiKey="$FCM_API_KEY" -Pintentic.fcm.appId="$FCM_APP_ID"
          -Pintentic.fcm.projectId="$FCM_PROJECT_ID" -Pintentic.fcm.senderId="$FCM_SENDER_ID"
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/intentic-device.keystore"
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Stage the APK and its manifest
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p device-release
          apk="intentic-device-$VERSION.apk"
          cp _devices/android/app/build/outputs/apk/direct/release/*.apk "device-release/$apk"
          sha="$(sha256sum "device-release/$apk" | cut -d' ' -f1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${apk}"
          printf '{"version":"%s","url":"%s","sha256":"%s"}\n' "$VERSION" "$url" "$sha" >device-release/intentic-device.json
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: intentic-device-release
          path: device-release
          if-no-files-found: error
          retention-days: 7
