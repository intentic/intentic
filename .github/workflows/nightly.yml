# The deep verification tiers, on a schedule rather than per-push — they need real credentials, real infra, or
# both, and they take hours. Split out of ci.yml because a schedule is a different trigger, not a different
# branch: kept inside one pipeline, every publish rule there would need a not-a-schedule guard to stop the
# nightly re-tagging images and rolling production at 03:00 for a commit nobody pushed. A separate workflow
# deletes that whole class of bug.
name: Nightly

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  # ONE TIER, ON DEMAND — because the loop, not the bug, is what made this file expensive. Every tier here needs
  # real infra, so the only honest test of a fix to one of them is a run of that one, and until this input
  # existed the smallest thing anyone could dispatch was ALL of them: hours of desktop, mobile, image and e2e
  # work to learn whether a one-line change to the onboarding daemon step was right. The onboarding tier spent
  # three nights on three different failures at a rate of one attempt per day, each found the next morning.
  #
  # `all` is the default and what the schedule runs (a scheduled run supplies no inputs at all, hence the
  # `|| 'all'` in each job's `if`), so the nightly is unchanged; the value only ever narrows a manual dispatch.
  # Every job carries its own name here — a tier absent from this list simply cannot be dispatched alone, which
  # is the failure mode to avoid when adding the next one.
  workflow_dispatch:
    inputs:
      only:
        description: Run a single tier instead of the whole nightly.
        type: choice
        default: all
        options:
          - all
          - e2e
          - onboarding
          - desktop-setup
          - desktop-update
          - desktop-windows
          - images-public
          - install-urls
          - provider-canary
          - update-survival
          - mobile
          - tidy
          - ci-audit

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  PNPM_STORE: /ci-cache/pnpm-store
  TURBO_CACHE_DIR: /ci-cache/turbo
  INDEXNOW_ENABLED: "0"

jobs:
  # `pnpm e2e` fans out to three tiers, and each declares what it needs (`@intentic/testing/e2e`) instead of
  # assuming this job holds it:
  #
  #   sandbox-daemon  sandbox.e2e   no credentials — a Docker daemon is the whole requirement, so this is the
  #                                 tier that always has something to say.
  #   cloudflare      cli.e2e       CLOUDFLARE_API_TOKEN, scoped DNS-edit + tunnel-edit on a zone you own.
  #   discord         discord.e2e   DISCORD_E2E_BOT_TOKEN + _SENDER_TOKEN + _CHANNEL_ID. ANTHROPIC_API_KEY
  #                                 additionally unlocks the one spec that spends a real agent turn.
  #   stripe          hosted-plan-stripe.e2e   HOSTED_PLAN_E2E_STRIPE_SECRET_KEY (a TEST-mode key) +
  #                                 HOSTED_PLAN_E2E_STRIPE_PRICE_ID (the hosted plan's test-mode price): the
  #                                 platform's own Stripe client against Stripe, the one tier that sees an
  #                                 API version move a field under it.
  #
  # A tier this job has no credentials for stands down and names the variable it wanted, in the suite title
  # vitest prints beside the ↓. So green here means the UNLOCKED tiers passed and the log says which those
  # were — and widening the run is a matter of adding the secret, never of editing this file. What a missing
  # credential must not do is fail the job.
  #
  # `pnpm e2e` is the WHOLE scope on purpose — the turbo task name is what decides which tiers run, not a
  # filter list here that would drift the first time a suite is added. The browser tier (@intentic/e2e) is
  # `e2e:browser` for exactly that reason: it addresses its stack on localhost, which is nobody's postgres here.
  e2e:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'e2e' }}
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 180
    env:
      # SANDBOX_E2E_IMAGE is deliberately UNSET — the image build step below says why.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DISCORD_E2E_BOT_TOKEN: ${{ secrets.DISCORD_E2E_BOT_TOKEN }}
      DISCORD_E2E_SENDER_TOKEN: ${{ secrets.DISCORD_E2E_SENDER_TOKEN }}
      DISCORD_E2E_CHANNEL_ID: ${{ secrets.DISCORD_E2E_CHANNEL_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HOSTED_PLAN_E2E_STRIPE_SECRET_KEY: ${{ secrets.HOSTED_PLAN_E2E_STRIPE_SECRET_KEY }}
      HOSTED_PLAN_E2E_STRIPE_PRICE_ID: ${{ secrets.HOSTED_PLAN_E2E_STRIPE_PRICE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      # Whatever these tiers still PULL from a private package — the CLI lane's dind-host, or an image a
      # debugging run points SANDBOX_E2E_IMAGE at — authenticates client-side, because the host daemon behind
      # the mounted socket holds no registry credential. The daemon under test is built below, not pulled.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/pnpm-setup
      # The whisper model the discord tier transcribes with — a download worth keeping between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/intentic-e2e
          key: intentic-e2e-whisper
      - run: mkdir -p "$HOME/.cache" "$GITHUB_WORKSPACE/.cache/intentic-e2e" && ln -sfn "$GITHUB_WORKSPACE/.cache/intentic-e2e" "$HOME/.cache/intentic-e2e"
      # The iq models the image bakes (~57 MB from HuggingFace), on the key ci.yml's images job uses, so the
      # fetch happens once per change of the fetch script rather than once a night.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .image-out/iq-models
            .image-out/.iq-models-complete
          key: iq-models-${{ hashFiles('_search/iq-engine/scripts/fetch-model.mjs') }}
      # THE DAEMON UNDER TEST IS THE ONE THIS CHECKOUT BUILDS, and the tier means nothing otherwise.
      #
      # This job used to pass `SANDBOX_E2E_IMAGE=ghcr.io/intentic/sandbox:latest` on the strength of the word
      # "freshly". That tag moves in ONE place — ci.yml's `images` job, gated on `verify-core` passing on a push
      # to main — so a red main FREEZES it, and this suite then asserts today's contract against whatever daemon
      # last passed. On the night this was written that daemon was 19 hours old: the two automation specs failed
      # on a `webhookToken` the published image had never heard of, because door tokens landed at 11:04 and the
      # last green main was 00:12 (run 34053040446; `grep -r webhookToken /opt/sandbox` in that image finds
      # nothing). The suite was right, the image was old, and no commit could have turned the job green.
      #
      # Building it here is the harness's own default when the variable is empty (e2e-harness.ts), the path every
      # developer already runs, and the same trees the images job publishes — the artifact, one build earlier. It
      # costs a `docker build` of pure COPYs on top of the turbo cache this fleet keeps warm.
      #
      # Whether the PUBLISHED image boots is a different question, and ci.yml answers it where it is asked:
      # smoke-image.sh runs against both halves before any moving tag points at them.
      #
      # IN A STEP, not inside the suite, because the suite's budget is the wrong one to spend it from: the
      # harness builds in `beforeAll`, which allows 20 minutes, and a build with no warm layers spends longer
      # than that on chromium and ffmpeg alone — measured here, and it fails as 43 skipped tests and a timeout
      # that names nothing. `build:sandbox` is the same trees, the same composed Dockerfile and the same layers
      # (a tag of its own, which is all that differs), so the harness's own build behind it is a cache replay.
      - run: pnpm build:sandbox
      - run: pnpm e2e
      # Tonight's build displaces last night's layers under the same tag, and a dangling layer on a runner that
      # outlives the job is nobody's to evict. Same rule, filter and `always()` as the onboarding job's prune.
      #
      # THE WINDOW HAS TO BE SHORTER THAN THE CADENCE, and `until=336h` was not. `until` filters on when an
      # image was CREATED, so a fourteen-day window exempts every layer this pipeline has ever displaced —
      # last night's are twenty-four hours old when this step runs, and the bound evicted nothing for two
      # weeks at a time. That is the standing occupancy behind both host-disk incidents in
      # docs/ops/ci-runner.md: 2.04 GB free of 1 TB on 30 August, and run 34096964073, where docker's data
      # disk could not extend while update-survival was mid-extraction and the ext4 inside it went read-only
      # under a job that had done nothing wrong.
      #
      # 12h is half the 24h cadence: it always catches the generation this run displaced, and never touches
      # anything a job on this box created today. It is not a retention policy — there is nothing here worth
      # retaining. Two sandbox images built from two different commits share ZERO of their 106 layers (checked
      # against ghcr for :latest and :stable), so each build is a full 1.58 GB compressed and the generation
      # it displaces is 1.58 GB that will never be read again.
      - if: always()
        run: docker image prune -f --filter until=12h || true

  # THE ONBOARDING JOURNEY (@intentic/onboarding), once per way of getting a sandbox.
  #
  # It stands the whole platform up from the branch's own images and walks a new account through the wizard to
  # a connected sandbox, twice: through the compose file that wizard renders, and through `ic sandbox connect`,
  # which is where the desktop app and the terminal one-liner both end up. Nothing else in this pipeline goes
  # THROUGH provisioning into a daemon the wizard's own instructions started, and until this ran, nothing did:
  # the tier was written, documented as a release gate, and called by no workflow at all. What lived in that
  # gap is worth naming — reachability moved to intentic's own edge, ic stopped passing the two values a daemon
  # dials with, every layer's own tests stayed green, and four days of installs came up healthy, registered,
  # and reachable by nobody.
  #
  # Nightly rather than per-push: it builds the api and web images, pulls a sandbox image and boots a real box.
  # On the DESKTOP runner in ci-desktop, which is the image that bakes the Rust toolchain — the CLI lane drives
  # the ic this commit builds, for the reason the world builds the api rather than pulling `:latest`.
  #
  # THE ONE JOB ON THIS FLEET THAT DOES NOT DRIVE THE HOST'S DAEMON, and the only tier that cannot. It serves
  # its whole world on LOOPBACK ports and bind-mounts a per-run TLS pair into the containers it starts
  # (_tools/onboarding/src/docker.ts and certs.ts each say why in full), and the host's daemon breaks both: a
  # port it publishes is on the HOST's loopback, and a bind mount names a path in the HOST's filesystem —
  # neither of which is this process's. So the daemon comes to the process instead. That was not a near miss:
  # the tier's own check refused to go further and the job died on `postgres published a port that this process
  # cannot reach` (run 34030369992), which is the sentence that check exists to print.
  #
  # Removing the socket from `volumes:` below did NOT remove it from the container — the runner mounts it into
  # every container job regardless — so the daemon this job starts also needs a LISTEN PATH of its own. The
  # step below has the account; without it the arrangement looks correct and behaves exactly as it did before.
  onboarding:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'onboarding' }}
    runs-on: [self-hosted, intentic, desktop]
    container:
      image: ghcr.io/intentic/ci-desktop:latest
      # What the job's own dockerd needs, and NOT a widening of this job's reach: the mounted host socket it
      # replaces was unrestricted root on the runner, which this is not.
      options: --privileged
      volumes:
        - /ci-cache:/ci-cache
        # That daemon's image store, kept between nightlies — otherwise every run re-pulls a sandbox image and
        # a postgres, which is most of this tier's wall clock. One onboarding job runs at a time (this
        # workflow's concurrency group) and nothing else on the runner uses this daemon, so there is no second
        # writer to race.
        #
        # A HOST DIRECTORY and not a path inside the container, which is load-bearing: the layer store is an
        # overlay mount, and stacking one on the container's own overlay filesystem is refused outright —
        # `failed to mount … fstype: overlay … invalid argument`, on the first container the world starts and
        # nowhere near the line that chose the directory.
        - /ci-cache/onboarding-docker:/var/lib/docker
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    env:
      CARGO_HOME: /ci-cache/cargo
      # Its own target dir, for the lock-and-fingerprint reason every other cargo job here has one.
      CARGO_TARGET_DIR: /ci-cache/onboarding-ic-target
      # The freshly published image the box comes up on, the same one the desktop tiers run.
      SANDBOX_E2E_IMAGE: ghcr.io/intentic/sandbox:latest
      # Not $HOME — ci.yml's platform deploy job carries the full account of why a browser left in a job
      # container's home directory reddens unrelated suites on the same runner hours later.
      PLAYWRIGHT_BROWSERS_PATH: /ci-cache/ms-playwright
      # WHERE THIS JOB'S DAEMON LISTENS, AND DELIBERATELY NOT SPELLED `DOCKER_HOST`. The name is the fix: the
      # runner drives this container with the HOST's docker client (`docker exec <container> …`, once per step,
      # to run the step inside it), and that client reads DOCKER_HOST out of the job's environment. Point it at
      # a socket that only exists INSIDE the container and the runner can no longer reach its own job — every
      # step after the one that set it dies on `failed to connect to the docker API at
      # unix:///run/onboarding-docker.sock`, including the cleanup steps, before any of them run a line.
      #
      # That is run 34063131038, and it reads as the daemon having died: the step before it says the daemon is
      # up, and 140ms later the socket "does not exist". The daemon was fine. The daemon was never asked. The
      # host's docker client was, and it was asked on the host, where that path is nothing. The tell is in the
      # same log — the post-job `docker rm --force` SUCCEEDS, against the host daemon, because cleanup does not
      # carry the step environment.
      #
      # So the path is carried under a name nothing else reads, and the steps that want it export DOCKER_HOST
      # into their own shell and nowhere else. Not `$GITHUB_ENV` (that IS the job environment) and not a
      # step-level `env:` (the runner composes that into the same exec).
      JOB_DOCKER_HOST: unix:///run/onboarding-docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/prepare-workspace
      # THE DAEMON THIS TIER'S WORLD RUNS ON, in this container's own network and mount namespaces. Published
      # ports therefore land on the loopback the test process and its browser use, and a bind mount of a
      # temp directory means the directory this job actually wrote.
      #
      # The address pools are pinned away from the ranges either side of this container: the runner puts the
      # job network on Docker's default 172.16/12 pool, and a nested daemon handed the same pool routes the
      # outer network into its own bridge. The world's own network picks 10.89.0.0/24 for the same reason
      # (containers.ts), which is why these two start at 10.90.
      - name: Start this job's own Docker daemon
        shell: bash
        run: |
          set -euo pipefail
          # ON A SOCKET OF ITS OWN, because /var/run/docker.sock IS NOT THIS JOB'S TO LISTEN ON. The runner puts
          # `-v /var/run/docker.sock:/var/run/docker.sock` in the `docker create` line of every container job it
          # starts, whatever this file's `volumes:` say, and a bind-mounted socket cannot be replaced: dockerd
          # dies at startup on `can't create unix socket /var/run/docker.sock: device or resource busy` while
          # `docker version` goes on answering — from the HOST's daemon, which was never down.
          #
          # That is how the wait below passed in 190ms against a daemon this job did not start (run 34053040446):
          # the world then came up on the runner, its ports were published on the RUNNER's loopback, and the
          # journey died on `postgres published a port that this process cannot reach` — the same sentence as the
          # night before, printed for the opposite reason, on an arrangement that reads as correct.
          #
          # DOCKER_HOST is exported into THIS SHELL ONLY — the job env carries the path under JOB_DOCKER_HOST
          # instead, for the reason spelled out where that is set. It is also what makes the wait honest: an
          # answer here can only come from the daemon this step just started.
          export DOCKER_HOST="$JOB_DOCKER_HOST"
          dockerd --host "$DOCKER_HOST" --bip 10.90.0.1/24 --default-address-pool base=10.91.0.0/16,size=24 > /tmp/dockerd.log 2>&1 &
          for _ in $(seq 1 60); do
            if docker version --format '{{.Server.Version}}' > /dev/null 2>&1; then
              echo "this job's dockerd is up on $DOCKER_HOST: $(docker version --format '{{.Server.Version}}')"
              exit 0
            fi
            sleep 1
          done
          echo "this job's Docker daemon never came up — its log:" >&2
          cat /tmp/dockerd.log >&2
          exit 1
      # The sandbox image is a private package and the daemon started above holds no registry credential —
      # pulls authenticate client-side, so this login is what the box's pull presents.
      #
      # Hand-rolled rather than docker/login-action, and that is not a preference: `docker login` is a
      # client-side write to ~/.docker/config.json, so it belongs in a shell that can name its own DOCKER_HOST.
      # An action cannot — its only channel is a step-level `env:`, which is the job environment this job must
      # keep clean. One fewer JavaScript action in a container job is the second reason: each one costs the
      # runner a `docker exec` probe of the container before it runs.
      #
      # BOTH halves of the credential arrive as `env:`, never as `${{ }}` inside the script. The token because a
      # secret written into a run block is a secret written into the shell's command line; the actor because
      # `github.actor` is a repository-controlled string that the expansion would splice in as SCRIPT rather than
      # data — the template-injection shape zizmor fails the checkout gate on, and the reason this file carries no
      # `${{ }}` in any `run:`.
      - name: Log in to ghcr.io for the box's image pull
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          export DOCKER_HOST="$JOB_DOCKER_HOST"
          printenv GHCR_TOKEN | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - uses: ./.github/actions/pnpm-setup
      - run: npx playwright install --with-deps chromium
        working-directory: _tools/onboarding
      # musl/static, so the same binary runs wherever this tier puts it. IC_BIN is named HERE rather than in
      # the job's `env:` block, and the difference is not style: `${{ github.workspace }}` expands to the
      # RUNNER HOST's path to the workspace even inside a container job, so the job pointed the CLI lane at a
      # binary that cannot exist in here. Naming it at all is what makes that lane fail loudly instead of
      # standing down in the job that exists to run it — so it has to be the path this job actually has.
      - name: Build the CLI lane's ic
        run: |
          bash _tools/scripts/build/build-ic.sh linux-x64
          echo "IC_BIN=$GITHUB_WORKSPACE/_sandbox/ic/dist-bin/ic-linux-amd64" >> "$GITHUB_ENV"
      # DOCKER_HOST in the suite's own shell: the tier reads it out of process.env (docker.ts) and passes it
      # down to every docker it shells out to (shell.ts's PASS_THROUGH), so this one line is what puts the whole
      # journey on the daemon this job started rather than the runner's.
      - name: Walk the onboarding journey
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_HOST="$JOB_DOCKER_HOST"
          pnpm --filter @intentic/onboarding e2e:onboarding
      # Bound the store the volume above keeps: every run tags a fresh api and web image over yesterday's, and
      # the ones it displaces are dangling layers nothing else evicts. Same rule and the same reason as the
      # turbo cache prune in the pnpm-setup composite — a directory that outlives the job needs a job to bound
      # it. `always()`, because a failed run leaves exactly as much behind as a green one — and `|| true`
      # because the one failure that reaches here with no daemon to talk to is the daemon step itself, which
      # has already said so.
      #
      # 12h rather than the 336h this was written with, for the reason the e2e job's prune spells out in full:
      # `until` reads an image's CREATION time, so a window longer than the 24h cadence exempts the very
      # generation the step exists to evict.
      - if: always()
        shell: bash
        run: |
          export DOCKER_HOST="$JOB_DOCKER_HOST"
          docker image prune -f --filter until=12h || true

  # Desktop verification tier 3: verify-desktop-setup.sh runs the connect.sh EXTRACTED FROM THE INSTALLER on a
  # clean Docker host and waits for the sandbox daemon to answer /health. It pulls the sandbox image, so it is
  # nightly rather than per-push — tiers 1 and 2 run in ci.yml's desktop-verify on every main push that touches
  # the desktop tree.
  desktop-setup:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'desktop-setup' }}
    runs-on: [self-hosted, intentic, desktop]
    container:
      image: ghcr.io/intentic/ci-desktop:latest
      volumes:
        - /ci-cache:/ci-cache
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CARGO_HOME: /ci-cache/cargo
      CARGO_TARGET_DIR: /ci-cache/desktop-verify-target
      INTENTIC_HOST_IMAGE: ghcr.io/intentic/dind-host:latest
      SANDBOX_E2E_IMAGE: ghcr.io/intentic/sandbox:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/prepare-workspace
      # dind-host and the sandbox image are private packages; the docker CLI sends this login to the host
      # daemon with each pull.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/pnpm-setup
      - run: bash _tools/scripts/desktop/build-desktop.sh 0.0.0 --linux-only
      - run: bash _tools/scripts/desktop/verify-desktop-setup.sh

  # Desktop verification tier 3b: does the app move ITSELF onto the release that was published?
  #
  # Its own job rather than a step on desktop-setup, because it shares nothing with that one's inputs: it
  # builds two AppImages of its own, at two versions, signed with a throwaway key and pointed at a loopback
  # release endpoint — none of which the shipped artifact carries, and all of which are build-time config
  # rather than a runtime hook the released app would also have (verify-desktop-update.sh says why).
  #
  # This is the tier that would have caught the whole of it: for every release up to v1.213.0 the app checked
  # once, said "it installs the next time you quit", and installed nothing on any path — green the entire time,
  # because nothing anywhere asserted the outcome.
  desktop-update:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'desktop-update' }}
    runs-on: [self-hosted, intentic, desktop]
    container:
      image: ghcr.io/intentic/ci-desktop:latest
      volumes:
        - /ci-cache:/ci-cache
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CARGO_HOME: /ci-cache/cargo
      # Its own target dir: this job builds at two versions, which invalidates the app crate on each pass, and
      # sharing desktop-setup's store would make the two jobs re-do each other's final link every night.
      CARGO_TARGET_DIR: /ci-cache/desktop-update-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/prepare-workspace
      - uses: ./.github/actions/pnpm-setup
      - run: bash _tools/scripts/desktop/verify-desktop-update.sh

  # The Windows artifacts this file's Windows tiers run, cross-built on Linux exactly as ci.yml's
  # desktop-windows-build does and for the same two reasons — the installer has always been cross-built, and
  # `ic` has to come from THIS checkout or the shim would download the last release's flow and verify that
  # instead. Built here rather than reused from a ci.yml run because a nightly is its own trigger with its own
  # commit, and reaching across workflows for an artifact would make this job's subject "whatever main last
  # built" rather than "main".
  desktop-windows-build:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'desktop-windows' }}
    runs-on: [self-hosted, intentic, desktop]
    container:
      image: ghcr.io/intentic/ci-desktop:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CARGO_HOME: /ci-cache/cargo
      CARGO_TARGET_DIR: /ci-cache/desktop-windows-target
      XWIN_CACHE_DIR: /ci-cache/xwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/prepare-workspace
      - uses: ./.github/actions/pnpm-setup
      - run: bash _tools/scripts/desktop/build-desktop.sh 0.0.0 --windows-only
      - run: bash _tools/scripts/build/build-ic.sh windows-x64
      # Staged flat for the reason ci.yml's desktop-windows-build spells out: a multi-path upload is rooted at
      # the paths' common ancestor, and the tiers below ask for these two by name.
      - run: |
          . _tools/scripts/lib/desktop-artifacts.sh
          mkdir -p windows-artifacts
          cp "$(desktop_artifact _editor/desktop-app/dist-bin nsis)" _sandbox/ic/dist-bin/ic-windows-amd64.exe windows-artifacts/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-artifacts-nightly
          path: windows-artifacts
          if-no-files-found: error
          retention-days: 7

  # Windows desktop verification tiers 2 and 3 — the two that need a real Docker daemon and a connected
  # account, which is what puts them here rather than in ci.yml beside tier 1.
  #
  #   setup   runs the connect.ps1 the INSTALLER put on this machine, with the direct-token path that needs no
  #           Cloudflare and no platform, and waits for the sandbox daemon to answer. It pulls the sandbox
  #           image, so it is nightly for the same reason the Linux setup tier is.
  #   agents  reaches that sandbox from the HOST, at the loopback address a browser on this machine derives,
  #           proves the gate is real, drives it with the credential a program is meant to hold, and runs one
  #           turn.
  #
  # The turn is the one step CI cannot fake: connecting an AI account is a subscription OAuth flow through a
  # browser. INTENTIC_AGENT_AUTH_VOLUME names a Docker volume on this machine holding an account connected ONCE
  # by hand — the product's own answer to "several sandboxes, one set of credentials". Absent it, the tier
  # stands down NAMING it and everything up to the turn still runs, which is the same contract every other
  # gated tier in this file has: a tier that cannot reach its credential has nothing to say, and must not fail.
  # The DEEP call: tiers 1, 2 and 3. Two and three are the ones that need a real Docker daemon and a connected
  # account, which is what puts them here rather than in ci.yml beside tier 1. The 120-minute budget is for
  # them — tier 2 pulls a full sandbox image before it can wait on the daemon.
  desktop-windows:
    needs: [desktop-windows-build]
    if: ${{ !cancelled() && needs.desktop-windows-build.result == 'success' && ((inputs.only || 'all') == 'all' || inputs.only == 'desktop-windows') }}
    uses: ./.github/workflows/windows-smoke.yml
    with:
      artifact-name: windows-desktop-artifacts-nightly
      installer: Intentic-*-x64-setup.exe
      deep: true
      sandbox-image: ghcr.io/intentic/sandbox:latest
      timeout-minutes: 120

  # The published images are readable WITHOUT a credential — the one thing no other job here can see. Every job
  # in this file and in ci.yml opens with a `docker login ghcr.io`, including desktop-setup above, which runs
  # the shipped connect.sh but hands it the runner's login; so a package published private looks identical to a
  # public one from inside the pipeline, and the first thing that notices is a user's install dying at
  # `error from registry: unauthorized`. That is not hypothetical — it is how the sandbox image shipped.
  #
  # Cheap enough to be a schedule rather than a release gate (two HTTP calls, no pull), and a schedule is the
  # right trigger anyway: this guards REGISTRY state, which can turn private again long after the release that
  # published it. The ci-base container is pulled with credentials as everywhere else, which does not weaken the
  # check — the script speaks HTTP to the registry's token endpoint as an anonymous client and never invokes
  # docker, so it cannot pick up a login from the runner's shared config.
  images-public:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'images-public' }}
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - run: node _tools/scripts/image/verify-images-public.mjs

  # THE OTHER THING A USER REACHES WITHOUT A CREDENTIAL, and the sibling of the job above: the install one-liners
  # the app and the site print. `curl -fsSL https://intentic.dev/connect | sh` is the front door of this product,
  # and until this job existed nothing anywhere confirmed that the door opens.
  #
  # The check is live on purpose. The app and the site are two deployments reading one table
  # (@intentic/constants' INSTALL_SCRIPTS), and every static check of that table passes while they are out of
  # step: the rename in b266789b5 shipped in the app, the site did not deploy for eight days, and
  # https://intentic.dev/device.ps1 — the exact string the "Connect this device" dialog told people to run —
  # answered with the 404 page relabelled `text/plain`. Green repository, broken product. The script says what
  # it asserts and why it stops short of a byte-comparison.
  #
  # A schedule is the right trigger for the same reason images-public is scheduled rather than gated: this
  # guards DEPLOYED state, which drifts on its own long after the commit that changed it, and no push can be
  # the thing that notices.
  install-urls:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'install-urls' }}
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/pnpm-setup
      # The table is a TypeScript export, so it has to be built before a plain node script can read it — one
      # tsgo of one small package, rather than a second copy of the table in this repository, which is the
      # arrangement that put a 404 page into somebody's shell in the first place.
      - run: pnpm --filter @intentic/constants build
      - run: node _tools/scripts/ci/check-install-urls.mjs

  # THE VENDOR CANARY: the conformance tier again, but against each provider's NEWEST CLI instead of the
  # version the packs pin.
  #
  # This is the job that changes when we find out. Every provider break this repository has shipped was
  # discovered by a user after a pin bump landed: the config key that became a table, the tool that started
  # fabricating consent. Running the same assertions against `@latest` moves that discovery to the night a
  # vendor publishes, which is before anyone has decided to bump. Red here does not mean the product is broken
  # — it means DO NOT BUMP YET, and it names which assertion stops holding.
  #
  # It is deliberately NOT a gate on anything. Nothing in this repository ships `@latest`, so a red canary must
  # never be able to stop a release that is pinned to a version still passing in CI.
  provider-canary:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'provider-canary' }}
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    # Reports; it does not gate — see above. The nightly's own summary is where a red canary is read.
    continue-on-error: true
    env:
      # Not the shared /ci-cache prefix the pinned gate uses: installing @latest there would leave the next
      # verify-providers run resolving a module the packs never pinned, and the gate would quietly stop
      # testing the shipped article.
      INTENTIC_CURSOR_SDK_DIR: /ci-cache/cursor-sdk-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/pnpm-setup
      - run: bash _tools/scripts/ci/install-provider-clis.sh --latest
      # The versions that were actually tested, printed into the log: a red canary is only actionable if the
      # run says which release it was red against.
      - run: pnpm e2e:providers

  # THE UPDATE PROMISES, DRILLED ON A REAL SANDBOX — verify-update-survival.sh connects a sandbox on the
  # published stable image, plants sentinels in /work and /history, then updates, rolls back, and forces a
  # FAILED update, asserting after each that the daemon is healthy, the files survived, and (for the failure)
  # that the parked-container restore returned exactly the sandbox it found. A red run here means the product's
  # central promise — "your files are never touched; the worst outcome of an update is the sandbox you already
  # had" — broke, before any user felt it. Nightly because it pulls two full sandbox images into a clean dind
  # host; ci-desktop for the same reason ic-check uses it: ic builds with the baked cargo.
  update-survival:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'update-survival' }}
    runs-on: [self-hosted, intentic, desktop]
    container:
      image: ghcr.io/intentic/ci-desktop:latest
      volumes:
        - /ci-cache:/ci-cache
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CARGO_HOME: /ci-cache/cargo
      CARGO_TARGET_DIR: /ci-cache/ic-check-target
      INTENTIC_HOST_IMAGE: ghcr.io/intentic/dind-host:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/prepare-workspace
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash _tools/scripts/image/verify-update-survival.sh

  # THE STORE SHELLS, on the schedule as well as on their path filter. Both jobs prove a project a pinned
  # external generator writes from a checked-in manifest, and that pair drifts with no commit of ours: a
  # Bubblewrap that began requiring a manifest key wrote `splashScreenFadeOutDuration: ,` into build.gradle,
  # and a Capacitor that moved to Swift-package wiring stopped writing the App.xcworkspace both mobile
  # workflows opened. Under the path filter alone nothing looks until someone touches a shell, so the shells
  # sat broken for a day across three red runs on pushes that changed neither (docs/ci-failure-audit.md,
  # class F). Here it costs nobody's push.
  #
  # A CALL, not a copy: mobile.yml owns the two jobs and gained `workflow_call` for this. It runs on
  # GitHub-hosted runners and touches no secret, so it needs nothing from this file's env or credentials —
  # `contents: read` is the whole grant, which is what this workflow already holds.
  mobile:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'mobile' }}
    uses: ./.github/workflows/mobile.yml

  # THE TIDY GATE: THE ONE PLACE A TIDY CHECK REFUSES.
  #
  # _tools/checks/manifest.mjs splits the checks by what a failure MEANS. A `code` failure is refused everywhere
  # — the push, CI's preflight, the turn — because the tree does not work. A `tidy` failure (a directory of 35
  # files, a dead link in a README, a hand-spelled root, a subsystem with no invariant) is a real cost with a
  # measured case behind it in docs/audits/, and it is nobody's push to stop: on the day the split was made, 9
  # of the 11 pushes the gate refused were refused by tidy checks in under five seconds, for state no single
  # actor had produced and that the agent then sent after it could not see from its worktree.
  #
  # So the refusal lives HERE, where it costs nobody anything: one commit, read on a GitHub-hosted runner, with
  # no `needs` in either direction. Nothing in this file waits on it, no push waits on it, and a red here is a
  # message about the tree on main rather than a refusal of whoever pushed last. `--gate=tidy` runs exactly the
  # checks the other runs downgrade to warnings, so the pair cannot drift: one manifest, two exit codes.
  #
  # A FRESH CHECKOUT IS THE POINT. Half of what these rules measure is invisible on a persistent workspace (the
  # layout check's ghost directories are build output a rename left on a runner that never cleans) and half is
  # invisible in an agent's worktree (where the isolation layer mounts those same paths back in). A
  # GitHub-hosted runner clones the commit and nothing else, which is the only tree where all of it can be read.
  tidy:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'tidy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The node this repository pins, read from the same `engines` field everything else reads, rather than
      # whatever the hosted image happens to ship this month. No install follows it: `node-version-file` is
      # here for the version alone, which is the one thing a bare `node` on a hosted runner cannot promise.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
      # Checkout only: no install, no network, under two seconds. Same runner as ci-audit for the same reason —
      # the self-hosted fleet is six processes on one box, and a check that needs nothing from it should want
      # nothing from it.
      - run: node _tools/checks/run.mjs --gate=tidy

  # WHICH GATE TO BUILD NEXT. The failing steps of the last hundred pipelines on main, grouped and counted, as
  # this job's summary: the extraction docs/ci-failure-audit.md was written from (runs → jobs → failed step →
  # first error line), run every night instead of reconstructed in a two-week retrospective. Reads the Actions
  # API with the token's read scope and nothing else, so a GitHub-hosted runner is the right place for it and
  # the self-hosted fleet is never in its path. A red week is a table here, never a failure of this job.
  ci-audit:
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'ci-audit' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node _tools/scripts/ci/ci-audit.mjs --runs 100 --logs >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
