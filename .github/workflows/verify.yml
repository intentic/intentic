# One verify group: typecheck, build and test a release group's closure. Called twice from ci.yml (verify-core and
# verify-platform) with different filters.
#
# A REUSABLE WORKFLOW rather than a matrix, and the reason is the DAG. Actions reports a matrix job's result as
# one aggregate across every leg, so `needs: verify` would be 'failure' when ANY group broke — and `images`
# would then wait on the marketing site, and a platform deploy would wait on the desktop launcher UI. That is
# precisely the coupling the split exists to remove: a failed group must publish nothing of its own and block
# nothing of anyone else's. Separate callers give separately-nameable results. Actions supports no YAML anchors,
# so this file is how one definition serves every caller without a matrix.
name: verify

on:
  workflow_call:
    inputs:
      filters:
        description: The turbo --filter flags naming this group's closure.
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  PNPM_STORE: /ci-cache/pnpm-store
  TURBO_CACHE_DIR: /ci-cache/turbo
  # The fleet's turbo remote cache (_tools/turbo-cache), when the repository names one: TURBO_API and TURBO_TEAM
  # are variables, TURBO_TOKEN a secret. Empty, turbo reads them as unset and uses /ci-cache/turbo alone.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  INDEXNOW_ENABLED: "0"
  # SIX RUNNER PROCESSES SHARE ONE BOX (docs/ops/ci-runner.md), and no cgroup says so: these containers are started
  # without `--memory`, so each job reads the whole machine's RAM and no ceiling at all. test-workers.mjs divides by
  # this where it sizes a fan-out by division (the e2e tiers); the suites below size from the pool instead.
  CI_HOST_JOBS: "6"
  # THE HOST'S TEST MEMORY POOL, in one-GiB slots every job on the box draws from (_tools/scripts/lib/test-memory-pool.mjs).
  # Each `suites` run takes slots for the workers its file count is worth, so the web suite spreads over several workers
  # when the box is quiet and runs on one when it is not. The same pair as ci.yml's, and sized with the fleet: 16 of the
  # WSL VM's 26 GB, leaving the rest to typechecks, builds and Docker.
  TEST_SLOTS_DIR: /ci-cache/test-slots
  TEST_SLOTS: "16"
  # These groups are the gates production and the release wait on, so their suites may also draw from the six slots
  # ci.yml keeps back from every other job, and a big one short of half its workers waits up to 90 s for room.
  TEST_SLOTS_RESERVED: "6"
  TEST_SLOTS_PRIORITY: gate
  TEST_SLOTS_WAIT: "90"
  # Where a passing vue-tsc check leaves its build info for the next one on any runner (seed-buildinfo.mjs).
  TSBUILDINFO_SHARE_DIR: /ci-cache/tsbuildinfo

jobs:
  verify:
    runs-on: [self-hosted, intentic]
    # The Actions default is 360 minutes. This is the job most likely to hang, and there are only six
    # runner processes to hang one of.
    timeout-minutes: 60
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Keep node_modules between runs — the Actions equivalent of GIT_CLEAN_FLAGS: -ffdx -e node_modules.
          # A clean checkout deletes 69k files and the install then re-links them from nothing; letting the
          # install reconcile what is there instead is worth minutes in every one of these jobs.
          clean: false
      - uses: ./.github/actions/pnpm-setup
        with:
          lockfile-drift: measure

      # `typecheck` is the one that reads the TEST files. `build` cannot: an emitting package excludes *.test.ts to keep test
      # code out of dist, which left the tests unchecked by anything but their own execution: hand-built fakes drifted out
      # of shape with the seams they stand in for, and only ever said so as an opaque 500 in some unrelated suite.
      #
      # It needs nothing from the build graph: the emit below writes its own declarations, which is what makes the same
      # check runnable in an agent worktree. It used to depend on `^build`, and a pnpm `build` dies EXDEV in a worktree, so
      # the check that decided main's health was the one check nobody could run locally.
      #
      # THE DECLARATIONS ALONE, NOT `pnpm prepass`. The root script is the checks manifest and then this emit, and the
      # manifest is preflight's to run (from the checkout) and `quick`'s (after a fresh install). Run here too, a failing
      # check skipped this group's typecheck and every test behind it. The emit is the one real dependency the step below
      # has. Invoked directly rather than through `pnpm typecheck`, because the root script cannot take a filter.
      - id: declarations
        run: node _tools/scripts/build/emit-declarations.mjs
      # ONE turbo graph for `typecheck build test`. Two invocations are a hard barrier: the typecheck used to finish
      # before any build or test started, so the web's vue-tsc (5 minutes under load, 2026-10-07) sat in front of the
      # web's tests (20) instead of beside them. Nothing in a test reads a typecheck, so in one graph each package's
      # tests start the moment its own deps are built while the typechecks run beside them.
      #
      # `--continue=dependencies-successful`: turbo otherwise stops at the first failing task, so a failed pipeline
      # reported one broken package and the next push found the next one. Continuing into everything whose own
      # dependencies still pass makes one run say everything that is wrong, and a type error no longer hides the tests
      # behind it: it used to fail a step of its own and skip this one.
      #
      # THROUGH THE ENVIRONMENT, not interpolated into the script. `${{ }}` inside a `run:` block is textual substitution
      # BEFORE the shell sees the line, so the value becomes script rather than an argument to it: the shape zizmor calls
      # template-injection. The inputs here come from literals in ci.yml and are not attacker-reachable today, but the fix
      # costs a line and the shape is what gets copied into the next workflow. UNQUOTED ON PURPOSE: this is a list of
      # turbo flags, and the word splitting is the point; `"$X"` would hand turbo one argument spelled `--filter=a --filter=b`.
      #
      # NO TEST_WORKERS: each `suites` run sizes itself from the host's pool (TEST_SLOTS_DIR above), which knows what the
      # other jobs on the box hold right now. A fixed count computed here could only divide the box by six.
      - run: pnpm turbo run typecheck build test $FILTERS --continue=dependencies-successful
        if: ${{ !cancelled() && steps.declarations.outcome == 'success' }}
        env:
          FILTERS: ${{ inputs.filters }}
