# One verify group: typecheck, build and test a release group's closure. Called twice from ci.yml (verify-core and
# verify-platform) with different filters.
#
# A REUSABLE WORKFLOW rather than a matrix, and the reason is the DAG. Actions reports a matrix job's result as
# one aggregate across every leg, so `needs: verify` would be 'failure' when ANY group broke — and `images`
# would then wait on the marketing site, and a platform deploy would wait on the desktop launcher UI. That is
# precisely the coupling the split exists to remove: a failed group must publish nothing of its own and block
# nothing of anyone else's. Separate callers give separately-nameable results. Actions supports no YAML anchors,
# so this file is how one definition serves every caller without a matrix.
name: verify

on:
  workflow_call:
    inputs:
      report-name:
        description: Unique name for this verify group's test reports.
        required: true
        type: string
      filters:
        description: The turbo --filter flags naming this group's closure.
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  PNPM_STORE: /ci-cache/pnpm-store
  PNPM_METADATA: /ci-cache/pnpm-metadata
  TURBO_CACHE_DIR: /ci-cache/turbo
  # A turbo remote cache, when the repository names one: TURBO_API and TURBO_TEAM
  # are variables, TURBO_TOKEN a secret. Empty, turbo reads them as unset and uses /ci-cache/turbo alone. Never point
  # them at _tools/turbo-cache's server: it also serves what sandboxes wrote, which CI may take only through that
  # directory's import.mjs, the step that checks each entry against CI's own dry run.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_TIMEOUT: "10"
  TURBO_REMOTE_CACHE_UPLOAD_TIMEOUT: "30"
  INDEXNOW_ENABLED: "0"
  # SIX RUNNER PROCESSES SHARE ONE BOX (docs/ops/ci-runner.md), and no cgroup says so: these containers are started
  # without `--memory`, so each job reads the whole machine's RAM and no ceiling at all. test-workers.mjs divides by
  # this where it sizes a fan-out by division (the e2e tiers); the suites below size from the pool instead.
  CI_HOST_JOBS: "6"
  # THE HOST'S TEST MEMORY POOL, in one-GiB slots every job on the box draws from (_tools/scripts/lib/test-memory-pool.mjs).
  # Each `suites` run takes slots for the workers its file count is worth, so the web suite spreads over several workers
  # when the box is quiet and runs on one when it is not. The same pair as ci.yml's, and sized with the fleet: 16 of the
  # WSL VM's 26 GB, leaving the rest to typechecks, builds and Docker.
  TEST_SLOTS_DIR: /ci-cache/test-slots
  TEST_TIMINGS_DIR: /ci-cache/test-timings
  TEST_SLOTS: "16"
  # These groups are the gates production and the release wait on, so their suites may also draw from the six slots
  # ci.yml keeps back from every other job, and a big one short of half its workers waits up to 90 s for room.
  TEST_SLOTS_RESERVED: "6"
  TEST_SLOTS_PRIORITY: gate
  TEST_SLOTS_WAIT: "90"
  # Where a passing vue-tsc check leaves its build info for the next one on any runner (seed-buildinfo.mjs).
  TSBUILDINFO_SHARE_DIR: /ci-cache/tsbuildinfo

jobs:
  verify:
    runs-on: [self-hosted, intentic]
    # The Actions default is 360 minutes. This is the job most likely to hang, and there are only six
    # runner processes to hang one of.
    timeout-minutes: 60
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Keep node_modules between runs — the Actions equivalent of GIT_CLEAN_FLAGS: -ffdx -e node_modules.
          # A clean checkout deletes 69k files and the install then re-links them from nothing; letting the
          # install reconcile what is there instead is worth minutes in every one of these jobs.
          clean: false
      - uses: ./.github/actions/pnpm-setup
        with:
          lockfile-drift: measure

      # `typecheck` is the one that reads the TEST files. `build` cannot: an emitting package excludes *.test.ts to keep test
      # code out of dist, which left the tests unchecked by anything but their own execution: hand-built fakes drifted out
      # of shape with the seams they stand in for, and only ever said so as an opaque 500 in some unrelated suite.
      #
      # It needs nothing from the build graph: the emit below writes its own declarations, which is what makes the same
      # check runnable in an agent worktree. It used to depend on `^build`, and a pnpm `build` dies EXDEV in a worktree, so
      # the check that decided main's health was the one check nobody could run locally.
      #
      # THE DECLARATIONS ALONE, NOT `pnpm prepass`. The root script is the checks manifest and then this emit, and the
      # manifest is preflight's to run (from the checkout) and `quick`'s (after a fresh install). Run here too, a failing
      # check skipped this group's typecheck and every test behind it. The emit is the one real dependency the step below
      # has. Invoked directly rather than through `pnpm typecheck`, because the root script cannot take a filter.
      - id: declarations
        run: node _tools/scripts/build/emit-declarations.mjs
      # Run typecheck/build/test in one turbo graph so independent checks overlap; continue tasks whose own dependencies succeeded.
      # Pass flags through env to avoid template injection. Deliberate word splitting supplies multiple turbo flags, not one combined argument.
      # suites uses the shared TEST_SLOTS_DIR pool; do not impose a fixed TEST_WORKERS count that ignores other jobs.
      # Warm only output-less typecheck tasks whose current dry-run hashes match sandbox proofs; cache warming must not fail the job.
      - name: Import sandbox results
        if: ${{ !cancelled() && steps.declarations.outcome == 'success' }}
        env:
          FILTERS: ${{ inputs.filters }}
        run: node _tools/turbo-cache/import.mjs -- run typecheck build test $FILTERS
      # THE GRAPH'S FAILURE IS NOT YET THE JOB'S: the step after it decides. Between 2026-10-23 and 11-05, 136 of the 255
      # distinct tests that failed on main failed in exactly one run, which is a busy box rather than broken code.
      - id: graph
        # The verdict is the next step's, which fails the job on any failure it cannot clear.
        continue-on-error: true
        run: |
          echo "CACHE_RUN_STARTED=$(date +%s%3N)" >> "$GITHUB_ENV"
          pnpm turbo run typecheck build test $FILTERS --continue=dependencies-successful --summarize --cache-workers=4
        if: ${{ !cancelled() && steps.declarations.outcome == 'success' }}
        env:
          FILTERS: ${{ inputs.filters }}
          SUITES_JUNIT_DIR: ${{ runner.temp }}/test-reports/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.report-name }}
      # The job's verdict (quarantine.mjs says the whole rule). A failing test case is re-run alone, as `pnpm verify` does by
      # hand; one that passes then, or that is already quarantined, does not fail the job. Every failure of a typecheck or a
      # build, every test that fails again alone, and a failed graph with nothing readable in it fails it. Every run names
      # the quarantined tests as warnings and in the summary. Only main's pushes write the list in /ci-cache.
      - name: Judge failures and quarantine flaky tests
        if: ${{ !cancelled() && (steps.graph.outcome == 'success' || steps.graph.outcome == 'failure') }}
        env:
          GRAPH: ${{ steps.graph.outcome }}
          SUITES_JUNIT_DIR: ${{ runner.temp }}/test-reports/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.report-name }}
          QUARANTINE_FILE: /ci-cache/quarantine/tests.json
          QUARANTINE_RECORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: node _tools/scripts/verify/quarantine.mjs gate --graph "$GRAPH"
      - name: Audit sampled Turbo cache hits
        if: ${{ steps.graph.outcome == 'success' }}
        env:
          REPORT_NAME: ${{ inputs.report-name }}
        run: node _tools/scripts/verify/cache-audit.mjs .turbo/runs "${RUNNER_TEMP}/cache-reports/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${REPORT_NAME}/audit.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Report cache measurements
        if: ${{ !cancelled() && (steps.graph.outcome == 'success' || steps.graph.outcome == 'failure') }}
        env:
          REPORT_NAME: ${{ inputs.report-name }}
        run: node _tools/scripts/verify/cache-report.mjs .turbo/runs "${RUNNER_TEMP}/cache-reports/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${REPORT_NAME}/turbo.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep cache measurements
        continue-on-error: true
        if: ${{ always() }}
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: cache-report-${{ inputs.report-name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-reports/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.report-name }}
          if-no-files-found: ignore
          retention-days: '30'
      - name: Keep test results
        continue-on-error: true
        if: ${{ always() }}
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: test-results-${{ inputs.report-name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-reports/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.report-name }}
          if-no-files-found: ignore
          retention-days: '30'
