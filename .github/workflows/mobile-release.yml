# Mobile shells — the store releases. mobile.yml proves the shells build; this ships them.
#
# `workflow_dispatch` ONLY, and deliberately so twice over: a tag trigger is a trigger this repository can
# never fire (prepass invariant 10 — semantic-release pushes tags with GITHUB_TOKEN, which starts no
# workflows), and a store release is a human decision anyway — review timelines, phased rollouts and version
# naming belong to whoever presses the button, not to whatever landed on main last. The button asks for the
# marketing version; the BUILD number is this workflow's run number, so every upload is monotonic without
# anyone maintaining a counter.
#
# Where each artifact lands, and where it deliberately stops:
#   android  straight to the chosen Play track (internal by default). Promotion to production is either a
#            re-dispatch with track=production or a click in the Play Console.
#   ios      to App Store Connect, which lands it in TestFlight after Apple's automated processing.
#            Submitting to App Review stays a console action — the one step of an iOS release that has
#            questions (export compliance, review notes) no pipeline should answer on someone's behalf.
#
# Signing holds no local state to rot: Android signs with the uploaded keystore (Play App Signing holds the
# certificate that actually matters — assetlinks.json names ITS fingerprint, not this key's), and iOS uses
# xcodebuild cloud signing — the App Store Connect API key mints certificates and profiles on demand, so
# there is no .p12 to expire in a secret nobody remembers setting.
#
# The six secrets, all repository-level (README pointers: _editor/android-app, _editor/ios-app):
#   ANDROID_KEYSTORE_BASE64    the upload keystore, base64 — mint once: keytool -genkeypair -keystore
#                              android.keystore -alias android -keyalg RSA -keysize 4096 -validity 9125
#   ANDROID_KEYSTORE_PASSWORD  its store password        (BUBBLEWRAP_KEYSTORE_PASSWORD)
#   ANDROID_KEY_PASSWORD       its key password          (BUBBLEWRAP_KEY_PASSWORD)
#   PLAY_SERVICE_ACCOUNT_JSON  a Google Cloud service account with the Play "release manager" role, as JSON
#   ASC_API_KEY_P8             an App Store Connect API key (.p8 contents), role App Manager
#   ASC_KEY_ID / ASC_ISSUER_ID / APPLE_TEAM_ID   the key's id, its issuer id, and the developer team id
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store(s) to ship to
        type: choice
        options: [both, android, ios]
        default: both
      version:
        description: Marketing version (e.g. 1.2.0) — what users see in the store
        type: string
        required: true
      android_track:
        description: Play track for the Android upload
        type: choice
        options: [internal, beta, production]
        default: internal

# One release at a time; a second dispatch queues rather than racing the first's build numbers and uploads.
concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _editor/android-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Point Bubblewrap at the runner's toolchains
        working-directory: .
        run: bash _tools/scripts/mobile-android-sdk.sh
      - name: Restore the upload keystore
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > ./android.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # The manifest in git keeps placeholder numbers; the truth for a shipped build is stamped here — the
      # dispatched marketing version, and the run number as versionCode (Play refuses a repeat or a decrease).
      - name: Stamp the release version
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          jq --arg name "$VERSION" --argjson code "$BUILD_NUMBER" \
            '.appVersionName = $name | .appVersionCode = $code' twa-manifest.json > stamped.json
          mv stamped.json twa-manifest.json
      - name: Generate the Android project from the manifest
        run: npx @bubblewrap/cli@1.25.0 update --skipVersionUpgrade
      - name: Build and sign the bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx @bubblewrap/cli@1.25.0 build --skipPwaValidation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ inputs.version }}
          path: |
            _editor/android-app/app-release-bundle.aab
            _editor/android-app/app-release-signed.apk
          retention-days: 90
      - name: Upload to the Play ${{ inputs.android_track }} track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.intentic.app
          releaseFiles: _editor/android-app/app-release-bundle.aab
          track: ${{ inputs.android_track }}
          status: completed

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: _editor/ios-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository's one Node version, not whatever the macOS image happens to carry this month — a store
      # build has no business drifting with an image bump.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
      - name: Install shell dependencies
        run: npm install --no-audit --no-fund
      - name: Generate the iOS project from the config
        run: npx cap add ios
      - name: Finish the generated project (push wiring + entitlements)
        run: node scripts/prepare-native.mjs
      # The committed 1024px logo replaces the Capacitor placeholders — icons AND splash — across the asset
      # catalog. A store build wearing the template's own logo is a rejection, not a release.
      - name: Generate app icons and splash screens
        run: |
          npx @capacitor/assets@3.0.5 generate --ios --assetPath assets \
            --iconBackgroundColor '#141210' --iconBackgroundColorDark '#141210' \
            --splashBackgroundColor '#141210' --splashBackgroundColorDark '#141210'
      - name: Restore the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
      # Cloud signing end to end: automatic signing + the API key lets xcodebuild mint the distribution
      # certificate and profile itself, and register the push capability the entitlements file asks for —
      # no .p12, no profile secret, nothing that expires outside Apple's own console.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      # `destination: upload` makes xcodebuild itself hand the build to App Store Connect — the export step
      # IS the upload, with no separate transporter invocation to keep in step with it.
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>destination</key><string>upload</string>
              <key>signingStyle</key><string>automatic</string>
              <key>uploadSymbols</key><true/>
              <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
