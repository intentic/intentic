name: Release

on:
  workflow_call:

# A floor, not a ceiling — the caller's grant is the ceiling, and every job below replaces this set outright
# with the one it names. Declared read-only anyway so a job added later without a `permissions:` block starts
# with nothing rather than inheriting whatever the caller happened to hold.
permissions:
  contents: read
  packages: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  PNPM_STORE: /ci-cache/pnpm-store
  TURBO_CACHE_DIR: /ci-cache/turbo
  REGISTRIES: ghcr.io/intentic

jobs:
  # Plan while the caller holds the release lock. A no-release commit ends green here with the remaining jobs
  # skipped; a release names the version before any platform-specific artifact is built.
  plan:
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    # A job's `permissions` REPLACES the set it inherits, so every job whose container comes from ghcr has to
    # name `packages` itself — the token is what pulls the image, and without it the pull is denied before the
    # first step runs.
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          clean: false
      - uses: ./.github/actions/pnpm-setup
      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node _tools/scripts/release-plan.mjs >> "$GITHUB_OUTPUT"

  # The versioned candidate. This is the only build of the Windows installer in the release lifecycle; the
  # publish job downloads and stages it instead of asking cargo-xwin for a similar second file.
  windows-build:
    needs: plan
    if: ${{ needs.plan.outputs.version != '' }}
    runs-on: [self-hosted, intentic, desktop]
    container:
      image: ghcr.io/intentic/ci-desktop:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      CARGO_HOME: /ci-cache/cargo
      CARGO_TARGET_DIR: /ci-cache/desktop-release-windows-target
      XWIN_CACHE_DIR: /ci-cache/xwin
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Baked into the launcher UI at build time (desktop-app/vite.config.ts). Released installers only — a CI
      # or nightly build gets no key, so the artifacts nobody installs report nothing.
      POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/pnpm-setup
      # Match release-prepare's transient package state before the UI is compiled into the candidate.
      - run: bash _tools/scripts/set-versions.sh "${{ needs.plan.outputs.version }}"
      - run: bash _tools/scripts/build-desktop.sh "${{ needs.plan.outputs.version }}" --windows-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-candidate
          # The installer and its updater signature, both of which carry the version stamped above.
          path: _editor/desktop-app/dist-bin/Intentic-*-x64-setup.exe*
          if-no-files-found: error
          retention-days: 7

  # The sandbox image's arm64 half, built NATIVELY on GitHub's hosted arm runners (free for public repos)
  # while Windows verifies — the payload (`trees`) must be prepared on the arch it ships for, because pnpm
  # deploy fetches the HOST arch's native prebuilds (publish-images.sh says the rest). Versions are stamped
  # exactly as windows-build stamps them, so the two halves of the released manifest carry the same version;
  # the publish job's release-images.sh merges this `<version>-arm64` under the version + stable tags. Off
  # the self-hosted fleet, so no /ci-cache and no pnpm-setup action — the windows-verify pattern instead,
  # with pnpm's store cached by setup-node. An aborted release orphans at most one `<version>-arm64` tag.
  sandbox-arm64:
    needs: plan
    if: ${{ needs.plan.outputs.version != '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    # Off the fleet, so off the fleet's cache — for the reason ci.yml's images-arm64 spells out: turbo creates
    # the directory it is pointed at, and /ci-cache does not exist on a GitHub-hosted runner.
    env:
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same iq-models cache the images + publish jobs share — the models are arch-neutral bytes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .image-out/iq-models
            .image-out/.iq-models-complete
          key: iq-models-${{ hashFiles('_search/iq-engine/scripts/fetch-model.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: bash _tools/scripts/set-versions.sh "${{ needs.plan.outputs.version }}"
      - run: bash _tools/scripts/prepare-image-trees.sh
      - run: TAGS="${{ needs.plan.outputs.version }}" ARCH_SUFFIX=-arm64 IMAGES=sandbox bash _tools/scripts/publish-images.sh

  # The amd64 halves of the released images, on the fleet, while Windows verifies — the exact counterpart of
  # sandbox-arm64, and the ~11 minutes that used to run INSIDE the publish job's publishCmd, serialized after
  # everything was already verified. Version tags only, never `beta`: the moving tags are manifest-stitched by
  # release-images.sh in the publish job, after windows-verify has passed, so an aborted release orphans at
  # most version-tagged halves and no lane tag ever moves early.
  images-amd64:
    needs: plan
    if: ${{ needs.plan.outputs.version != '' }}
    runs-on: [self-hosted, intentic]
    container:
      # ci-base, same as ci.yml's `images` job: prepare-image-trees.sh compiles the payload job-side off the
      # warm /ci-cache stores, and the Dockerfiles are pure COPYs.
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/pnpm-setup
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same iq-models cache the ci.yml image jobs share — the models are arch-neutral bytes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .image-out/iq-models
            .image-out/.iq-models-complete
          key: iq-models-${{ hashFiles('_search/iq-engine/scripts/fetch-model.mjs') }}
      - run: bash _tools/scripts/set-versions.sh "${{ needs.plan.outputs.version }}"
      - run: bash _tools/scripts/prepare-image-trees.sh
      - run: TAGS="${{ needs.plan.outputs.version }}" ARCH_SUFFIX=-amd64 IMAGES=sandbox bash _tools/scripts/publish-images.sh
      - run: TAGS="${{ needs.plan.outputs.version }}" IMAGES=dind-host bash _tools/scripts/publish-images.sh

  # The release's Linux-side artifacts, while Windows verifies: the Linux desktop bundles — installed and
  # launched on a bare Debian HERE, before they are uploaded — and the cross-compiled machine agents. These
  # used to be built inside the publish job's prepareCmd, serialized behind windows-verify; building them in
  # parallel and shipping the bytes forward as an artifact is the windows-build pattern applied to everything
  # else the release attaches. publish stages these EXACT bytes, so what was install-verified is what ships.
  #
  # A hard `needs` edge of publish, which is what makes the install verification a gate that cannot be outrun
  # (the 2026-08-03 lesson, previously enforced by running it inside prepareCmd): a failure here means the
  # publish job never starts, so there is no tag, no Release, and no npm publish.
  linux-build:
    needs: plan
    if: ${{ needs.plan.outputs.version != '' }}
    runs-on: [self-hosted, intentic, desktop]
    container:
      image: ghcr.io/intentic/ci-desktop:latest
      volumes:
        - /ci-cache:/ci-cache
        # verify-desktop-install.sh runs the smoke container through the host daemon.
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      CARGO_HOME: /ci-cache/cargo
      # The same target dir the publish job used when it built these bundles itself, so the warm release-profile
      # cache carries straight over; still its own directory for the lock-and-fingerprint reasons ci.yml's
      # desktop jobs spell out.
      CARGO_TARGET_DIR: /ci-cache/desktop-target
      # For build-ic.sh's windows-x64 target (cargo-xwin) — the ~1.1 GB MSVC splat cache, shared.
      XWIN_CACHE_DIR: /ci-cache/xwin
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Baked into the launcher UI at build time — released installers only, same as windows-build.
      POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/pnpm-setup
      # Build BEFORE stamping (release-prepare.sh's old rule #1, now living here): versions sit only in
      # package.json, but package.json is a turbo hash input — stamping first invalidates the whole closure
      # and forces a rebuild of what verify-core just built. Building first replays verify's cache instead.
      - name: Build the published closure
        shell: bash
        run: |
          source _tools/scripts/packages.sh
          filters=()
          for d in "${PUB[@]}"; do filters+=("--filter=./$d"); done
          pnpm turbo run build "${filters[@]}"
      - run: bash _tools/scripts/set-versions.sh "${{ needs.plan.outputs.version }}"
      - run: bash _tools/scripts/build-agent-binaries.sh _sandbox/sync intentic-sync linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64
      # The connected-computer agent ships for exactly the platforms the capability offers cards for (Windows, Linux).
      - run: bash _tools/scripts/build-agent-binaries.sh _computers/host intentic-host linux-x64 linux-arm64 windows-x64
      # The ic host-side CLI ships for every platform a connect/recreate one-liner can land on: the .sh shims
      # cover Linux + macOS, the .ps1 shims Windows. All five come off the zig/xwin toolchains baked into this
      # image, with no Apple SDK anywhere in it (build-ic.sh header).
      - run: bash _tools/scripts/build-ic.sh linux-x64 linux-arm64 windows-x64 darwin-x64 darwin-arm64
      - run: bash _tools/scripts/build-desktop.sh "${{ needs.plan.outputs.version }}" --linux-only
      # …and prove those exact bytes install and run before anything ships them: installs the .deb and the
      # AppImage on a bare Debian, starts the app under Xvfb and fires a real xdg-open intentic:// at it.
      - run: bash _tools/scripts/verify-desktop-install.sh
      # Several paths, deliberately: an upload of several paths is rooted at their COMMON ANCESTOR — the repo
      # root here — so the artifact stores each dist-bin under its repo-relative path, and the publish job's
      # download reconstructs the exact tree publish-github.sh and the attestation read. (ci.yml's Windows
      # upload wants the opposite, a flat directory; that is why it stages first and this does not.)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-artifacts
          path: |
            _sandbox/sync/dist-bin
            _computers/host/dist-bin
            _sandbox/ic/dist-bin
            _editor/desktop-app/dist-bin
          if-no-files-found: error
          retention-days: 7

  # A real interactive Windows session installs the candidate, handles a cold and warm OS deep link, proves the
  # WebView loaded local content, and uninstalls while the tray process is still alive.
  windows-verify:
    needs: [plan, windows-build]
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: [self-hosted, windows-desktop]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-release-candidate
          path: windows-release-candidate
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm
      # Subtree only, for the reason ci.yml's desktop-verify-windows spells out: a whole-workspace install
      # compiles native packages this machine has no toolchain for.
      - run: pnpm install --frozen-lockfile --filter=@intentic/desktop-smoke-windows...
      - run: pnpm turbo run build --filter=@intentic/desktop-smoke-windows...
      # Reconcile before asserting, for the reason ci.yml's desktop-verify-windows spells out — and here it
      # matters more: a release that stalls for want of a hand-cleaned runner stalls the publish behind it.
      - run: node _tools/desktop-smoke-windows/dist/main.js teardown
      - run: node _tools/desktop-smoke-windows/dist/main.js doctor
      # By its exact versioned name, unlike ci.yml's glob: this job knows the version being released, so a
      # candidate built at any other one fails here rather than being verified and published as this release.
      - run: node _tools/desktop-smoke-windows/dist/main.js install --installer "windows-release-candidate/Intentic-$($env:RELEASE_VERSION)-x64-setup.exe" --expected-version $env:RELEASE_VERSION
      - run: node _tools/desktop-smoke-windows/dist/main.js teardown
        if: always()

  # semantic-release recomputes the plan as a safety check. release-prepare.sh refuses if it differs, then
  # ASSEMBLES rather than builds: every artifact arrives from the parallel jobs above, already verified —
  # the NSIS candidate Windows executed, the Linux bundles a bare Debian installed, the agents, the image
  # halves. What runs here is only what no earlier job could: the tag, the Release + uploads, the manifest
  # stitching (release-images.sh needs both halves, so sandbox-arm64 and images-amd64 both gate it — merging
  # without one would fail after the GitHub release already went out), and the attestations.
  publish:
    needs: [plan, windows-verify, sandbox-arm64, images-amd64, linux-build]
    if: ${{ needs.windows-verify.result == 'success' && needs.sandbox-arm64.result == 'success' && needs.images-amd64.result == 'success' && needs.linux-build.result == 'success' }}
    runs-on: [self-hosted, intentic, desktop]
    container:
      # Still ci-desktop rather than ci-base: the assemble step re-runs verify-desktop-bundle.sh over the
      # complete release set, and the 7z/rpm tooling that reads the installers back is baked into this image.
      image: ghcr.io/intentic/ci-desktop:latest
      volumes:
        - /ci-cache:/ci-cache
        - /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Was 120 when this job built installers and images itself; now it stages, uploads and stitches. The
    # uploads are the slow part and they have never neared this.
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      # Writes the build provenance for the assets and the images below. Without it the attest steps fail at
      # the upload rather than at a permissions check, which is a confusing way to learn this is missing.
      attestations: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Not for signing — that happened where the installers were built. The assemble step reads it as the
      # switch that says "this release is signed", requiring both .sig files and writing latest.json.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      PLANNED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      PREBUILT_WINDOWS_DESKTOP_DIR: ${{ github.workspace }}/windows-release-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          clean: false
      - uses: ./.github/actions/pnpm-setup
      # Empty the staging directories BEFORE the downloads land in them, because nothing else empties them any
      # more. `clean: false` keeps this runner's checkout between jobs (docs/ci-runner.md — it is what keeps
      # node_modules warm), so these directories still hold whatever the last desktop job on this runner put
      # there: ci.yml's desktop-verify builds a complete set of `0.0.0` Linux bundles on this same label, and
      # they sit here until something deletes them. While this job BUILT the release set, build-desktop.sh's
      # `rm -rf "$OUT"` was that something; assembling stages already-verified bytes into the directory
      # instead, so it must not — and the leftovers became this job's problem.
      #
      # They are not cosmetic. publish-github.sh attaches `dist-bin/*` by glob and the attestation signs the
      # same four directories, so a stale bundle would be published as part of this release, over the name of
      # a version it is not; and the assemble step refuses to guess between two artifacts of one kind, which
      # is what failed run 31697229807 (`2 'deb' artifacts … expected one`).
      - name: Clear the staging directories
        shell: bash
        run: |
          rm -rf windows-release-candidate \
            _editor/desktop-app/dist-bin _sandbox/sync/dist-bin _computers/host/dist-bin _sandbox/ic/dist-bin
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-release-candidate
          path: windows-release-candidate
      # Into the workspace root: the artifact stores each dist-bin under its repo-relative path (see the
      # upload in linux-build), so this reconstructs the tree exactly where release-prepare.sh,
      # publish-github.sh and the attestation expect it.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-release-artifacts
          path: ${{ github.workspace }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec semantic-release

      # --- provenance -------------------------------------------------------------------------------------
      # Everything below binds what we just published to the commit it was built from, in a public
      # transparency log. It is the only claim on this project that does not ask anyone to trust us: the
      # installer someone downloads either matches this repository at this commit or it does not, and
      # `gh attestation verify` answers that on their machine, offline, without our involvement.
      #
      # AFTER semantic-release, not before — the assets do not exist until it has run. A failure here turns
      # the release red with everything already published, which is the correct order of the two bad
      # outcomes: an attested release that reports failure can be re-attested, an unattested release that
      # reports success is a promise the README makes and the pipeline does not keep. Same reasoning as
      # npm-publish.yml's refusal to fall back when the provenance exchange fails.
      - name: Attest the release assets
        id: attest-assets
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          # The same four directories publish-github.sh attaches to the Release: the desktop installers and
          # the cross-compiled machine-agent binaries behind the two `curl ... | sh` one-liners. Those
          # one-liners are the single most trust-hungry thing this project asks anyone to run.
          subject-path: |
            _sandbox/sync/dist-bin/*
            _computers/host/dist-bin/*
            _sandbox/ic/dist-bin/*
            _editor/desktop-app/dist-bin/*

      # A copy of that same bundle, attached to the Release next to the installers it vouches for. The script
      # says why a second copy is worth having; it never fails the job.
      - name: Attach the provenance to the Release
        shell: bash
        run: bash _tools/scripts/attach-provenance.sh "${PLANNED_RELEASE_VERSION}" "${{ steps.attest-assets.outputs.bundle-path }}"

      # The images are named by digest rather than by tag because a tag is a pointer and provenance about a
      # pointer proves nothing — `stable` moves on the next release. imagetools reads the digest the merge
      # just published.
      - name: Resolve the published image digests
        id: digests
        shell: bash
        run: |
          version="${{ needs.plan.outputs.version }}"
          for image in sandbox dind-host; do
            digest="$(docker buildx imagetools inspect "ghcr.io/intentic/$image:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "==> ghcr.io/intentic/$image@$digest"
            echo "${image//-/_}=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Attest the sandbox image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/intentic/sandbox
          subject-digest: ${{ steps.digests.outputs.sandbox }}
          # Pushed to GHCR as an OCI referrer as well as to GitHub's own store, so the attestation travels
          # with the image: someone who pulls it can verify without knowing which repository built it.
          push-to-registry: true

      - name: Attest the dind-host image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/intentic/dind-host
          subject-digest: ${{ steps.digests.outputs.dind_host }}
          push-to-registry: true
