# Dispatch the release tag and stamp package versions before building the Chrome extension; GITHUB_TOKEN tag pushes cannot trigger it.
# Only tag-stamped versions enter this path: the store requires monotonic versions, while local 0.0.0 maps to a development sentinel.
# Missing CHROME_WEBSTORE_* settings warn and skip until listing/OAuth setup is complete; see _devices/webext/PUBLISHING.md.
# No npm provenance requirement applies here, so publish on the cached fleet runner.
name: webstore publish

# Run it by hand from a tag the same way the release job does: Actions ▸ webstore publish ▸ Run workflow, with
# the tag selected as the ref. V2 preserves the listing's dashboard visibility; it cannot widen the audience.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: webstore-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PNPM_STORE: /ci-cache/pnpm-store
      TURBO_CACHE_DIR: /ci-cache/turbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - uses: ./.github/actions/pnpm-setup

      # Before the build, so the manifest the packer seals carries the released version.
      - name: Stamp the release version
        run: bash _tools/scripts/release/set-versions.sh "${GITHUB_REF_NAME#v}"

      # `--filter` pulls the dependency closure through turbo's ^build edge: the extension inlines the
      # contract's and the browser vocabulary's dist.
      - name: Build the extension
        run: pnpm turbo run build --filter=./_devices/webext

      # dist/ as one zip, written by node rather than by `zip`, which ci-base does not have (scripts/pack.mjs).
      - name: Pack it
        run: pnpm --filter @intentic/webext run package

      - name: Upload and submit
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_ITEM_ID: ${{ vars.CHROME_WEBSTORE_ITEM_ID }}
        run: node _tools/scripts/release/publish-webstore.mjs "${GITHUB_REF_NAME#v}"
