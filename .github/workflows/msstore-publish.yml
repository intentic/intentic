# Dispatch at the release tag; GITHUB_TOKEN tag pushes cannot trigger workflows. Submit the already-tested installer URL without rebuilding.
# Missing MSSTORE_* settings warn and skip until Partner Center setup is complete; see docs/ops/microsoft-store.md.
# An in-flight certification defers submission with a warning; retry this tag manually or let the next release submit when idle.
name: msstore publish

# Run it by hand from a tag the same way the release job does: Actions ▸ msstore publish ▸ Run workflow, with the
# tag selected as the ref. A ref that is not a release tag fails fast: the Store submits a release, not a branch.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One submission at a time, matching the Store's own rule; a second dispatch queues rather than racing the first
# onto a draft it is already updating.
concurrency:
  group: msstore-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The Store scans the installer it fetches from the release before a submission may be created, and the
    # script waits up to 20 minutes for that.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Submit the installer
        env:
          # The Entra ID application associated with the Partner Center account.
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          # Identifiers off the dashboard, not credentials.
          MSSTORE_SELLER_ID: ${{ vars.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
          # Reads the Release: its installer asset, its checksums, and the notes that become "what's new".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node _tools/scripts/release/publish-msstore.mjs "${GITHUB_REF_NAME#v}"
