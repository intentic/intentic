# Publish the VSCode extension to the Visual Studio Marketplace and Open VSX, from the tag semantic-release
# pushes — the same trigger and shape as npm-publish.yml, for the same reason: a pushed `v*` tag is a
# complete, version-stamped tree, so there is nothing to bump and nothing to check out beyond the tag itself.
#
# The build assembles the whole product the extension hosts: the web app the panels load, and the daemon
# deployed as the extension's engine tree — then smoke-boots that engine in its local profile before packing,
# so a .vsix that would not start can never reach a marketplace (build-vscode-extension.sh).
#
# Inert until the tokens exist (publish-vscode.sh skips each marketplace loudly without its secret, so the
# release train never fails over an optional artifact):
#   VSCE_PAT — Azure DevOps PAT, Marketplace ▸ Manage scope, for the `intentic` publisher. Creating that
#              publisher on marketplace.visualstudio.com is a one-time manual step.
#   OVSX_PAT — open-vsx.org access token; the `intentic` namespace must be claimed once, manually.
name: vscode publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: read

concurrency:
  group: vscode-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, intentic]
    container:
      image: ghcr.io/intentic/ci-base:latest
      volumes:
        - /ci-cache:/ci-cache
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PNPM_STORE: /ci-cache/pnpm-store
      TURBO_CACHE_DIR: /ci-cache/turbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - uses: ./.github/actions/pnpm-setup

      - name: Build, smoke-boot and publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bash _tools/scripts/publish-vscode.sh "${GITHUB_REF_NAME#v}"

      # The staged .vsix files ride the run either way — with no tokens this workflow is a build check whose
      # artifact a maintainer can install by hand (code --install-extension intentic-linux-x64-<v>.vsix).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-extension
          path: _editor/vscode/dist-bin/*.vsix
          if-no-files-found: error
