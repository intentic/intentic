# The install every job opens with.
#
# pnpm is baked into ci-base as a native binary. No step here covers a version DRIFT between the image and
# package.json's `packageManager`, because pnpm 12 covers it itself: `pmOnFail` defaults to `download`, so a
# pin the image is behind is fetched by the pnpm in the image, on the spot. The corepack step that used to sit
# at the top of this file — a half-written-cache sweep and a node-gyp exec-bit repair, both corepack-specific —
# went with corepack.
name: pnpm setup
description: Install the workspace against the shared pnpm store and prune the turbo cache.

runs:
  using: composite
  steps:
    - name: Drop a stray Playwright browser cache
      shell: bash
      run: |
        # A BROWSER UNDER $HOME IS ALWAYS A TRAP HERE, because ci-base ships none of Chromium's shared
        # libraries — a binary that exists and cannot start is strictly worse than no binary at all. The
        # sandbox's browser suites gate on `existsSync(chromium.executablePath())` and stand down where the
        # image has no Chromium; a leftover download turns that gate into a false positive and the launch then
        # dies on `libglib-2.0.so.0: cannot open shared object file`, reporting a browser bug that is really a
        # poisoned cache.
        #
        # It got poisoned the way any cache under $HOME does here: $HOME is /github/home, which the runner
        # process keeps between jobs, so `images-platform` installing a browser for the sign-in smoke handed one
        # to every job that landed on that runner afterwards. That job now installs into
        # PLAYWRIGHT_BROWSERS_PATH; this line is what clears the strays already on the fleet, which nobody is
        # otherwise going to remove by hand.
        rm -rf "$HOME/.cache/ms-playwright"

    - name: Drop the directories a rename left behind
      shell: bash
      run: |
        # THE WORKSPACE OUTLIVES THE COMMIT. Every job on the fleet checks out with `clean: false`, so a
        # rename leaves its OLD directory standing: the moved package's node_modules and dist are untracked,
        # `git clean -ffdx` keeps both by name at any depth (prepare-workspace's allowlist), and no git
        # operation will ever remove the directory around them. It is then a ghost — zero tracked files, still
        # in every `ls`, still guessed at — which is exactly what the layout check's first rule fails on.
        #
        # AND NO COMMIT COULD FIX IT. The check ran green on a fresh clone and red on the fleet, naming
        # directories that do not exist in git; `pnpm prepass` runs it in preflight, in verify-core and in
        # verify-platform, so one stale runner reddened three jobs at once and a re-run reproduced it exactly
        # (run 34046947138). The prune belongs HERE, beside the Playwright and pnpm-state cleanups
        # above, for the same reason they are here: it is the persistent workspace being repaired, so it has to
        # happen in the step every job on that workspace shares rather than in whichever job noticed last.
        #
        # --prune deletes exactly the directories the check would have named, and nothing else: a ghost whose
        # remaining content is a live mount is left alone (that is an agent worktree, not a runner).
        node _tools/checks/layout.mjs --prune

    - name: Drop stale pruned deploy trees
      shell: bash
      run: |
        # A `deploy/` DIRECTORY IN THE CHECKOUT IS ALWAYS LEFTOVER. docker-release.sh --prune used to run
        # `pnpm deploy --prod ./deploy` inside the api, and the copy (gitignored by `**/deploy`) outlived the job
        # that made it. The next job on that runner ran the api's tests, discovered the copy's test files, and
        # verify-platform failed on dozens of `Cannot find module` in code nobody had changed (run 36239755823),
        # which skipped images-platform and held the platform deploy. The script now prunes into a temporary
        # directory outside the checkout, and `suites` never discovers under `deploy/`, but neither removes the
        # trees already sitting on the fleet. prepare-workspace's `git clean -ffdx` would (its allowlist does not
        # keep `deploy`), yet most jobs never run it, so the repair lives here, in the step every job shares.
        #
        # Only UNTRACKED, IGNORED directories named exactly `deploy` go, at any depth (`_deploy` is another
        # name). `--directory` names a wholly ignored directory once and does not descend into it, so nothing
        # inside node_modules is ever listed, let alone removed.
        git ls-files -z --others --ignored --exclude-standard --directory |
          while IFS= read -r -d '' dir; do
            case "/$dir" in
              */deploy/) echo "removing stale $dir"; rm -rf -- "$dir" ;;
            esac
          done

    - name: Install
      shell: bash
      run: |
        # DROP PNPM'S "nothing changed" SHORTCUT FIRST, because on these runners it is wrong in a way that
        # cannot be recovered from. The workspace is `injectWorkspacePackages: true`, so an in-repo package is
        # not symlinked into its consumers — it is COPIED (hard-linked) into the virtual store at install time.
        # A checkout REPLACES a changed file rather than writing through it, so the store copy keeps the old
        # inode and the old contents, and pnpm re-syncs an injected package only after that package's own
        # `build` script (syncInjectedDepsAfterScripts) — which the 16 extensions consumed as SOURCE do not
        # have. Their copies were therefore frozen at whatever the runner installed first.
        #
        # And this state file is what stopped the install from noticing: with the lockfile and every manifest
        # unchanged it answers "Already up to date" in 0.3s without looking at a single file, so the copies
        # could never be repaired by running the install again — not even with --force, which was measured
        # taking the same shortcut. Main deadlocked on exactly that: `cmp` was renamed to `ui` across the ui
        # kit and its call sites in one commit, every runner kept typechecking web against a copy of the
        # preview extension that still said `cmp`, typecheck failed before `build` could run, and the build was
        # the only thing that would have re-synced anything. Two pipelines died on source that was correct in
        # git, and no re-run could have gone green.
        #
        # Removing the file costs the install its shortcut — ~5s of real work against 0.3s of assertion — and
        # is what makes a fresh checkout produce a node_modules that matches it. The persistent workspace
        # (`clean: false`, which is worth minutes elsewhere) is precisely why this cannot be left to chance.
        rm -f node_modules/.pnpm-workspace-state-v1.json
        pnpm install --frozen-lockfile --store-dir "$PNPM_STORE"

    # Bound the shared turbo cache: drop entries untouched for 14 days (rebuilt + re-cached if needed). The
    # directory outlives the job, so nothing else evicts from it — this line is load-bearing, not hygiene.
    - name: Prune the turbo cache
      shell: bash
      run: find "$TURBO_CACHE_DIR" -type f -mtime +14 -delete 2>/dev/null || true
