# The install every job opens with.
#
# pnpm is baked into ci-base as a native binary. No step here covers a version DRIFT between the image and
# package.json's `packageManager`, because pnpm 12 covers it itself: `pmOnFail` defaults to `download`, so a
# pin the image is behind is fetched by the pnpm in the image, on the spot. The corepack step that used to sit
# at the top of this file — a half-written-cache sweep and a node-gyp exec-bit repair, both corepack-specific —
# went with corepack.
name: pnpm setup
description: Install the workspace against the shared pnpm store and prune the turbo cache.

inputs:
  # WHAT A STALE LOCKFILE DOES TO THIS JOB. `fail` (the default, and what every job that builds something to publish
  # keeps) stops at the frozen install, as it always has. `measure` is for the jobs that only measure the tree: a
  # lockfile that no longer matches the manifests used to fail every one of their installs, so one stale line hid
  # every type error and broken test in the pipeline until the next push. With `measure` the install retries without
  # the frozen lockfile, the job measures the tree as the manifests describe it, and pnpm-lock.yaml goes back to the
  # commit's bytes afterwards, so every later reader (the push check's lockfile check, turbo's hash) still sees the
  # drift. Preflight's `lockfile` check fails the run on it, and nothing that publishes runs without preflight.
  lockfile-drift:
    description: "`fail` stops on a pnpm-lock.yaml that no longer matches the manifests; `measure` installs without it and keeps going."
    required: false
    default: fail

runs:
  using: composite
  steps:
    - name: Drop a stray Playwright browser cache
      shell: bash
      run: |
        # A BROWSER UNDER $HOME IS ALWAYS A TRAP HERE, because ci-base ships none of Chromium's shared
        # libraries — a binary that exists and cannot start is strictly worse than no binary at all. The
        # sandbox's browser suites gate on `existsSync(chromium.executablePath())` and stand down where the
        # image has no Chromium; a leftover download turns that gate into a false positive and the launch then
        # dies on `libglib-2.0.so.0: cannot open shared object file`, reporting a browser bug that is really a
        # poisoned cache.
        #
        # It got poisoned the way any cache under $HOME does here: $HOME is /github/home, which the runner
        # process keeps between jobs, so `images-platform` installing a browser for the sign-in smoke handed one
        # to every job that landed on that runner afterwards. That job now installs into
        # PLAYWRIGHT_BROWSERS_PATH; this line is what clears the strays already on the fleet, which nobody is
        # otherwise going to remove by hand.
        rm -rf "$HOME/.cache/ms-playwright"

    - name: Drop the directories a rename left behind
      shell: bash
      run: |
        # Prune ghost package directories left by renames on retained checkouts; preserved node_modules/dist can keep untracked shells alive.
        # A fresh clone cannot expose this runner-only state, and rerunning the same checkout cannot repair it.
        # --prune removes exactly the layout check's ghosts; live mounts belong to agent worktrees and must remain.
        node _tools/checks/layout.mjs --prune

    - name: Drop stale pruned deploy trees
      shell: bash
      run: |
        # A `deploy/` DIRECTORY IN THE CHECKOUT IS ALWAYS LEFTOVER. docker-release.sh --prune used to run
        # `pnpm deploy --prod ./deploy` inside the api, and the copy (gitignored by `**/deploy`) outlived the job
        # that made it. The next job on that runner ran the api's tests, discovered the copy's test files, and
        # verify-platform failed on dozens of `Cannot find module` in code nobody had changed (run 36239755823),
        # which skipped images-platform and held the platform deploy. The script now prunes into a temporary
        # directory outside the checkout, and `suites` never discovers under `deploy/`, but neither removes the
        # trees already sitting on the fleet. prepare-workspace's `git clean -ffdx` would (its allowlist does not
        # keep `deploy`), yet most jobs never run it, so the repair lives here, in the step every job shares.
        #
        # Only UNTRACKED, IGNORED directories named exactly `deploy` go, at any depth (`_deploy` is another
        # name). `--directory` names a wholly ignored directory once and does not descend into it, so nothing
        # inside node_modules is ever listed, let alone removed.
        git ls-files -z --others --ignored --exclude-standard --directory |
          while IFS= read -r -d '' dir; do
            case "/$dir" in
              */deploy/) echo "removing stale $dir"; rm -rf -- "$dir" ;;
            esac
          done

    - name: Install
      shell: bash
      env:
        LOCKFILE_DRIFT: ${{ inputs.lockfile-drift }}
      run: |
        # Bun's fallback installer renames its temporary download into node_modules. runner.temp is a
        # separate Actions mount, so put install scratch space on the destination filesystem (EXDEV otherwise).
        # bun's install.js picks RUNNER_TEMP before os.tmpdir(), so TMPDIR alone left it on /__w/_temp
        # (run 41209017574): both have to point here. The override lives only in this step's shell.
        mkdir -p node_modules
        install_tmp="$(mktemp -d "$PWD/node_modules/.install-tmp.XXXXXX")"
        trap 'rm -rf -- "$install_tmp"' EXIT
        export TMPDIR="$install_tmp" RUNNER_TEMP="$install_tmp"
        # Remove pnpm's state shortcut so injected workspace copies are refreshed after checkout replaces source inodes.
        # Source-consumed packages have no build script to resync them; unchanged manifests/lockfile otherwise leave stale code in the store.
        # Even --force can take that shortcut. Persistent node_modules needs this invalidation before every install.
        rm -f node_modules/.pnpm-workspace-state-v1.json
        # The frozen install's own words decide the fallback, not its exit code: only a lockfile that disagrees with
        # the manifests (pnpm's OUTDATED_LOCKFILE and its two kin) is drift. A registry that drops the connection is
        # not, and would only fail again a second time slower.
        log="$(mktemp)"
        if pnpm install --frozen-lockfile --store-dir "$PNPM_STORE" 2>&1 | tee "$log"; then
          exit 0
        fi
        if [ "$LOCKFILE_DRIFT" = measure ] && grep -qE 'ERR_PNPM_(OUTDATED_LOCKFILE|FROZEN_LOCKFILE_WITH_OUTDATED_LOCKFILE|LOCKFILE_CONFIG_MISMATCH)' "$log"; then
          echo "::warning title=pnpm-lock.yaml is stale::It no longer matches the manifests. Installed without it so this job still measures the tree; preflight's lockfile check fails the run, and nothing publishes."
          pnpm install --no-frozen-lockfile --store-dir "$PNPM_STORE"
          git checkout -- pnpm-lock.yaml
          exit 0
        fi
        exit 1

    - name: Configure Debian package downloads
      shell: bash
      run: |
        # Browser jobs install system libraries after setup. Use TLS and retry transient mirror failures;
        # a warm pnpm store does not make those downloads warm too.
        if [ -f /etc/apt/sources.list.d/debian.sources ]; then
          sed -i 's|http://deb.debian.org/|https://deb.debian.org/|g' /etc/apt/sources.list.d/debian.sources
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' > /etc/apt/apt.conf.d/80-intentic-downloads
        fi

    # Bound the shared turbo cache: drop entries untouched for 14 days (rebuilt + re-cached if needed). The
    # directory outlives the job, so nothing else evicts from it — this line is load-bearing, not hygiene.
    - name: Prune the turbo cache
      shell: bash
      run: find "$TURBO_CACHE_DIR" -type f -mtime +14 -delete 2>/dev/null || true
