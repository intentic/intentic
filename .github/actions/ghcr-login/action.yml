# Retry GHCR login only for timeout/5xx responses; credential rejection and other failures must fail immediately.
# docker/login-action's single login attempt does not cover these transient registry faults.
# Pass credentials/actor through env and printenv, never workflow-expression substitution into shell code.
name: ghcr login
description: Log in to ghcr.io, retrying the timeouts that a slow registry answers a correct credential with.

inputs:
  username:
    description: Registry user. The workflow passes github.actor.
    required: true
  password:
    description: Registry token. The workflow passes secrets.GITHUB_TOKEN.
    required: true
  docker-host:
    description: DOCKER_HOST for the login, when the job runs its own daemon. Empty means the default socket.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Log in to ghcr.io
      shell: bash
      env:
        GHCR_USER: ${{ inputs.username }}
        GHCR_TOKEN: ${{ inputs.password }}
        GHCR_DOCKER_HOST: ${{ inputs.docker-host }}
      run: |
        set -uo pipefail
        if [ -n "$GHCR_DOCKER_HOST" ]; then
          export DOCKER_HOST="$GHCR_DOCKER_HOST"
        fi
        # 2s, 4s, 8s, 16s between five attempts: ~30s of waiting against a registry hiccup that has been
        # measured in seconds, and well inside the shortest timeout-minutes on the fleet.
        delay=2
        for attempt in 1 2 3 4 5; do
          if output=$(printenv GHCR_TOKEN | docker login ghcr.io --username "$GHCR_USER" --password-stdin 2>&1); then
            echo "$output"
            exit 0
          fi
          echo "$output" >&2
          # Anything the registry ANSWERED with is final — only an unreachable registry is worth another go.
          if ! grep -qiE 'deadline exceeded|timeout|timed out|temporary failure|connection reset|connection refused|EOF|no such host|500 Internal|502 Bad Gateway|503 Service|504 Gateway' <<<"$output"; then
            echo "ghcr.io refused the credential — not a timeout, so not retrying." >&2
            exit 1
          fi
          if [ "$attempt" -eq 5 ]; then
            echo "ghcr.io unreachable after 5 attempts." >&2
            exit 1
          fi
          echo "attempt $attempt could not reach ghcr.io — retrying in ${delay}s" >&2
          sleep "$delay"
          delay=$((delay * 2))
        done
