# Retry CreateArtifact failures that actions/upload-artifact's block-upload retries do not cover.
# Use overwrite:true after the first attempt so a lost response cannot leave a colliding artifact name.
# Real failures (including missing files) retry too, then fail; the action does not expose enough detail to classify them externally.
# Pass names through env/printenv, never interpolate workflow expressions into shell code.
name: upload artifact
description: Upload a build artifact, retrying the connection failures that leave a finished build unpublished.

inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: Paths to upload, one per line. Passed to actions/upload-artifact unchanged.
    required: true
  if-no-files-found:
    description: warn | error | ignore, as the upstream action means it.
    required: false
    default: warn
  retention-days:
    description: Days to keep the artifact. Empty means the repository default.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - id: first
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}

    # 15s, then 45s: the refused connection above took 22 seconds of the action's own attempts to report, so a
    # delay shorter than that is another go at the same bad minute.
    - if: steps.first.outcome == 'failure'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        echo "::warning::uploading $(printenv ARTIFACT_NAME) failed — retrying in 15s (attempt 2 of 3)"
        sleep 15
    - id: second
      if: steps.first.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        echo "::warning::uploading $(printenv ARTIFACT_NAME) failed again — retrying in 45s (attempt 3 of 3)"
        sleep 45
    # No `continue-on-error` on the last attempt: this is the step that fails the job.
    - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
