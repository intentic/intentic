# What survives between jobs on a persistent workspace — said once, as an ALLOWLIST.
#
# THE PROBLEM THIS EXISTS FOR. Every job on the fleet checks out with `clean: false`, which is worth minutes:
# a clean checkout deletes the 69k-file install and the next install re-links it from nothing. The cost is
# that the workspace becomes a mutable object six runner processes share across every workflow, and whatever
# a job leaves behind is what the next job on that runner starts with. That has now bitten three times, and
# each time it was patched exactly where it hurt:
#
#   1. node_modules/.pnpm-workspace-state-v1.json froze the injected workspace copies, and main deadlocked on
#      source that was correct in git. Patched with an `rm -f` inside the pnpm-setup composite.
#   2. release.yml's publish job found `0.0.0` desktop bundles left by ci.yml's desktop-verify sitting in the
#      staging directories it now only assembles into, and refused with "2 'deb' artifacts … expected one"
#      (run 31697229807). Patched with a bespoke "Clear the staging directories" step.
#   3. desktop-windows-build's `windows-artifacts/` survived a run whose build failed after staging. Patched
#      with an `rm -rf` inside the staging step.
#
# Three incidents, three unrelated patches, no shared rule — so the fourth was only a matter of which
# directory someone staged into next. This is the rule: **the caches survive, everything else is rebuilt.**
#
# WHAT IT ACTUALLY DOES is what `clean: false` was always approximating. verify.yml's checkout comment calls
# that flag "the Actions equivalent of GIT_CLEAN_FLAGS: -ffdx -e node_modules" — but `clean: false` is not
# that, it is the absence of any clean at all. This step is the real thing: a full `-ffdx` with the kept set
# named, so a new build output is safe by default instead of dangerous by default.
#
# IT DOES NOT COVER INCIDENT 1, and that is worth saying rather than implying. That one is stale content
# INSIDE node_modules, which this deliberately keeps; only the pnpm-setup composite's state-file removal can
# reach it. Two of the three, one rule.
#
# RUNS AFTER CHECKOUT, never before: a composite action is read out of the workspace, so it cannot be the
# thing that repairs a workspace it has not been checked out into yet. (The `ci-base` and `ci-desktop` jobs'
# ownership reclaim has the same constraint and is inline for that reason.)
name: prepare workspace
description: Remove everything the previous job on this runner left behind, except the caches worth keeping.

runs:
    using: composite
    steps:
        - shell: bash
          run: |
              set -euo pipefail
              # THE ALLOWLIST. Each entry is here because rebuilding it is expensive and reusing it is safe;
              # anything not named is removed, including build outputs that do not exist yet.
              #
              #   node_modules      the 69k-file install this whole arrangement exists to keep
              #   .turbo            turbo's local run metadata
              #   .cache            assorted per-package caches (the e2e whisper model among them)
              #   .image-out        the sandbox payload tree, holding the ~57 MB of iq models
              #   dist              turbo's compiled task outputs — replayable from /ci-cache, but not free
              #   generated         prisma's client, regenerated by the prepass when absent
              #   .astro            the site's incremental build state
              #   *.tsbuildinfo     tsgo's incremental state, which is the difference between a 1s and a 40s
              #                     prepass
              #
              # `dist-bin` is deliberately NOT here, and it is the whole point: that is where the desktop
              # bundles, the machine agents and the ic binaries are staged, and a stale one is incidents 2
              # and 3. `-e dist` excludes a directory named exactly `dist`; `dist-bin` is a different name and
              # is removed.
              git clean -ffdx \
                -e node_modules \
                -e .turbo \
                -e .cache \
                -e .image-out \
                -e dist \
                -e generated \
                -e .astro \
                -e '*.tsbuildinfo'
