# After checkout, clean persistent workspaces with an explicit cache allowlist; clean:false alone retains stale/untracked build artifacts.
# Preserve dependency caches and rebuild everything else so previous jobs' staging files cannot reach a release.
# Stale injected content inside node_modules is separate: pnpm-setup removes its state file while this step preserves the install.
name: prepare workspace
description: Remove everything the previous job on this runner left behind, except the caches worth keeping.

runs:
    using: composite
    steps:
        - shell: bash
          run: |
              set -euo pipefail
              # Preserve expensive caches/replayable dist outputs; remove everything outside this explicit allowlist.
              # dist-bin must stay excluded: it holds release staging, and stale bundles/binaries must never join a later release.
              # -e dist matches that exact directory name, so it does not retain dist-bin.
              git clean -ffdx \
                -e node_modules \
                -e .turbo \
                -e .cache \
                -e .image-out \
                -e dist \
                -e generated \
                -e .astro \
                -e '*.tsbuildinfo'
