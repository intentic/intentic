# zizmor's view of this repository's deliberate exceptions.
#
# THIS FILE IS THE GATE'S CREDIBILITY. zizmor started at 186 findings here. Most were fixed — every
# High-confidence template injection, and 31 of the 33 checkouts that persisted their token — which is what
# lets lint-workflows.sh run it with NO confidence floor at all. What is left below is four decisions somebody
# made on purpose. Left unsuppressed they are noise, and a noisy lint is one people stop reading and then
# delete — which is how the checks that would have caught the three unfireable publish triggers were never
# there in the first place. Suppressed WITHOUT a reason it is worse: a silent allowlist that grows.
#
# So each entry below names the trade and says what would have to change for it to go away. A new entry that
# cannot write those two things is a finding to fix, not to add here.
rules:
    # `ghcr.io/intentic/ci-base:latest` and `ci-desktop:latest`, in 25 `container:` blocks.
    #
    # THE PIPELINE BUILDS AND MOVES THESE TAGS ITSELF. ci.yml's `ci-base` job rebuilds the image and pushes
    # `latest` when _tools/ci-base changes, and every other job in every workflow pulls that tag on its next
    # run — that is the whole mechanism by which a toolchain change reaches the fleet. A digest here would have
    # to be rewritten by the job that just built the image, in a commit, before any job could use it: a
    # two-commit dance on every base-image change, for a tag that only this repository can move and that the
    # `missing()` probe in `changes` already checks the existence of.
    #
    # What this costs: a job pulls whatever `latest` points at when it starts, so a base-image change that
    # lands mid-pipeline can be picked up by later jobs of an earlier commit. ci.yml's ci-desktop comment
    # covers the version of this that actually bit (a ci-base that built but did not push).
    #
    # DELETE THIS SUPPRESSION IF: the CI images ever move to being built somewhere else, or get published by
    # digest with a bot that opens the bump as a reviewable pull request. Then the pin is free and worth having.
    unpinned-images:
        ignore:
            - action-publish.yml
            - ci.yml
            - nightly.yml
            - release.yml
            - rollback.yml
            - verify.yml

    # `secrets: inherit` on ci.yml's three verify calls and its release call.
    #
    # The callees are `./.github/workflows/verify.yml` and `./.github/workflows/release.yml` — IN THIS
    # REPOSITORY, on the same commit, reviewed in the same diff, and reachable only from a branch pushed here
    # (the fork boundary, docs/ci-runner.md). zizmor's concern is a called workflow it cannot see; there is no
    # such workflow here. Enumerating each secret per call would move the same set across the same boundary,
    # while adding a list that goes stale the first time a job needs one more.
    #
    # DELETE THIS SUPPRESSION IF: a call ever targets a workflow outside this repository. Then the secrets have
    # to be named one by one, because the callee stops being something this repository's review covers.
    secrets-inherit:
        ignore:
            - ci.yml

    # `npm install -g npm@latest` in npm-publish.yml.
    #
    # OIDC trusted publishing landed in npm 11.5.1 and Node 24 ships an older 11.x, so the job's own npm cannot
    # perform the tokenless exchange the whole workflow is built around. The file says this at length. It is an
    # unpinned fetch, which is a real remark and not a false positive — it is accepted because the alternative
    # is a floor version pinned here that has to be bumped by hand to stay above whatever npm requires next.
    #
    # DELETE THIS SUPPRESSION IF: the pinned Node ships an npm new enough on its own — then the step goes away
    # entirely rather than being suppressed.
    adhoc-packages:
        ignore:
            - npm-publish.yml

    # The two checkouts that keep their credential, named by line so a THIRD one fails the lint.
    #
    # Every other checkout in this repository now sets `persist-credentials: false`: the token checkout writes
    # into .git/config outlives the job on a workspace six runner processes share, and nothing else here
    # pushes (docs/ci-runner.md, "The token a checkout leaves behind"). These two run semantic-release, which
    # reaches the git remote — it builds its own authenticated URL from GITHUB_TOKEN and probably does not need
    # the persisted header, but "probably" is not worth finding out by breaking a release.
    #
    # LINE-SCOPED ON PURPOSE, not file-scoped: a file-wide ignore would silently cover the next checkout added
    # to release.yml, which is exactly the erosion that made this a 34-finding backlog in the first place. The
    # line numbers going stale is the point — a moved exception has to be re-read and re-approved.
    #
    # DELETE THIS SUPPRESSION IF: someone confirms against a real release that semantic-release pushes fine
    # without the persisted header. Then both jobs join the other thirty-one and this block goes.
    artipacked:
        ignore:
            - release.yml:61
            # Was 349, then 358, now 385 — `publish`'s checkout keeps sliding down as steps and `env:` land
            # above it, most recently the twenty-seven lines of Windows Authenticode signing config. Re-read
            # and re-approved as the paragraph above requires: same checkout, same `publish` job, same
            # `pnpm exec semantic-release` a few steps below it, same reason.
            - release.yml:385
