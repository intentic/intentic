# Deliberate zizmor exceptions: each suppression states its tradeoff and the change that would retire it.
# Fix new findings rather than extending an exception without those reasons.
rules:
    # Mutable CI image tags are intentional: this pipeline builds/moves them so toolchain changes reach subsequent jobs without another commit.
    # Later jobs can pick up a newer pipeline's base; downstream guards must still reject failed base-image builds.
    # Remove this suppression if images move outside this pipeline or a bot supplies reviewable digest bumps.
    unpinned-images:
        ignore:
            - action-publish.yml
            - ci.yml
            - msstore-publish.yml
            - nightly.yml
            - perf-record.yml
            - release.yml
            - rollback.yml
            - verify.yml
            - webstore-publish.yml

    # Inherit secrets only into same-commit workflows in this repository, behind its reviewed-branch/fork boundary.
    # Enumerating names would cross the same boundary while adding a stale list.
    # Remove this suppression if any callee moves outside the repository; name each secret explicitly then.
    secrets-inherit:
        ignore:
            - ci.yml
            - release.yml

    # npm@latest supplies OIDC support missing from the pinned Node's npm; accept the unpinned fetch to track publisher requirements.
    # Remove this suppression and the install when the pinned Node ships a sufficiently new npm.
    adhoc-packages:
        ignore:
            - npm-publish.yml

    # Keep artipacked exceptions inline on the specific release.yml steps: file-wide ignores would hide new credential persistence.
    # Inline exceptions travel with the step, unlike line-number pins that break when unrelated code/comments move.
    # No file-wide artipacked ignore is allowed.
