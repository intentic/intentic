allowBuilds:
  "@ast-grep/lang-go": true
  "@ast-grep/lang-java": true
  "@ast-grep/lang-python": true
  "@ast-grep/lang-rust": true
  # The workspace watcher's native backend. Its `install` script only builds from source; the platform binding
  # ships as a prebuilt optional dependency (@parcel/watcher-linux-x64-glibc and friends), so skipping the
  # script still yields a working native watcher — verified by loading it with scripts disabled.
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@resvg/resvg-js": true
  baileys: true
  bun: true
  core-js: false
  cpu-features: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  node-pty: true
  onnxruntime-node: false
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  vue-demi: true
  # workerd is wrangler's local `wrangler dev` runtime; `wrangler deploy` uploads to Cloudflare and never
  # runs it, so its binary-download build script is skipped.
  workerd: false

# One catalog across all products. Version conflicts resolved to newest compatible:
# turbo 2.10.5, hono 4.12.27, @types/node 24.13.2 (aligned to Node 24 runtime),
# tailwindcss/@tailwindcss/vite 4.3.1. The former @intentic/graph + @intentic/sandbox-contract
# npm pins are gone — they are workspace packages now.
catalog:
  "@agentclientprotocol/sdk": 1.3.0
  "@anthropic-ai/claude-agent-sdk": 0.3.233
  "@astrojs/check": 0.9.10
  "@astrojs/sitemap": 3.7.3
  "@commitlint/cli": 21.2.1
  "@commitlint/config-conventional": 21.2.0
  "@commitlint/types": 21.2.0
  # Cursor's own agent runtime (cursor/ in the daemon), and the ONE entry in this catalog that is not
  # open-source: its licence is "all rights reserved, use subject to Cursor's Terms of Service", which grants
  # no redistribution. So it is a repo dependency for TYPES and for a dev run, and never rides a published
  # image: prepare-image-trees.sh prunes it and its platform packages out of the deployed tree, and
  # packs/cursor.Dockerfile installs the same pin back on the owner's OWN machine when they connect a Cursor
  # account. packs.integration.test.ts holds the two in step, the @openai/codex precedent.
  # ponytail: bump together with packs/cursor.Dockerfile.
  "@cursor/sdk": 1.0.28
  "@dagrejs/dagre": 3.0.0
  # DiceBear v10 discontinued the per-style npm packages (@dicebear/adventurer and its ~50 siblings) in favour of
  # one package of JSON style definitions, so the pair below is what used to be `core` + `adventurer`. They
  # version independently — core carries the renderer, styles carries the artwork — which is why both are here
  # rather than one entry standing in for the other.
  "@dicebear/core": 10.5.0
  "@dicebear/styles": 10.4.0
  "@discordjs/voice": 0.19.2
  "@hono/node-server": 2.0.12
  "@hono/otel": 1.1.2
