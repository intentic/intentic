  # Mutation testing, behind the `test-strength` chore and opted into by stryker.conf.mjs at the repo root.
  # BOTH PACKAGES, PINNED TO EACH OTHER: the runner embeds assumptions about the vitest it drives, and a core
  # that has moved past its runner fails at plugin-load rather than at a version check. Real dependencies rather
