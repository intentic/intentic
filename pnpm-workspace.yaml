  "@orpc/contract": 1.14.13
  "@orpc/openapi": 1.14.13
  "@orpc/openapi-client": 1.14.13
  "@orpc/server": 1.14.13
  # The plugin API the vendored anti-slop rules compile against, pinned to `oxlint` — see the override above.
  "@oxlint/plugins": 1.76.0
  "@playwright/mcp": 0.0.79
  "@playwright/test": 1.62.1
  "@primeuix/themes": 2.0.3
