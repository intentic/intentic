  json-schema-typed: 8.0.2
  knip: 6.31.0
  mailparser: 3.9.14
  # fileq's docx deriver: docx → semantic HTML, which webq's markdown writer then renders.
  mammoth: 1.12.2
  marked: 18.0.7
  # fileq's audio/video deriver: duration, codec facts and tags without decoding a frame.
  music-metadata: 11.15.0
  # The Opus decoder for received Discord voice (the gateway decodes packets to PCM for whisper; it never sends
  # audio, so nothing here encodes). napi-rs: the platform binding ships as a prebuilt optional dependency, one
  # per target and sixteen of them — including musl, which the binding it replaced had no prebuild for — and
  # there is no install script, so nothing is compiled or unpacked on install. That is the whole reason it is
  # here rather than @discordjs/opus, whose node-pre-gyp installer fetched a tarball over the network at install
  # time and dragged in a `tar` override to stay clear of a live path-traversal advisory.
  mediaplex: 1.0.0
  mermaid: 11.16.1
  monaco-editor-core: 0.55.1
  node-pty: 1.1.0
  oxlint: 1.76.0
  # Cyclomatic AND cognitive complexity as one rule. Cognitive is the metric worth having: it charges nothing
  # for flat dispatch, compounds for nesting, and names the lines that cost the most, which is what makes the
  # diagnostic actionable rather than a number to argue with. Its own peers (oxc-parser, estree-walker, diff)
  # are auto-installed.
  oxlint-plugin-complexity: 2.1.8
  # webq's HTML parser. parse5 rather than jsdom for the sandbox-image path: webq is baked into the daemon's
  # deployed tree, and parse5 is the spec-compliant parser alone (one dependency, no DOM emulation layer) —
