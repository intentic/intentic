packages:
  - "_apps/*"
  - "_libs/*"
  - "_tools/*"
  - "_extensions/*"

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build

useNodeVersion: 24.18.0

overrides:
  zod: 4.4.3
  # @posthog/core 1.40.1's tarball shipped dist .d.ts that import "../src/*.ts" (raw source), dragging posthog's
  # src into vue-tsc under our strict flags (58 errors); 1.40.2 fixes the declaration emit (types-only bump).
  "@posthog/core": 1.40.2

minimumReleaseAgeExclude:
  - knip@6.23.0
  - "@vue/language-core@3.3.6"
  - vite@8.1.2
  - vue-tsc@3.3.6
  - "@posthog/core@1.40.2"

allowBuilds:
  "@ast-grep/lang-go": true
  "@ast-grep/lang-java": true
  "@ast-grep/lang-python": true
  "@ast-grep/lang-rust": true
  "@discordjs/opus": true
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@resvg/resvg-js": true
  bun: true
  core-js: false
  cpu-features: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  node-pty: true
  onnxruntime-node: false
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  vue-demi: true

