packages:
  - "_computers/*"
  - "_deploy/*"
  - "_editor/*"
  # The store shells are deliberately NOT workspace packages: their dependencies are consumed by Xcode/
  # CocoaPods on a Mac (ios-app) and by Bubblewrap's own JDK toolchain (android-app), never by this
  # monorepo's node toolchain — each is installed standalone (`npm install` in its folder) on the machine
  # that actually builds it, so the shared lockfile and turbo graph stay free of mobile toolchains.
  - "!_editor/ios-app"
  - "!_editor/android-app"
  - "_extensions/*"
  - "_platform/*"
  - "_sandbox/*"
  - "_search/*"
  - "_site/*"
  - "_tools/*"

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build

# An agent conversation runs in a git worktree, which checks out TRACKED files only — so its node_modules are
# symlinks mirroring the main checkout's (agents/worktrees.ts). Resolution works through them, but pnpm's
# pre-run deps check compares state that is keyed to the workspace PATH, so it declares a mirrored worktree out
# of sync and runs a full recursive install before every `pnpm run` there — minutes, on a tree that is already
# correct. The check cannot be scoped to worktrees (it is not readable from .npmrc or the environment), so it
# is off everywhere: after changing a package.json, run `pnpm install` yourself rather than relying on a script
# to do it for you.
verifyDepsBeforeRun: false

nodeVersion: 24.18.0

overrides:
  zod: 4.4.3
  # THE ONE PACKAGE THE ZOD OVERRIDE ABOVE MUST NOT REACH. @cursor/sdk asks for `^3.25.0` and the blanket
  # override hands it 4.4.3 anyway, which is a MAJOR it was not written against, and the damage is silent
  # rather than loud: the SDK's published .d.ts is a ~52k-line wall of zod-3 type shapes, every public type in
  # it is a `z.infer<typeof …>` over one of them, and against zod 4's generics each of those collapses to
  # `unknown`. So the whole SDK type-checks as `any`-by-another-name — InteractionUpdate, ToolCall,
  # ModelListItem, all of it — and the daemon's Cursor adapter would have been written with no type safety at
  # all while appearing fully typed. cursor-events.test.ts pins the repair by asserting a real discriminated
  # union is visible, so a future blanket bump cannot quietly undo it.
  #
  # Scoped back to its declared range, the tw-to-css>postcss precedent. The second copy of zod this adds is
  # the point rather than a cost: two packages genuinely want different majors, and this workspace's own code
  # is unaffected because nothing here imports through @cursor/sdk's zod.
  "@cursor/sdk>zod": 3.25.76
  # @posthog/core 1.40.1's tarball shipped dist .d.ts that import "../src/*.ts" (raw source), dragging posthog's
  # src into vue-tsc under our strict flags (58 errors); 1.40.2 fixes the declaration emit (types-only bump).
  "@posthog/core": 1.40.2
  # astro 6.4's `sharp` is still an optional `^0.34.0`, so the catalog bump below reaches the site's own copy but
  # not astro's — and 0.34.x carries four libvips CVEs (GHSA-f88m-g3jw-g9cj). Overriding globally is also what
  # keeps the single-copy property the catalog entry asks for: astro, the site and @huggingface/transformers
  # (which already wanted 0.35.x) all land on one sharp.
  sharp: 0.35.3
  # astro-opengraph-images > tw-to-css pins postcss to an exact 8.4.31, which has two sourceMappingURL
  # arbitrary-file-read advisories (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849). Same major, and it dedupes onto
  # the 8.5.x copy the rest of the tree already resolves.
  "tw-to-css>postcss": 8.5.25
  # onnxruntime-node's `adm-zip: ^0.5.16` is used only by its postinstall unpacker, which `allowBuilds` disables
  # here — so GHSA-xcpc-8h2w-3j85 is unreachable in this workspace. Pinned to the patched 0.6.0 anyway so the
  # tree does not carry a known-bad copy for whoever enables that build later.
  "onnxruntime-node>adm-zip": 0.6.0
  # monaco-editor-core bundles its own dompurify 3.2.7 — eighteen sanitiser-bypass advisories, and unlike the
  # entries above this one is reachable: it is the sanitiser the editor runs over rendered markdown. Same major
  # as the catalog entry, so this dedupes the tree onto one copy rather than adding a second.
  "monaco-editor-core>dompurify": 3.4.13
  # mermaid pins dompurify to an exact 3.4.12, one patch below the fix for GHSA-55q2-fjhq-7xh7, and it is the
  # sanitiser mermaid runs over diagram labels. Same reasoning and same target as the entry above.
  "mermaid>dompurify": 3.4.13
  # miniflare (wrangler's local Workers runtime, a devDependency of the site) pins undici 7.28.0, which has five
  # request/response-smuggling advisories. Patch bump inside the same major.
  "miniflare>undici": 7.29.0
  # @connectrpc/connect-node (reached through @cursor/sdk) asks for undici ^5.28.4, and the 5.x line is EOL:
  # all twelve of its open advisories — three of them high — are fixed only in 6.x, so no in-range bump exists.
  # What connect-node imports is one thing, `Headers`, and it installs it as a global only when the Node major
  # is below 18 (node-headers-polyfill.js); on this workspace's Node 24 that branch is dead and none of the
  # vulnerable fetch, WebSocket or Set-Cookie code is ever entered. Bumped anyway so the tree does not carry a
  # known-bad copy: 6.28.0 is the newest 6.x and the copy discord.js already resolves, so this drops the 5.x
  # copy rather than adding a second one.
  "@connectrpc/connect-node>undici": 6.28.0
  # Two packages pin deepmerge-ts to the 7.x line — @prisma/config to an exact 7.1.5 and html-to-text (via
  # mailparser) to ^7.1.5 — and every 7.x release blows the stack on a recursive object graph
  # (GHSA-ggr8-5vv4-36mx, fixed only in 8.0.0; the 7.1.6 that landed just before it is still vulnerable).
  # Reachable on the IMAP path: html-to-text merges caller options with its defaults while rendering
  # attacker-supplied mail. Same package shape across the major (dual CJS/ESM, same exports map) and v8's
  # breaks are deep-Map merging plus two type renames, neither of which either consumer touches — both merge
  # plain option objects.
  deepmerge-ts: 8.0.1
  # Oxlint's JS plugin ABI is explicitly NOT semver-stable — the docs say so — so every copy of
  # @oxlint/plugins in the tree has to be the one `oxlint` itself was built against, or the config fails to
  # load before a single file is linted. oxlint-plugin-complexity asks for ^1.73.0, which floats to 1.80 on its
  # own; this holds it at the catalog pin instead.
  # ponytail: bump together with oxlint.
  "@oxlint/plugins": 1.76.0

