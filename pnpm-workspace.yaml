# Named catalog: the Astro site needs Vite 7 (astro@6 peer `vite: ^7`), while the Vue platform is on Vite 8.
# A genuine cross-major conflict that can't collapse to one version — the one justified split from the single catalog.
catalogs:
  site:
    vite: 7.3.5
