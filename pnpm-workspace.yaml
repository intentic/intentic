  "@iconify-json/ri": 1.2.10
  "@iconify/types": 2.0.0
  "@iconify/utils": 3.1.4
  "@iconify/vue": 5.0.1
  # The MCP server the platform speaks to Claude Code with (_platform/api/src/mcp). Its web-standard
