packages:
  - "_computers/*"
  - "_deploy/*"
  - "_editor/*"
  - "_extensions/*"
  - "_platform/*"
  - "_sandbox/*"
  - "_search/*"
  - "_site/*"
  - "_tools/*"

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build

# An agent conversation runs in a git worktree, which checks out TRACKED files only — so its node_modules are
# symlinks mirroring the main checkout's (agents/worktrees.ts). Resolution works through them, but pnpm's
# pre-run deps check compares state that is keyed to the workspace PATH, so it declares a mirrored worktree out
# of sync and runs a full recursive install before every `pnpm run` there — minutes, on a tree that is already
# correct. The check cannot be scoped to worktrees (it is not readable from .npmrc or the environment), so it
# is off everywhere: after changing a package.json, run `pnpm install` yourself rather than relying on a script
# to do it for you.
verifyDepsBeforeRun: false

useNodeVersion: 24.18.0

overrides:
  zod: 4.4.3
  # @posthog/core 1.40.1's tarball shipped dist .d.ts that import "../src/*.ts" (raw source), dragging posthog's
  # src into vue-tsc under our strict flags (58 errors); 1.40.2 fixes the declaration emit (types-only bump).
  "@posthog/core": 1.40.2
  # astro 6.4's `sharp` is still an optional `^0.34.0`, so the catalog bump below reaches the site's own copy but
  # not astro's — and 0.34.x carries four libvips CVEs (GHSA-f88m-g3jw-g9cj). Overriding globally is also what
  # keeps the single-copy property the catalog entry asks for: astro, the site and @huggingface/transformers
  # (which already wanted 0.35.x) all land on one sharp.
  sharp: 0.35.3
  # astro-opengraph-images > tw-to-css pins postcss to an exact 8.4.31, which has two sourceMappingURL
  # arbitrary-file-read advisories (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849). Same major, and it dedupes onto
  # the 8.5.x copy the rest of the tree already resolves.
  "tw-to-css>postcss": 8.5.25
  # onnxruntime-node's `adm-zip: ^0.5.16` is used only by its postinstall unpacker, which `allowBuilds` disables
  # here — so GHSA-xcpc-8h2w-3j85 is unreachable in this workspace. Pinned to the patched 0.6.0 anyway so the
  # tree does not carry a known-bad copy for whoever enables that build later.
  "onnxruntime-node>adm-zip": 0.6.0
  # monaco-editor-core bundles its own dompurify 3.2.7 — eighteen sanitiser-bypass advisories, and unlike the
  # entries above this one is reachable: it is the sanitiser the editor runs over rendered markdown. Same major
  # as the catalog entry, so this dedupes the tree onto one copy rather than adding a second.
  "monaco-editor-core>dompurify": 3.4.13
  # mermaid pins dompurify to an exact 3.4.12, one patch below the fix for GHSA-55q2-fjhq-7xh7, and it is the
  # sanitiser mermaid runs over diagram labels. Same reasoning and same target as the entry above.
  "mermaid>dompurify": 3.4.13
  # miniflare (wrangler's local Workers runtime, a devDependency of the site) pins undici 7.28.0, which has five
  # request/response-smuggling advisories. Patch bump inside the same major.
  "miniflare>undici": 7.29.0
  # @discordjs/node-pre-gyp unpacks @discordjs/opus's prebuilt binary with tar 6.2.1 — twelve path-traversal and
  # DoS advisories, on the code path that extracts an archive fetched over the network at install time. That
  # build is enabled in `allowBuilds`, so this is live rather than theoretical.
  "@discordjs/node-pre-gyp>tar": 7.5.22

minimumReleaseAgeExclude:
  - knip@6.29.0
  - "@vue/language-core@3.3.8"
  - vite@8.1.5
  - vue-tsc@3.3.8
  - "@posthog/core@1.40.2"
  - '@posthog/browser-common@0.2.5'
  - '@posthog/types@1.399.0'
  - imapflow@1.6.5
  - jose@6.2.5
  - posthog-js@1.408.2
  - astro-opengraph-images@1.17.4
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk@0.3.233'

allowBuilds:
  "@ast-grep/lang-go": true
  "@ast-grep/lang-java": true
  "@ast-grep/lang-python": true
  "@ast-grep/lang-rust": true
  "@discordjs/opus": true
  # The workspace watcher's native backend. Its `install` script only builds from source; the platform binding
  # ships as a prebuilt optional dependency (@parcel/watcher-linux-x64-glibc and friends), so skipping the
  # script still yields a working native watcher — verified by loading it with scripts disabled.
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@resvg/resvg-js": true
  # vsce's package-signing helper; its install script stages the platform signing binary vsce runs at
  # publish time.
  "@vscode/vsce-sign": true
  baileys: true
  bun: true
  core-js: false
  cpu-features: false
  esbuild: true
  # vsce's OS credential store, used only by interactive `vsce login`; CI publishes with VSCE_PAT in the
  # environment, so the native binding is never loaded.
  keytar: false
  lmdb: false
  msgpackr-extract: false
  node-pty: true
  onnxruntime-node: false
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  vue-demi: true
  # workerd is wrangler's local `wrangler dev` runtime; `wrangler deploy` uploads to Cloudflare and never
  # runs it, so its binary-download build script is skipped.
  workerd: false

# One catalog across all products. Version conflicts resolved to newest compatible:
# turbo 2.10.5, hono 4.12.27, @types/node 24.13.2 (aligned to Node 24 runtime),
# tailwindcss/@tailwindcss/vite 4.3.1. The former @intentic/graph + @intentic/sandbox-contract
# npm pins are gone — they are workspace packages now.
