org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Firebase Cloud Messaging is optional. With these four empty the app never touches Firebase and reports no wake
# token, so the sandbox cannot wake it and it answers only while it is open or set to "Stay connected". A build that can
# be woken sets them in ~/.gradle/gradle.properties or with -P on the command line; they belong to the Firebase project
# of whoever publishes that build, so a fork brings its own.
intentic.fcm.apiKey=
intentic.fcm.appId=
intentic.fcm.projectId=
intentic.fcm.senderId=
