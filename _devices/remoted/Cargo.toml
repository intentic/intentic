# intentic-remoted: a person's terminals (and, from phase 2, screens) on one of the owner's computers, served over one
# uplink per linked sandbox. A workspace of its own: it ships beside intentic-machine on Windows and Linux, and builds
# for windows-msvc with cargo-xwin, so nothing of netd's or castd's Linux-only build may reach it.
[workspace]

[package]
name = "intentic-remoted"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "remoted"
path = "src/lib.rs"

[[bin]]
name = "intentic-remoted"
path = "src/main.rs"

[features]
default = ["nvenc", "vaapi", "openh264"]
# openh264 (Cisco's, BSD) as the software encoder, built from source: what a screen falls back to where no hardware
# encoder passes its self-test. A Windows build always has it (below).
openh264 = ["cast-core/openh264"]
# NVIDIA's encoder (Linux): the driver's libnvidia-encode and libcuda are opened at runtime, so the binary runs where
# there is none; built against the ffnvcodec headers (bindgen).
nvenc = ["cast-core/nvenc"]
# VA-API's H.264 encoder (Intel, AMD, D3D12 on WSL2): libva and libva-drm are opened at runtime, so the binary runs
# where there is neither, and the build needs no headers.
vaapi = ["cast-core/vaapi"]
# x264 as the software encoder (links libx264, GPL-2.0): for measuring against castd, never in a shipped build.
x264 = ["cast-core/x264"]
# BGRX to I420 with libyuv instead of cast-core's portable converter (links libyuv).
libyuv = ["cast-core/libyuv"]
# A screen's sound through PulseAudio (or PipeWire's pulse server), Opus-encoded (links libpulse-simple and libopus).
pulse = ["cast-core/pulse", "opus"]
opus = ["cast-core/opus"]

[dependencies]
anyhow = "1"
# The media socket's upgrade (cast-core serves it on axum's WebSocket), on the stream hyper already holds.
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
base64 = "0.22"
# The terminal socket's messages, the device paths and close codes: one definition with the editor and netd.
browser-wire = { path = "../../_sandbox/netd/crates/browser-wire" }
bytes = "1"
# castd's streaming engine (capture traits, the shared encoder, rate control, the media socket, peers), with no C
# library of its own unless a feature above asks for one.
cast-core = { path = "../../_sandbox/castd/crates/cast-core", default-features = false }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = "0.4"
# ConPTY on Windows, openpty on Unix (wezterm's, MIT).
portable-pty = "0.9"
# Ed25519, to verify the sandbox's grant on each administrator run (src/service/admin.rs); rustls's own already.
ring = "0.17"
# ring, not the default aws-lc-rs: aws-lc needs cmake and NASM under cargo-xwin, ring builds with the C compiler alone.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "signal", "process", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["io"] }
# The uplink's carrier, exactly the ingress tunnel's: its WebSocket pump and its yamux session (netd opens, we accept).
tunnel = { path = "../../_sandbox/netd/crates/tunnel" }
# Each terminal's screen as a terminal would hold it, for the snapshot a viewer joining or catching up is drawn from.
vt100 = "0.16"
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# An X display's capture, input, cursor and clipboard (castd's), on a person's session or a virtual desktop.
cast-x11 = { path = "../../_sandbox/castd/crates/cast-x11" }
libc = "0.2"
# libpipewire-0.3, opened at run time for a Wayland session's screen cast (media/linux/wayland/pipewire.rs): a machine
# without PipeWire still runs remoted, and the build needs no PipeWire headers.
libloading = "0.8"
x11rb = { version = "0.13", features = ["randr"] }
# The desktop portal (ScreenCast, RemoteDesktop) on the person's session bus: pure Rust, on remoted's tokio runtime.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
# The Windows platform: DXGI duplication, NVENC and Media Foundation's encoders on D3D11, SendInput, the clipboard and
# WASAPI loopback. Its software encoder (openh264) and its Opus (opus1, libopus in Rust) are built from source and link
# nothing of the system's, so a Windows build always has both.
cast-win = { path = "../../_sandbox/castd/crates/cast-win" }
cast-core = { path = "../../_sandbox/castd/crates/cast-core", default-features = false, features = ["openh264", "opus1"] }
parking_lot = "0.12"
# The lock screen and admin prompts service (src/service/windows): the service manager, the SYSTEM token moved into
# the console session, access lists, the Ctrl+Alt+Del policy; for administrator runs the signed-in person's elevated
# token, their environment block and a cancellable read of the command's output.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
tokio = { version = "1", features = ["full", "test-util"] }

# Downloaded beside the agent on every computer that turns people's access on: strip and LTO like ic's.
[profile.release]
strip = true
lto = "thin"

# str0m from intentic's fork, pinned to a commit: str0m's main of 2026-11-21 (20 commits past 0.25.0, among them a
# NACKed packet resent at most once a round trip and a floor under the loss-based estimate) and one commit of ours,
# StreamTx::set_proactive_rtx, which a video track turns on across long, lossy links (cast-core's README, under
# "Copies"). Proposed upstream as https://github.com/algesten/str0m/pull/1171: once a str0m release on crates.io has it, drop this
# and require that release. _sandbox/castd's Cargo.toml pins the same commit.
[patch.crates-io]
str0m = { git = "https://github.com/intentic/str0m", rev = "6efe5a115384b7eb57e7caefbfaa5a3ed3c3bc07" }
