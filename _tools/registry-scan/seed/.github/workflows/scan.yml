name: scan

# Discovery runs nightly and decides nothing. It refreshes the derived facts straight onto main (no review
# gate on a star count) and opens ONE pull request per newly discovered extension, which is the only way
# anything is ever listed. Manually runnable so a maintainer can pull in a repo the moment it is tagged.
on:
    schedule:
        - cron: "17 3 * * *"
    workflow_dispatch:

# Two things must be true in repo settings or the last step fails on its first run: Settings → Actions →
# General → "Allow GitHub Actions to create and approve pull requests" must be ON, and a `listing` label must
# exist (gh pr create --label errors on a label that doesn't).
permissions:
    contents: read

concurrency:
    group: scan
    cancel-in-progress: false

jobs:
    scan:
        runs-on: ubuntu-latest
        steps:
            # App-created commits and pull requests trigger the protected admission workflow; GITHUB_TOKEN-
            # created events deliberately do not. The installation token is short-lived and scoped by the App.
            - name: Mint the registry bot token
              id: registry-token
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
              with:
                  app-id: ${{ vars.REGISTRY_APP_ID }}
                  private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ steps.registry-token.outputs.token }}
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"

            # Writes .claude-plugin/registry.generated.json in place, and one directory per proposal under
            # .scan/proposals/<extension-id>/ holding a complete candidate marketplace.json plus the pull
            # request's title and body. Every decision about JSON is made in there, so the steps below only
            # ever move whole files around.
            - name: Scan
              env:
                  GITHUB_TOKEN: ${{ steps.registry-token.outputs.token }}
                  REGISTRY_SCAN_VERSION: ${{ vars.REGISTRY_SCAN_VERSION }}
                  NPM_CONFIG_IGNORE_SCRIPTS: "true"
              run: |
                  set -euo pipefail
                  [[ "$REGISTRY_SCAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                      echo "REGISTRY_SCAN_VERSION must be an exact published version" >&2
                      exit 1
                  }
                  npm exec --yes --package="@intentic/registry-scan@$REGISTRY_SCAN_VERSION" -- intentic-registry-scan scan

            - name: Publish the run summary
              run: cat .scan/summary.md >> "$GITHUB_STEP_SUMMARY"

            - name: Commit refreshed facts
              run: |
                  git config user.name "intentic-registry-bot"
                  git config user.email "bot@intentic.dev"
                  git add .claude-plugin/registry.generated.json
                  git diff --cached --quiet || git commit -m "chore: refresh registry facts"
                  git push

            # One branch per proposal, reusing a branch name that already has an open pull request rather than
            # opening a second one. A closed-without-merge proposal comes back tomorrow — that is deliberate:
            # closing is not a decision the scan can read, so a maintainer who means "never" blocks the entry
            # instead, and the collision check then keeps it out for good.
            - name: Open a pull request per proposal
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  GH_TOKEN: ${{ steps.registry-token.outputs.token }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  for dir in .scan/proposals/*/; do
                      id="$(basename "$dir")"
                      branch="listing/$id"
                      if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qv '^0$'; then
                          echo "· $id already has an open pull request"
                          continue
                      fi
                      git checkout -B "$branch" "origin/$DEFAULT_BRANCH"
                      cp "$dir/marketplace.json" .claude-plugin/marketplace.json
                      git add .claude-plugin/marketplace.json
                      git commit -m "$(cat "$dir/title.txt")"
                      git push --force-with-lease -u origin "$branch"
                      gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
                          --title "$(cat "$dir/title.txt")" --body-file "$dir/body.md" --label listing
                  done
