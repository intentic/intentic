# Publish the @intentic/* packages to npm, with provenance, from the tag that the release export pushes here.
#
# This repository is a per-release snapshot of a private monorepo (see README), so a pushed `v*` tag is always
# a complete, version-stamped tree — there is nothing to bump and nothing to check out beyond the tag itself.
#
# Auth is tokenless. `id-token: write` lets npm exchange this run's OIDC token for a short-lived publish
# credential, which is also what makes the provenance attestation possible: the attestation names this
# repository, this workflow file, and this commit. Registering the trusted publisher is a ONE-TIME manual step
# per package on npmjs.com (Settings -> Trusted publisher -> GitHub Actions, workflow `npm-publish.yml`);
# a package that is missing it fails the exchange rather than falling back to anything.
name: npm publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # engines.node in package.json — one pinned version, not two.
          node-version-file: package.json
          cache: pnpm

      # OIDC trusted publishing landed in npm 11.5.1; Node 24 ships an older 11.x.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # Only the published closure, in the same shape release-prepare.sh builds it — the desktop app and the
      # extensions are in this tree but are not npm artifacts, and building them here buys nothing.
      - name: Build the published packages
        run: |
          source _tools/scripts/packages.sh
          filters=()
          for d in "${PUB[@]}"; do filters+=("--filter=./$d"); done
          pnpm turbo run build "${filters[@]}"

      - name: Publish
        run: bash _tools/scripts/publish-npm.sh "${GITHUB_REF_NAME#v}"
