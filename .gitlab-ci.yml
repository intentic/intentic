# GitLab CI/CD for the consolidated intentic monorepo (intentic/ = OSS core, platform/ = proprietary, site/).
# One pipeline: turbo build/test covers every product; images + release cover the published artifacts.
# Node + pnpm are pinned by package.json engines/packageManager — corepack reads packageManager, so no
# version is repeated here.

stages:
  - preflight
  - prebuild
  - test
  - images
  - release

variables:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # get_sources cleans every ignored file before each job, node_modules included — 59 `Removing …/node_modules/`
  # lines per job, and then the install rebuilds it from nothing: `pnpm install --frozen-lockfile` measured
  # 2m21s-3m43s in EVERY job of pipeline 2725042409, with a fully warm store and ZERO downloads. Four jobs pay
  # it, so ~12 minutes of runner time per pipeline goes into re-linking a tree that was already correct.
  # Excluding it lets the install reconcile what is there instead. Everything else ignored still goes (dist,
  # .turbo, .image-out), so no job can read a stale build output — turbo restores those from /ci-cache by hash.
  GIT_CLEAN_FLAGS: -ffdx -e node_modules
  # The prebaked job image every job below runs in (built by the `ci-base` job from _tools/ci-base).
  CI_BASE_IMAGE: $CI_REGISTRY_IMAGE/ci-base:latest
  # ci-base plus the Rust/Tauri/NSIS toolchain, for the three jobs that compile the desktop app (built by the
  # `ci-desktop` job from _tools/ci-desktop). Its own image rather than more layers on ci-base: it is ~2 GB that
  # test, mirror:verify, images and images:platform have no use for.
  CI_DESKTOP_IMAGE: $CI_REGISTRY_IMAGE/ci-desktop:latest
  # CI builds the site but never deploys it, so IndexNow submission is pure waste here — it polls the LIVE
  # site for the key file (90s timeout) and then retries a 403 five times, ~2 min per build. Submit from
  # wherever the site actually deploys.
  INDEXNOW_ENABLED: "0"
  # The two heavy caches live on a host directory the runner bind-mounts (docs/ci-runner.md — config.toml
  # `volumes = ["/srv/gitlab-runner/ci-cache:/ci-cache"]`), NOT in a GitLab `cache:` entry. Both are
  # content-addressed stores that every job reads and appends to — exactly what a shared volume is for, and
  # exactly what a per-job zip archive is worst at. The pnpm store is ~69k files and archiving it cost the test
  # job 6m19s per pipeline, CPU spent whether or not anything ever read the result. And mostly nothing did:
  # this runner has no distributed cache backend ("No URL provided, cache will not be downloaded from shared
  # cache server"), so each archive went to a Docker volume scoped to the CONCURRENT SLOT. Measured across five
  # main pipelines, only jobs that happened to land on concurrent-0 restored anything (71/74 turbo tasks
  # cached); slots 1-3 ran 0/74. A bind mount is shared by every slot, costs nothing to "restore", and needs no
  # S3/MinIO backend. If the volume is absent both paths fall back to the container's own filesystem — cold,
  # never broken.
  # pnpm ignores PNPM_STORE_PATH/PNPM_STORE_DIR, so the store is selected by the --store-dir flag below; this
  # variable is deliberately named so it can't be mistaken for one pnpm reads on its own.
  PNPM_STORE: /ci-cache/pnpm-store
  # turbo's own env var (verified against 2.10.7 — absolute paths work). Unlike the old per-branch cache keys,
  # one shared dir is safe for every branch at once: entries are keyed by task hash, so a hash either matches
  # or it doesn't. There is nothing for a branch to pollute.
  TURBO_CACHE_DIR: /ci-cache/turbo

# Named cache entries, composed per job with !reference — a job's `cache:` list can't splice another job's
# whole list, so each entry is named and jobs pick the set they need.
.cache-defs:
  # The baked iq models (~57MB), keyed on the fetch script — prepare-image-trees.sh skips the HF download
  # when this cache restores the completed dir. This one stays a GitLab cache rather than moving to /ci-cache:
  # it has to land inside .image-out (the sandbox image COPYs it as the `trees` context), and the images and
  # release jobs run it CONCURRENTLY — a shared dir would need the fetch to be race-safe first.
  iq-models:
    key:
      files:
        - _libs/iq-engine/scripts/fetch-model.mjs
      prefix: iq-models
    paths:
      - .image-out/iq-models
      - .image-out/.iq-models-complete

# Docker-in-Docker plumbing for every job that talks to a docker daemon. `extends` merges the variables map,
# so jobs stack their own variables on top.
.dind:
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"

.pnpm-setup:
  script:
    # corepack, pnpm and the node-gyp exec-bit fix are all baked into ci-base. These two lines exist only to
    # cover DRIFT: when package.json's packageManager moves ahead of the pnpm pinned in the image, corepack
    # fetches the new version here, and that freshly-fetched copy needs the same fix — corepack strips the exec
    # bit off its bundled gyp_main.py, and node-pty (no linux prebuild) compiles from source and invokes it
    # directly. When the versions match, both are no-ops.
    - pnpm --version
    - find "$HOME/.cache/node/corepack" -path '*node-gyp/gyp/gyp_main.py' -exec chmod +x {} +
    - pnpm install --frozen-lockfile --store-dir "$PNPM_STORE"
    # Bound the shared turbo cache: drop entries untouched for 14 days (rebuilt + re-cached if needed). This
    # matters more than it did as a cache archive — the dir now outlives the job, so nothing else evicts from it.
    - find "$TURBO_CACHE_DIR" -type f -mtime +14 -delete 2>/dev/null || true

default:
  # _tools/ci-base: node 24.18.0 + docker CLI/buildx + ripgrep + bun + pnpm, so no job installs tooling at
  # runtime. The tag is mutable (the ci-base job moves it on main), so gitlab-runner's pull_policy must stay
  # "always" — with the layers already on the host that is a manifest digest check, not a download.
  image: $CI_BASE_IMAGE
  before_script:
    - !reference [.pnpm-setup, script]

# The checks that read the checkout and nothing else, ahead of the install that every other job starts with.
#
# `prepass.mjs --checks-only` is the first half of the prepass the fleet already runs before landing (its header
# says what each invariant is): every test file sits in a type-check program, every machine-touching suite is
# named as one, and every package.json specifier is the one pnpm-lock.yaml recorded. No node_modules, no
# network, ~70ms of actual work — so this job deliberately clears the default before_script instead of
# installing, and its cost is the clone.
#
# The measurement that put it here: across 40 main pipelines, 22 `test` jobs failed and 10 of them died on one
# of these three invariants — 6 on ERR_PNPM_OUTDATED_LOCKFILE, 4 on a suite sitting under the wrong budget.
# Every one of those failed AFTER `pnpm install --frozen-lockfile` resolved 1,800+ packages (0.6-2.0 min), and
# because test, mirror:verify, desktop:check and desktop:verify all start with that same install, one stale
# lockfile burned four concurrent slots to say so four times. As its own STAGE rather than a `needs:` edge on
# each of them: a stage barrier keeps the existing ordering exactly as it was (nothing has to learn about this
# job), and jobs downstream of `test` inherit it through the `needs` they already declare.
#
# No `rules:` — this runs in every pipeline there is, including schedules. It is the cheapest job in the file
# and the only one whose failure means the rest cannot be worth starting.
preflight:
  stage: preflight
  interruptible: true
  before_script: []
  cache: []
  script:
    - node _tools/scripts/prepass.mjs --checks-only

# The CI job image itself. Runs ahead of everything, but ONLY when _tools/ci-base changes — every other pipeline
# skips it and the prebuild stage costs nothing. It cannot run in $CI_BASE_IMAGE (building that is the point), so
# it uses the plain docker CLI image and clears the default before_script/cache, which assume node + pnpm.
# `latest` is pushed ONLY from main: an MR touching this dir still builds the image to prove it compiles, but must
# not move the tag every other pipeline pulls. Consequence: an MR that needs a NEW tool in the base image cannot
# use it until the change lands on main.
ci-base:
  extends: .dind
  stage: prebuild
  interruptible: true
  # Digest-pinned like every other base in this repo (_apps/sandbox, _tools/dind-host); major matched to the
  # docker:27-dind service .dind attaches.
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  before_script: []
  cache: []
  rules:
    # Same `!= "schedule"` as the publish jobs, and for the same reason: on a scheduled pipeline `changes:` is
    # unconditionally true, so without this the nightly would rebuild and re-push the mutable `latest` base tag
    # every night against a commit that never touched it.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
      changes:
        - _tools/ci-base/**/*
      variables:
        PUSH_BASE: "1"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - _tools/ci-base/**/*
      variables:
        PUSH_BASE: "0"
  script:
    - docker build -t "$CI_BASE_IMAGE" _tools/ci-base
    - |
      if [ "$PUSH_BASE" = "1" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker push "$CI_BASE_IMAGE"
      else
        echo "merge request — image built for validation only, tag not moved"
      fi

# ci-base + the desktop toolchain, for desktop:check, desktop:verify and release. Same job shape and the same
# push rule as ci-base above; what it deletes is the per-job toolchain install those three jobs opened with —
# 2m53s of apt and 41s of rustup, measured in release job 15686372011 and paid again by every desktop job in
# every pipeline. The tools are unchanged, only their moment: build-desktop.sh still installs them when they are
# missing, which is now the developer-machine path.
#
# It rebuilds when EITHER dir changes, because its FROM is ci-base's mutable `latest` — a ci-base bump that
# didn't rebuild this image would leave the desktop jobs on a stale base. `needs` orders it after that rebuild
# and is optional so a pipeline without a ci-base job still runs this one.
#
# FIRST LANDING: the desktop jobs pull this by tag, so it has to exist before they can start. A main pipeline
# creates it in `prebuild`, ahead of their stage. On the merge request that introduces it the tag is not there
# yet and those jobs cannot pull — push it once by hand from a main checkout, or land this and let the main
# pipeline mint it.
ci-desktop:
  extends: .dind
  stage: prebuild
  interruptible: true
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  before_script: []
  cache: []
  needs:
    - job: ci-base
      optional: true
  # 3.75 GB unpacked and a ~200-crate cargo-xwin compile inside it, so it gets room beyond the 1h default.
  timeout: 90m
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
      changes: &ci-desktop-changes
        - _tools/ci-desktop/**/*
        - _tools/ci-base/**/*
      variables:
        PUSH_DESKTOP: "1"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *ci-desktop-changes
      variables:
        PUSH_DESKTOP: "0"
  script:
    # The login is unconditional here, unlike ci-base: FROM is the private ci-base:latest, so even a
    # validation-only build has to authenticate to pull it.
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_DESKTOP_IMAGE" _tools/ci-desktop
    - |
      if [ "$PUSH_DESKTOP" = "1" ]; then
        docker push "$CI_DESKTOP_IMAGE"
      else
        echo "merge request — image built for validation only, tag not moved"
      fi

# Build + test every product (turbo runs across intentic/, platform/, site/): the MR gate, and on main the
# verify step the images + release stages wait on via stage ordering — a red build publishes nothing.
# Interruptible on main too: a superseded pipeline's verify is safely canceled (the release job itself is not
# interruptible and its resource_group serializes releases; the newest pipeline releases the newest commit).
test:
  stage: test
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  # `typecheck` is the one that reads the TEST files. `build` cannot: an emitting package excludes *.test.ts so
  # test code stays out of dist, which left the tests unchecked by anything but their own execution — hand-built
  # fakes drifted out of shape with the seams they stand in for, and only ever said so as an opaque 500 in some
  # unrelated suite.
  #
  # It runs FIRST, and as its own `pnpm typecheck` rather than folded into the graph below, for one reason: that
  # is half of the exact command an agent runs on its branch before landing (`pnpm verify`, AGENTS.md); the
  # other half is `pnpm test`, which is this job's second line minus the `build` half of the graph — a worktree
  # cannot run `build` at all (EXDEV), so the fleet's gate proves the tests against a `tsgo -b` dist and CI
  # proves the same tests against the real build outputs on top. It used to sit in the graph
  # depending on `^build` — and a pnpm `build` dies EXDEV in an agent worktree, so the check that decided
  # whether main was green was the one check nobody in the fleet could run. It now emits its own declarations
  # (the `tsgo -b` prepass the script runs before turbo), needs nothing from the graph, and fails in seconds
  # instead of after a full build + test.
  #
  # Then one turbo invocation, not two: `build` then `test` as separate calls is a hard barrier — every package
  # must finish building before ANY test starts. A single `build test` graph lets each package's tests run the
  # moment its own deps are built while the rest of the monorepo is still compiling.
  script:
    - pnpm typecheck
    - pnpm turbo run build test

# The public GitHub mirror, proven before it can be published. verify-mirror.sh materialises the export
# (_tools/scripts/public.sh) into a scratch tree, reconciles the lockfile against the subset, installs it
# frozen, and type-checks it — the three failures a subset has and the monorepo cannot: a public package
# growing a workspace dependency on a private one, a root devDependency the export doesn't carry, a lockfile
# that can't prune to the packages that remain.
#
# It runs on main as well as on merge requests, and the release job `needs` it, because the release publishes
# the mirror unattended: this is the job that makes a one-shot cutover safe. A red mirror blocks the release
# and nothing else — the monorepo itself is unaffected by anything found here.
mirror:verify:
  stage: test
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - bash _tools/scripts/verify-mirror.sh

# The desktop app (_apps/desktop): Rust fmt/clippy/tests + the launcher UI build. Runs only when the desktop
# tree changes — on MRs as the gate, and on main so a broken desktop surfaces before the release job's
# build-desktop.sh cross-builds the same crate. clippy compiles against real webkit2gtk, covering the Linux
# target; the Windows msvc target is covered by that release cross-build.
#
# The cargo store rides /ci-cache like pnpm and turbo (see the note on the variables above): it is another
# content-addressed store every run reads and appends to, which is exactly what a bind mount is for and what a
# per-job zip archive is worst at. Absent volume ⇒ cold but never broken.
desktop:check:
  stage: test
  # The toolchain image, not ci-base: rustup + rustfmt + clippy + webkit2gtk's dev headers are baked (see the
  # ci-desktop job), so this job's before_script is the plain install again.
  image: $CI_DESKTOP_IMAGE
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &desktop-changes
        - _apps/desktop/**/*
        - _apps/site/public/scripts/**/*
        - _libs/ui/**/*
        - pnpm-lock.yaml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *desktop-changes
  variables:
    # The registry, shared. Overriding CARGO_HOME does not hide the baked toolchain: rustup's proxies live in the
    # image's own /usr/local/cargo/bin, which is on PATH, and they find toolchains through RUSTUP_HOME — so
    # `cargo`, `clippy` and `cargo-xwin` all still resolve while the downloads land in /ci-cache. Verified by
    # running the release's Windows cross-build in the image with exactly this override.
    CARGO_HOME: /ci-cache/cargo
    # A target dir per job, never one shared: cargo holds an EXCLUSIVE file lock on a target directory for the
    # length of a build, so two jobs pointed at one directory serialize instead of running beside each other.
    # There is a second reason beyond the lock — a build's fingerprint includes the stamped version, and the
    # desktop crate's is what every run of this app's build changes, so jobs sharing a directory invalidate each
    # other's leaf crate and each pays a fresh LTO. Measured: version 0.0.0 → 1.180.2 recompiles exactly 1 crate
    # in 20s, and rebuilding the SAME version is a 1s no-op. CARGO_HOME stays shared — the registry is built for
    # concurrent readers and is where the reuse actually is (jobs still queue briefly on its package-cache lock;
    # pipeline 2726820001 logged one such wait in each desktop job).
    CARGO_TARGET_DIR: /ci-cache/desktop-check-target
  script:
    # The launcher UI first: `tauri build` would run it anyway, and a Vue error is worth failing on in seconds
    # rather than after a cargo build.
    - pnpm --filter @intentic/desktop-app build
    - cargo fmt --manifest-path _apps/desktop/src-tauri/Cargo.toml --all --check
    - cargo clippy --manifest-path _apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
    - cargo test --manifest-path _apps/desktop/src-tauri/Cargo.toml

# The desktop ARTIFACTS: build the Linux bundles exactly the way the release builds them, then verify what came
# out. Three tiers in one job, ordered by cost, each proving something the one before it cannot:
#
#   1. build-desktop.sh ends by running verify-desktop-bundle.sh over its own output — the bundled scripts are
#      present and byte-identical, and the .desktop entry registers intentic://. Seconds, no Docker.
#   2. verify-desktop-install.sh installs the .deb and the AppImage on a BARE Debian (no GUI libraries), starts
#      the app under Xvfb and fires a real xdg-open intentic:// at it. This is what catches an incomplete
#      Depends field — a package that installs cleanly everywhere except a user's machine.
#   3. (schedule only) verify-desktop-setup.sh runs the connect.sh EXTRACTED FROM THE INSTALLER on a clean
#      Docker host and waits for the sandbox daemon to answer /health. Pulls the sandbox image, so it is
#      nightly rather than per-push.
#
# NOT on merge requests: this is a release-profile Tauri build (minutes even with a warm cargo registry, and
# its own target dir is cold until a desktop change is pushed twice), and desktop:check's debug build + clippy
# + tests is the fast MR gate. The argument
# assembly this job cannot reach — the .ps1 named-parameter conventions that only ever run on Windows — is
# covered by unit tests in commands.rs instead, which is why those tests take a Host rather than reading cfg!.
#
# WINDOWS: no runner here can execute Intentic-setup.exe, so the NSIS installer is verified only as an archive
# (tier 1 reads it with 7z). When a Windows runner exists, its job belongs beside this one: same artifacts, and
# the assertions smoke.sh makes through xdg-mime/xdotool have direct equivalents in the registry and the window
# list.
desktop:verify:
  extends: .dind
  stage: test
  image: $CI_DESKTOP_IMAGE
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *desktop-changes
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    CARGO_HOME: /ci-cache/cargo
    # Its own directory, not the release's: this job always builds version 0.0.0 and the release always builds a
    # new one, so sharing meant each run invalidated the other's leaf crate and paid a fresh LTO for it (~4 min).
    # Apart is how this job gets to rebuild only when its OWN inputs changed.
    CARGO_TARGET_DIR: /ci-cache/desktop-verify-target
    # Prebuilt where available; both scripts fall back to building their context locally.
    INTENTIC_HOST_IMAGE: "$CI_REGISTRY_IMAGE/dind-host:latest"
    SANDBOX_E2E_IMAGE: "$CI_REGISTRY_IMAGE/sandbox:latest"
  timeout: 90m
  before_script:
    - !reference [.pnpm-setup, script]
  script:
    # A fixed 0.0.0: nothing here is published, and the version only names the bundle files.
    - bash _tools/scripts/build-desktop.sh 0.0.0 --linux-only
    - bash _tools/scripts/verify-desktop-install.sh
    - if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then bash _tools/scripts/verify-desktop-setup.sh; fi

# Hermetic infra e2e on merge requests — NON-BLOCKING sidecar (allow_failure). Boots a Docker-in-Docker host
# via testcontainers and drives the real CLI (resolve -> targeted apply -> adopt -> readiness diagnostics), no
# external services or secrets. turbo scopes e2e:hermetic to @intentic/cli.
e2e:hermetic:
  extends: .dind
  stage: test
  interruptible: true
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    INTENTIC_HOST_IMAGE: "$CI_REGISTRY_IMAGE/dind-host:latest"
    INTENTIC_LOG_DIR: "$CI_PROJECT_DIR/.e2e-hermetic-logs"
  timeout: 45m
  script:
    - pnpm e2e:hermetic
  artifacts:
    when: on_failure
    paths:
      - .e2e-hermetic-logs/
    expire_in: 1 week

# Nightly gated e2e (scheduled): the sandbox-daemon tier always, plus whatever CI vars unlock (DISCORD_E2E_*,
# CLOUDFLARE_API_TOKEN/CLOUDFLARE_ZONE). Each suite self-skips without its secrets. Runs the freshly published
# :latest sandbox image (SANDBOX_E2E_IMAGE) rather than rebuilding from source.
e2e:nightly:
  extends: .dind
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    SANDBOX_E2E_IMAGE: "$CI_REGISTRY_IMAGE/sandbox:latest"
  timeout: 3h
  cache:
    - key: intentic-e2e-whisper
      paths:
        - .cache/intentic-e2e
  before_script:
    - !reference [.pnpm-setup, script]
    - mkdir -p "$HOME/.cache" "$CI_PROJECT_DIR/.cache/intentic-e2e" && ln -sfn "$CI_PROJECT_DIR/.cache/intentic-e2e" "$HOME/.cache/intentic-e2e"
  script:
    - pnpm e2e

# Continuous image publishing: build + push sandbox + dind-host to the GitLab Container Registry on every push
# to main that touches the core (moving `latest` + the commit SHA). The version-tagged image is the release
# job. The changes: globs must cover the image's WHOLE input closure — the baked trees (sandbox, cli, iq, lsp,
# the discord/imap extension gateways) plus the context COPYs and the workspace packages they depend on
# (@intentic/constants and @intentic/tsconfig live under _tools) — so _extensions and _tools are matched
# wholesale: hand-enumerating subdirs is how iq/lsp/_extensions silently fell out of the trigger last time.
images:
  extends: .dind
  stage: images
  # ci-base (node + docker CLI), not a bare docker:27 image: prepare-image-trees.sh compiles the payload
  # JOB-side — with the warm pnpm store + turbo cache from the test job it's a cache replay, and the
  # Dockerfile is left with pure COPYs.
  interruptible: true
  # `test` alone, not the whole stage. A plain stage barrier makes this job wait for the SLOWEST job in `test`
  # and skips it outright if any of them FAILED — so a desktop clippy warning, or the linuxdeploy download
  # desktop:verify fetches from GitHub at bundle time, stops the images and the platform deploy for a reason
  # neither has anything to do with. Both happened: pipelines 2725556418 and 2725541206 skipped this job on a
  # desktop:check failure, and in 2725612642 `release` (which already had needs) started 4s after test while
  # images:platform waited 4m30s on desktop:check. mirror:verify is deliberately absent too — it proves the
  # public export installs, which the release job needs and these images do not. The cache assumption above is
  # unaffected: `test` is the job that fills the turbo cache and it still completes first.
  needs: ["test"]
  cache:
    - !reference [.cache-defs, iq-models]
  before_script:
    - !reference [.pnpm-setup, script]
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  # `!= "schedule"`, here and on images:platform and release: a scheduled pipeline runs on main with no diff, so
  # `changes:` is unconditionally true in one and every publish/deploy rule in this file would match. The nightly
  # exists to run the deep verification tiers, not to re-tag images and roll production at 03:00 for no commit.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
      changes:
        - _apps/sandbox/**/*
        - _apps/cli/**/*
        - _apps/iq/**/*
        - _apps/lsp/**/*
        - _libs/**/*
        - _extensions/**/*
        - _tools/**/*
        - turbo.json
        - pnpm-lock.yaml
  script:
    - bash _tools/scripts/prepare-image-trees.sh
    - TAGS="latest sha-${CI_COMMIT_SHORT_SHA}" bash _tools/scripts/publish-images.sh

# Platform image publishing: build + push web + api on every push to main that touches the platform (moving
# `latest` + the commit SHA). Separate from `images` (the OSS core: trees payload, semantic-release tags) but
# the SAME philosophy: apps build job-side under turbo (warm caches from the test job — hence policy: pull),
# and the Dockerfiles are pure COPY. docker:release's TURBO_HASH tag makes the release content-addressed, so
# the changes: globs are deliberately COARSE — anything in the workspace dirs the platform's dependency
# closure can reach (web compiles in _extensions UI bundles; @intentic/constants et al live under _tools) —
# and a push that didn't change an app's actual inputs just re-tags the existing image registry-side. The job
# ends by rolling the Komodo stack named in PLATFORM_DEPLOY_STACK (deploy-platform.sh) — set per-branch in the
# rules below, so a branch without it publishes images and deploys nothing.
images:platform:
  extends: .dind
  stage: images
  interruptible: true
  # Same reasoning as the images job above, and this is the one it was written for: nothing about api/web is
  # proven by a Tauri build, so the desktop jobs must not sit between a green `test` and a platform deploy.
  needs: ["test"]
  before_script:
    - !reference [.pnpm-setup, script]
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
      changes:
        - _apps/api/**/*
        - _apps/web/**/*
        - _libs/**/*
        - _extensions/**/*
        - _tools/**/*
        - turbo.json
        - pnpm-lock.yaml
      variables:
        PLATFORM_DEPLOY_STACK: "intentic-platform"
  script:
    - pnpm turbo run docker:release --filter=@intentic-app/api --filter=@intentic-app/web
    - DEPLOY_VERSION=$CI_COMMIT_SHORT_SHA bash _tools/scripts/deploy-platform.sh

# Release: semantic-release over the test job's verified build — the cross-compiled machine agents and the
# desktop installers, the sandbox/dind-host images at the release version + moving `stable` tag, and the
# export to the public GitHub mirror, whose pushed tag is what publishes the npm packages (publish-github.sh).
release:
  extends: .dind
  stage: release
  # The desktop toolchain image: prepareCmd runs build-desktop.sh, which is a Rust build like desktop:check's.
  # Everything ci-base carries comes with it, so nothing else in this job changes.
  image: $CI_DESKTOP_IMAGE
  # test AND mirror:verify — deliberately NOT the images job. The release builds its own sandbox tree because semantic-release's
  # prepareCmd stamps the release version into every package.json first, and the sandbox READS that at runtime
  # (src/version.ts; ensure-intent's dependencySpec switches `link:` → `~<version>` on it). The images job's
  # sha-/latest images are built unstamped (0.0.0 = dev mode), so they are NOT retaggable as a release. The
  # duplicated work is bounded by the inline layer cache both jobs read off the published sandbox:latest /
  # :stable (publish-images.sh), and running parallel to images keeps it off the critical path — provided the
  # runner has slots free (gitlab-runner concurrent >= 6, docs/ci-runner.md — the images jobs come free at the
  # same moment this one does, and a desktop:verify may still be holding a slot).
  # mirror:verify is the second gate for one reason: this job publishes the public mirror unattended, and an
  # export that doesn't install is a broken public repo AND no npm release (the mirror's tag is what triggers
  # the npm publish). Proving it on the merge request is what keeps that safe.
  #
  # desktop:verify is OPTIONAL because it is rule-gated on the desktop tree changing, and a release that touches
  # nothing desktop-shaped must still go out — `optional: true` means "wait for it and require it when this
  # pipeline has one, ignore it when it does not". It is not the real gate on the installers: release-prepare.sh
  # verifies the artifacts this job builds ITSELF, because those are the bytes that get published and no other
  # job's output can stand in for them. This edge is the cheap half of the same fix — when the pipeline already
  # knows the desktop is broken, spend zero of the release's forty minutes finding out again.
  needs:
    - "test"
    - "mirror:verify"
    - job: "desktop:verify"
      optional: true
  resource_group: release
  # The publish is heavy (a cold image build pushes ~1.5 GB). Give it room beyond the 1h default so a cold
  # first-build can't fail the job AFTER the release already succeeded. NOTE: if the job still stops at
  # exactly 1h, that's the runner's maximum_timeout — raise it in the runner config, this can't override it.
  timeout: 2h
  cache:
    # iq models for publishCmd's prepare-image-trees.sh (same key as the images job).
    - !reference [.cache-defs, iq-models]
  variables:
    GIT_DEPTH: 0
    # build-desktop.sh cross-builds the Tauri app here too; same shared cargo store as desktop:check.
    CARGO_HOME: /ci-cache/cargo
    CARGO_TARGET_DIR: /ci-cache/desktop-target
    # cargo-xwin's MSVC CRT + Windows SDK (~1.1 GB), on the shared volume for the same reason the cargo registry
    # is: a content-addressed download that every run reads and none modifies. Its default lives under
    # $HOME/.cache, which dies with the container, so every release re-downloaded it — "✅ Downloaded MSVC CRT in
    # 2m 40s" (job 15686372011) and 2m 44s the release before. Verified by running the cross-build twice in the
    # ci-desktop image with this variable pointed at a directory that outlives the container: the first run
    # downloads, the second logs no download at all.
    XWIN_CACHE_DIR: /ci-cache/xwin
  # GITHUB_TOKEN (masked CI variable) is the only credential this job needs for the public side: a fine-grained
  # PAT on radarsu/intentic with Contents read+write, which publish-github.sh uses to push the snapshot commit,
  # the tag, and the Release with its installers. There is NO npm credential here any more — the packages are
  # published by GitHub Actions off that tag, tokenless, through npm's OIDC trusted publishing, which the
  # self-hosted runner here could never use and which is what earns the packages their provenance badge.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
  before_script:
    - !reference [.pnpm-setup, script]
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - git remote set-url --push origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - pnpm exec semantic-release
