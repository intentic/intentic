<!doctype html>
<!-- No look in the tag, for the reason _editor/web/index.html carries none: this IS that app, and it opens in
     the reader's own light. Both attributes spell their off state by being absent. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>intentic — interactive demo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="robots" content="noindex" />
        <!-- Approximates the canvas token in each scheme (oklch(16% 0.007 65) dark, paper-tinted surface-100 light);
             repointed by the script below, since this page can hold a scheme that parts from the reader's OS. -->
        <meta name="theme-color" content="#f4f1ec" />
<!-- The app's own pre-paint rule, minus the profile half no demo link carries: a stored choice, else the OS,
             else daylight — and sanctum is the dark look, so an unpinned skin follows the scheme. Keeping this in
             step with _editor/web/index.html is what stops the demo painting one look and useTheme correcting it. -->
        <script>
            try {
                var uiScheme = localStorage.getItem("ui-color-scheme");
                var dark = uiScheme === "dark" || (uiScheme !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
                if (dark) document.documentElement.setAttribute("data-mode", "dark");
                var uiSkin = localStorage.getItem("ui-skin");
                if (uiSkin === "sanctum" || (uiSkin !== "none" && dark)) document.documentElement.setAttribute("data-skin", "sanctum");
                var themeMeta = document.querySelector('meta[name="theme-color"]');
                if (themeMeta) themeMeta.setAttribute("content", dark ? "#141210" : "#f4f1ec");
            } catch (e) {}
        </script>
<!-- The runtime config the app reads synchronously at module-eval time (src/environments/environment.ts). -->
        <script>
            window.env = {
                production: true,
                api: { url: "https://api.demo.invalid" },
                auth: { googleClientId: "" },
                analytics: { posthogKey: "", posthogHost: "https://us.i.posthog.com" },
                // The site has no /login — that's the app's page, and the demo lives under /demo/. Signing out
                // of a demo session lands the visitor back on the homepage they pressed play from.
                afterSignOut: "/",
            };
        </script>
<!-- Extension bundles resolve these bare specifiers to the app's own instances (see _editor/web/index.html). -->
        <script type="importmap">
            {
                "imports": {
                    "vue": "/demo/ext-shims/vue.js",
                    "@intentic/extension-api": "/demo/ext-shims/extension-api.js",
                    "@intentic/extension-manifest": "/demo/ext-shims/extension-manifest.js",
                    "@intentic/extension-ui": "/demo/ext-shims/extension-ui.js",
                    "@tanstack/vue-query": "/demo/ext-shims/vue-query.js"
                }
            }
        </script>
<!-- The .ico is first and unqualified because that is the one every crawler, feed reader and pinned-tab list asks for by convention. -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<!-- The demo boots the app's own main.ts, so it inherits the app's faces.css and the files under the app's
             public/ — which this build shares. Preloaded under the demo's base. -->
        <link rel="preload" as="font" type="font/woff2" href="/fonts/public-sans-100-900-latin.woff2" crossorigin />
    </head>
    <body class="bg-canvas text-content">
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
        <noscript>The interactive demo needs JavaScript. Every screenshot on intentic.dev is of this same UI.</noscript>
    </body>
</html>
