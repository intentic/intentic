# Pure-logic core of the desktop app: probes, reconcile fixes, engines, and the sandbox container
# lifecycle. Deliberately free of Tauri/GTK dependencies so `cargo test -p intentic-desktop-core`
# compiles and runs on any machine (CI or a dev box without webkit2gtk).
[package]
name = "intentic-desktop-core"
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
