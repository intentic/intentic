# What both of the tunnel's Rust ends relay HTTP with: the edge (_platform/ingress) and the sandbox's netd
# (_sandbox/netd) build it by path. Its own workspace, so it builds and tests apart from either.
[package]
name = "relay"
edition = "2024"
version = "0.0.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["full"] }
